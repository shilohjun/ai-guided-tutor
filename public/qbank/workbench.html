<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>题库工作台 · 步步解</title>
<script>
window.addEventListener('error', function (e) { document.title = 'JSERR: ' + e.message; });
(function () {
  var KEY = 'bsj-theme';
  var q = /[?&]theme=(dark|light)/.exec(location.search);
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { }
  var p = q ? q[1] : saved;
  if (p !== 'light' && p !== 'dark') p = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', p);
})();
</script>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
/* ===== 设计 token：与 public/index.html、public/qbank/map.html 同源 ===== */
:root{
  --font-sans: "Nunito","Noto Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono: "JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",monospace;

  --paper:#F7F8FA; --surface:#FFFFFF; --surface-2:#F4F5F7; --surface-3:#E9EBEF;
  --line:#E6E8EC; --line-strong:#D3D6DC;
  --ink:#1A1A1A; --ink-2:#4A4A4A; --ink-3:#6E6E6E; --ink-4:#9A9A9A;

  --brand:#4F46C8; --brand-strong:#3D3599; --brand-tint:#EEEDFB; --brand-line:#D5D2F2; --brand-ink:#403AB0;
  --mint:#1F7A5F; --mint-tint:#EAF4F0;
  --amber:#8A6A2A; --amber-tint:#FBF3E4;
  --coral:#B23B3B; --coral-tint:#FBEDED;

  --shadow-1:0 1px 2px rgba(26,26,26,.04), 0 8px 24px rgba(26,26,26,.05);
  --shadow-2:0 16px 40px rgba(26,26,26,.10);

  --r-sub:16px; --r-inner:8px; --r-pill:999px;

  --fs-meta:11px; --fs-body:13px; --fs-lead:13px; --fs-sub:15px; --fs-title:18px;
  --topbar:52px;
}
html[data-theme="dark"]{
  --paper:#121216; --surface:#1A1A1F; --surface-2:#232329; --surface-3:#2C2C34;
  --line:#33333B; --line-strong:#45454F;
  --ink:#F2F2F5; --ink-2:#B4B4BE; --ink-3:#8C8C99; --ink-4:#66666F;
  --brand:#6F67E0; --brand-strong:#8A83EA; --brand-tint:#26243F; --brand-line:#3E3A6B; --brand-ink:#C9C5F7;
  --mint:#5FBFA0; --mint-tint:#1B2B26;
  --amber:#D6B877; --amber-tint:#2A2419;
  --coral:#E08A8A; --coral-tint:#2E1E1E;
  --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-2:0 16px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);
  font-size:var(--fs-body);line-height:1.5;display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand-ink);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- 顶栏 ---------- */
.wb-top{
  flex:none;height:var(--topbar);display:flex;align-items:center;gap:12px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);
}
.wb-brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.wb-brand b{font-size:var(--fs-sub);font-weight:600;white-space:nowrap}
.wb-brand span{font-size:var(--fs-meta);color:var(--ink-3);white-space:nowrap}
.wb-search{flex:1;min-width:200px;position:relative;display:flex;align-items:center}
.wb-search input{
  width:100%;height:34px;padding:0 12px 0 32px;border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:var(--fs-body);outline:none;
  transition:border-color .16s,background .16s;
}
.wb-search input::placeholder{color:var(--ink-3)}
.wb-search input:focus{border-color:color-mix(in srgb,var(--brand) 50%,transparent);background:var(--surface)}
.wb-search .ico{position:absolute;left:11px;color:var(--ink-3);font-size:var(--fs-body);pointer-events:none}
.wb-count{font-size:var(--fs-meta);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.wb-modes{flex:none;display:flex;gap:2px;padding:2px;background:var(--surface-2);border-radius:var(--r-pill)}
.wb-modes button{
  height:24px;padding:0 10px;border:0;border-radius:var(--r-pill);background:transparent;
  color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;transition:background .16s,color .16s,box-shadow .16s;
}
.wb-modes button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1)}
.wb-modes button:not([aria-selected="true"]):hover{color:var(--ink-2)}

/* 悬停说明：每个选项一句话讲清它的特点 */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;top:50%;left:calc(100% + 8px);transform:translateY(-50%);
  width:max-content;max-width:240px;padding:6px 8px;border-radius:var(--r-inner);
  background:var(--ink);color:var(--surface);font-size:var(--fs-meta);line-height:1.5;font-weight:400;
  white-space:normal;text-align:left;opacity:0;pointer-events:none;transition:opacity .14s;z-index:40;
  box-shadow:var(--shadow-2);
}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}

.wb-btn.push{margin-left:auto}
.wb-top .grow{flex:1}
.wb-btn{
  height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;
  border:1px solid var(--line);border-radius:var(--r-inner);background:var(--surface);
  color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;transition:color .16s,border-color .16s,background .16s;
}
.wb-btn:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.wb-btn.icon{width:30px;padding:0;justify-content:center;font-size:var(--fs-body)}

/* ---------- 三栏工作区 ---------- */
.wb{
  flex:1;min-height:0;display:grid;
  grid-template-columns:var(--rail-w,240px) 10px minmax(0,1fr) 10px var(--detail-w,360px);
  grid-template-rows:minmax(0,1fr);   /* 只有一行，且这一行可以被压到比内容矮 —— 否则三栏都不出滚动条 */
  overflow:hidden;
}
.wb-split{position:relative;cursor:col-resize;touch-action:none}
.wb-split::after{
  content:"";position:absolute;top:16px;bottom:16px;left:50%;width:2px;transform:translateX(-50%);
  border-radius:var(--r-pill);background:var(--line-strong);opacity:.5;transition:opacity .16s,background .16s;
}
.wb-split:hover::after,.wb-split:focus-visible::after,.wb-split.dragging::after{opacity:1;background:var(--brand)}
body.resizing{cursor:col-resize;user-select:none}

/* ---------- 左：筛选 ---------- */
.wb-rail{min-width:0;min-height:0;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 8px 24px}
.rail-head{display:flex;align-items:center;gap:8px;padding:0 6px 8px}
.rail-head b{font-size:var(--fs-meta);font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.rail-head .clear{margin-left:auto;font-size:var(--fs-meta);color:var(--brand-ink);background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:var(--r-inner)}
.rail-head .clear:hover{background:var(--brand-tint)}
.rail-sec{padding:8px 0 4px}
.rail-sec>summary{
  list-style:none;display:flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;
  font-size:var(--fs-meta);font-weight:600;color:var(--ink-3);letter-spacing:.04em;
}
.rail-sec>summary::-webkit-details-marker{display:none}
.rail-sec>summary::before{content:"▸";font-size:10px;color:var(--ink-4);transition:transform .16s}
.rail-sec[open]>summary::before{transform:rotate(90deg)}
.rail-row{
  width:100%;display:flex;align-items:center;gap:6px;padding:5px 8px;border:0;background:none;
  border-radius:var(--r-inner);cursor:pointer;text-align:left;font-size:var(--fs-body);color:var(--ink-2);
  transition:background .14s,color .14s;
}
.rail-row:hover{background:var(--surface-2);color:var(--ink)}
.rail-row.on{background:var(--brand-tint);color:var(--brand-ink);font-weight:600}
.rail-row .rr-n{margin-left:auto;font-size:var(--fs-meta);color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail-row.on .rr-n{color:var(--brand-ink)}
.rail-row .tw{flex:none;width:12px;color:var(--ink-4);font-size:10px;text-align:center}
.rail-row.d1{padding-left:8px;font-weight:500;color:var(--ink)}
.rail-row.d2{padding-left:24px}
.rail-row.d3{padding-left:40px;font-size:var(--fs-body)}
.rail-sub{display:none}
.rail-sub.open{display:block}

/* ---------- 中：结果 ---------- */
.wb-main{
  min-width:0;min-height:0;overflow:hidden;background:var(--surface);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;   /* 筛选 / 结果 / 翻页，中间那行才是滚动区 */
}
.wb-filters{
  flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:8px 12px;border-bottom:1px solid var(--line);
}
.f-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.f-label{font-size:var(--fs-meta);color:var(--ink-3);margin-right:2px;white-space:nowrap}
.chip{
  height:24px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);
  color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;transition:color .14s,border-color .14s,background .14s;
}
.chip:hover{color:var(--ink);border-color:var(--line-strong)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.wb-rows{min-height:0;overflow:auto;overscroll-behavior:contain}
.row{
  display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 8px;
  padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--brand-tint)}
.row .r-i{flex:none;width:32px;font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--ink-4);padding-top:2px;font-variant-numeric:tabular-nums}
.row .r-tags{flex:0 1 auto;display:flex;flex-wrap:wrap;gap:2px;padding-top:1px}
.row .r-tags i{font-style:normal;font-size:var(--fs-meta);line-height:1;padding:3px 6px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.row.on .r-tags i{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.row-stem{
  flex:1 1 260px;min-width:0;
  font-size:var(--fs-body);line-height:1.5;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.row-stem p{margin:0}
.row-stem p+p{margin-top:2px}
.row-stem img{max-height:1.3em;width:auto;vertical-align:-0.22em}
.row-stem .katex{font-size:1.02em}
.row-stem .katex-display{margin:2px 0;overflow:hidden}
.row-stem .fig-ph{color:var(--ink-3);font-size:var(--fs-meta)}
.row.on .row-stem{color:var(--ink)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-3);font-size:var(--fs-body)}
.wb-pager{
  flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);
  background:var(--surface);font-size:var(--fs-meta);color:var(--ink-3);
}
.wb-pager .spacer{flex:1}
.wb-pager button{
  height:26px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-inner);background:var(--surface);
  color:var(--ink-2);font-size:var(--fs-meta);cursor:pointer;
}
.wb-pager button:disabled{opacity:.45;cursor:default}
.wb-pager button:not(:disabled):hover{border-color:var(--line-strong);color:var(--ink)}

/* ---------- 右：详情 ---------- */
.wb-detail{min-width:0;min-height:0;overflow:auto;background:var(--paper);border-left:1px solid var(--line);padding:16px}
.d-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sub);padding:16px}
.d-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.d-code{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--ink-3)}
.d-title{margin:0;font-size:var(--fs-sub);font-weight:600;line-height:1.35;color:var(--ink)}
.d-chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.d-chips span{font-size:var(--fs-meta);line-height:1;padding:4px 8px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-3)}
.d-stem{font-size:var(--fs-body);line-height:1.72;color:var(--ink)}
.d-stem p{margin:0 0 6px}
.d-stem p:last-child{margin-bottom:0}
.d-stem img{max-width:100%;height:auto;vertical-align:middle}
.d-stem img.qf{max-height:1.4em;width:auto;vertical-align:-0.35em}
.d-stem img.qfig{max-height:none}
.qopts img.qf{max-height:1.4em;width:auto;vertical-align:-0.35em}
.d-stem .katex{font-size:1.03em}
.d-stem .katex-display{margin:8px 0;overflow-x:auto;overflow-y:hidden}
.qopts{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.qopts li{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-body);line-height:1.6;color:var(--ink-2)}
.qopts b{flex:none;width:16px;height:20px;display:grid;place-items:center;font-size:var(--fs-meta);color:var(--brand-ink);background:var(--brand-tint);border-radius:4px;font-weight:600}
.qopts img{max-height:20px;width:auto;vertical-align:-4px}
.d-tags{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.d-tags div{font-size:var(--fs-meta);color:var(--ink-3);line-height:1.5}
.d-tags b{color:var(--ink-2);font-weight:600}
.d-actions{display:flex;gap:8px;margin-top:12px}
.d-actions button{
  height:32px;padding:0 16px;border-radius:var(--r-inner);border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font-size:var(--fs-body);cursor:pointer;transition:border-color .16s,background .16s,color .16s;
}
.d-actions button:hover{border-color:var(--line-strong);background:var(--surface-2);color:var(--ink)}
.d-actions .primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.d-actions .primary:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.d-hint{padding:24px 8px;text-align:center;color:var(--ink-3);font-size:var(--fs-body)}
.d-note{margin-top:8px;font-size:var(--fs-meta);color:var(--ink-3)}

@media (max-width:820px){
  .wb{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .wb-split{display:none}
  .wb-rail{display:none}
  .wb-detail{display:none}
}
</style>
</head>
<body>

<header class="wb-top">
  <div class="wb-brand"><b>步步解</b><span>题库工作台</span></div>
  <div class="wb-modes" role="tablist" aria-label="视图">
    <button type="button" role="tab" data-mode="map" aria-selected="false" data-tip="导图：按知识点或思路逐层展开的气泡图，点到最细一支列出这一支的题，右侧题库跟着过滤">导图</button>
    <button type="button" role="tab" data-mode="workbench" aria-selected="true" data-tip="工作台：关键词搜索 + 题型/难度筛选 + 分页列表，右侧看完整题干与选项，适合按条件成批找题">工作台</button>
  </div>
  <div class="wb-search">
    <span class="ico">⌕</span>
    <input id="q" type="search" autocomplete="off" placeholder="搜题干、关键词……（835 道）">
  </div>
  <span class="wb-count" id="count">—</span>
  <a class="wb-btn push" href="/qbank/map.html">题库地图</a>
  <button class="wb-btn icon" id="theme" type="button" aria-label="切换深浅色">◐</button>
</header>

<main class="wb">
  <aside class="wb-rail" id="rail" aria-label="分类筛选"></aside>
  <div class="wb-split" id="splitRail" role="separator" aria-orientation="vertical" tabindex="0" aria-label="拖动调整筛选栏宽度"></div>

  <section class="wb-main" aria-label="检索结果">
    <div class="wb-filters" id="filters"></div>
    <div class="wb-rows" id="rows"></div>
    <div class="wb-pager" id="pager"></div>
  </section>

  <div class="wb-split" id="splitDetail" role="separator" aria-orientation="vertical" tabindex="0" aria-label="拖动调整详情宽度"></div>
  <aside class="wb-detail" id="detail" aria-label="题目详情"></aside>
</main>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/math.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var mathIn = function (el) {
    if (el && window.BsjMath && window.BsjMath.renderMathIn) window.BsjMath.renderMathIn(el);
  };

  var DIFF = { 2: '易', 3: '中', 4: '难' };
  var DATA = null;
  var ALL = [];
  var KG_LEAF = new Map(), KG_CHAP = new Map(), TH_SUB = new Map();
  var CACHE = new Map();
  var expanded = { kg: new Set(), th: new Set() };
  var S = {
    q: '', mod: null, chap: null, leaf: null, cat: null, sub: null,
    ty: null, d: null, p: null, sort: 'i', page: 0, per: 30, sel: null
  };
  var RAIL_DEF = 240, DETAIL_DEF = 360;

  /* ---------------------------------------------------------------- 数据 */

  function boot() {
    fetch('/qbank/data.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('题库索引读取失败'); return r.json(); })
      .then(function (data) {
        DATA = data;
        (data.kg || []).forEach(function (m) {
          (m.children || []).forEach(function (c) {
            KG_CHAP.set(c.id, { mod: m.name, modId: m.id, name: c.name, id: c.id });
            (c.children || []).forEach(function (l) {
              KG_LEAF.set(l.id, { mod: m.name, modId: m.id, chap: c.name, chapId: c.id, name: l.name, id: l.id });
            });
          });
        });
        (data.think || []).forEach(function (t) {
          (t.children || []).forEach(function (s) {
            TH_SUB.set(s.id, { cat: t.name, catId: t.id, name: s.name, id: s.id });
          });
        });
        ALL = data.qs.slice();
        ALL.forEach(function (q) {
          var leaf = KG_LEAF.get(q.l);
          q._leafName = leaf ? leaf.name : '';
          q._mod = q.m || (leaf ? leaf.mod : '');
          q._hay = [q.s, q.c, q.src, q.p, q.ty, q._leafName, q._mod, (KG_CHAP.get(q.k) || {}).name, (TH_SUB.get(q.t2) || {}).name]
            .filter(Boolean).join(' ').toLowerCase();
        });
        $('#q').placeholder = '搜题干、关键词……（' + ALL.length + ' 道）';
        renderRail();
        renderFilters();
        applyUrl();
        render();
      })
      .catch(function (err) {
        $('#rows').innerHTML = '<p class="empty">题库加载失败：' + esc(err.message) + '</p>';
      });
  }

  /* ---------------------------------------------------------------- 左栏树 */

  function countBy(pick) {
    var n = 0;
    for (var i = 0; i < ALL.length; i++) if (pick(ALL[i])) n += 1;
    return n;
  }

  function railRow(kind, id, label, depth, count, on) {
    var tw = kind === 'mod' || kind === 'cat' ? '▸' : '';
    return '<button type="button" class="rail-row d' + depth + (on ? ' on' : '') + '" data-kind="' + kind + '" data-id="' + esc(id) + '">' +
      '<span class="tw">' + tw + '</span><span class="rr-name">' + esc(label) + '</span>' +
      '<span class="rr-n">' + count + '</span></button>';
  }

  function renderRail() {
    var html = '<div class="rail-head"><b>筛选</b><button type="button" class="clear" id="clearAll">清除</button></div>';

    html += '<details class="rail-sec" open><summary>知识点</summary>';
    (DATA.kg || []).forEach(function (m) {
      var modOn = S.mod === m.name;
      html += railRow('mod', m.id, m.name, 1, countBy(function (q) { return q._mod === m.name; }), modOn);
      var openMod = expanded.kg.has(m.id) || modOn || (S.chap && m.children.some(function (c) { return c.id === S.chap; }));
      html += '<div class="rail-sub' + (openMod ? ' open' : '') + '">';
      (m.children || []).forEach(function (c) {
        var chapOn = S.chap === c.id;
        html += railRow('chap', c.id, c.name, 2, countBy(function (q) { return q.k === c.id; }), chapOn);
        var openChap = expanded.kg.has(c.id) || chapOn || (S.leaf && c.children.some(function (l) { return l.id === S.leaf; }));
        html += '<div class="rail-sub' + (openChap ? ' open' : '') + '">';
        (c.children || []).forEach(function (l) {
          html += railRow('leaf', l.id, l.name, 3, countBy(function (q) { return q.l === l.id; }), S.leaf === l.id);
        });
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</details>';

    html += '<details class="rail-sec" open><summary>解题思路</summary>';
    (DATA.think || []).forEach(function (t) {
      var catOn = S.cat === t.id;
      html += railRow('cat', t.id, t.name, 1, countBy(function (q) { return q.t === t.id; }), catOn);
      var openCat = expanded.th.has(t.id) || catOn || (S.sub && t.children.some(function (x) { return x.id === S.sub; }));
      html += '<div class="rail-sub' + (openCat ? ' open' : '') + '">';
      (t.children || []).forEach(function (sub) {
        html += railRow('sub', sub.id, sub.name, 2, countBy(function (q) { return q.t2 === sub.id; }), S.sub === sub.id);
      });
      html += '</div>';
    });
    html += '</details>';

    $('#rail').innerHTML = html;
  }

  /* ---------------------------------------------------------------- 顶部筛选 */

  var TYPES = ['单选', '多选', '实验', '计算', '填空'];
  var DIFFS = [{ v: 2, n: '易' }, { v: 3, n: '中' }, { v: 4, n: '难' }];

  function renderFilters() {
    var html = '<div class="f-row"><span class="f-label">题型</span>';
    TYPES.forEach(function (t) {
      if (!countBy(function (q) { return q.ty === t; })) return;
      html += '<button type="button" class="chip' + (S.ty === t ? ' on' : '') + '" data-f="ty" data-v="' + esc(t) + '">' + esc(t) + '</button>';
    });
    html += '</div><div class="f-row"><span class="f-label">难度</span>';
    DIFFS.forEach(function (d) {
      html += '<button type="button" class="chip' + (S.d === d.v ? ' on' : '') + '" data-f="d" data-v="' + d.v + '">' + d.n + '</button>';
    });
    html += '</div>';
    $('#filters').innerHTML = html;
  }

  /* ---------------------------------------------------------------- 结果 */

  function filtered() {
    var kw = S.q.trim().toLowerCase();
    var out = ALL.filter(function (q) {
      if (S.mod && q._mod !== S.mod) return false;
      if (S.chap && q.k !== S.chap) return false;
      if (S.leaf && q.l !== S.leaf) return false;
      if (S.cat && q.t !== S.cat) return false;
      if (S.sub && q.t2 !== S.sub) return false;
      if (S.ty && q.ty !== S.ty) return false;
      if (S.d && q.d !== S.d) return false;
      if (S.p && q.p !== S.p) return false;
      if (kw && q._hay.indexOf(kw) < 0) return false;
      return true;
    });
    if (S.sort === 'd') out.sort(function (a, b) { return (b.d - a.d) || (a.i - b.i); });
    else out.sort(function (a, b) { return a.i - b.i; });
    return out;
  }

  function render() {
    var list = filtered();
    var pages = Math.max(1, Math.ceil(list.length / S.per));
    if (S.page >= pages) S.page = pages - 1;
    if (S.page < 0) S.page = 0;
    var slice = list.slice(S.page * S.per, S.page * S.per + S.per);

    $('#count').textContent = list.length + ' / ' + ALL.length + ' 道';

    if (!list.length) {
      $('#rows').innerHTML = '<p class="empty">没有匹配的题目。换个关键词，或点左边「清除」。</p>';
    } else {
      if (S.sel == null) S.sel = list[0].i;   /* 高亮与右侧详情始终对齐 */
      $('#rows').innerHTML = slice.map(function (q) {
        var leaf = KG_LEAF.get(q.l);
        var sub = TH_SUB.get(q.t2);
        return '<div class="row' + (S.sel === q.i ? ' on' : '') + '" data-i="' + q.i + '" tabindex="0">' +
          '<span class="r-i">' + q.i + '</span>' +
          '<span class="r-tags"><i>' + esc(q.ty) + '</i><i>' + (DIFF[q.d] || '') + '</i>' +
          (leaf ? '<i>' + esc(leaf.chap) + '</i>' : '') + '</span>' +
          '<div class="row-stem" data-stem="' + q.i + '">' + esc(q.s || '') + '</div>' +
          '</div>';
      }).join('');
      mathIn($('#rows'));
      $('#rows').scrollTop = 0;
      hydrateRows(slice);
      if (S.sel != null) {
        var on = $('.row.on', $('#rows'));
        if (on) on.scrollIntoView({ block: 'nearest' });
      }
    }

    $('#pager').innerHTML =
      '<button type="button" id="prev"' + (S.page <= 0 ? ' disabled' : '') + '>上一页</button>' +
      '<span>第 ' + (S.page + 1) + ' / ' + pages + ' 页 · 共 ' + list.length + ' 道</span>' +
      '<span class="spacer"></span>' +
      '<button type="button" id="next"' + (S.page >= pages - 1 ? ' disabled' : '') + '>下一页</button>';

    renderDetailFromState(list);
  }

  /* 列表只看公式：图形图（qfig）换成〔图〕占位 */
  function previewHtml(html) {
    return String(html || '').replace(/<img[^>]*class=\"qfig\"[^>]*>/g, '<span class=\"fig-ph\">〔图〕</span>');
  }

  /* 结果行：先纯文本，再逐条取回 rich 题干（公式图 + KaTeX） */
  var hydrateToken = 0;
  function hydrateRows(slice) {
    var token = ++hydrateToken;
    var idx = 0, active = 0;
    function pump() {
      while (active < 6 && idx < slice.length) {
        var q = slice[idx++];
        active += 1;
        (function (item) {
          loadDetail(item.i).then(function (det) {
            if (token !== hydrateToken) return;
            var cell = $('[data-stem="' + item.i + '"]', $('#rows'));
            if (!cell || !det.stemHtml) return;
            cell.innerHTML = previewHtml(det.stemHtml);
            mathIn(cell);
          }).catch(function () { }).then(function () { active -= 1; pump(); });
        })(q);
      }
    }
    pump();
  }

  /* ---------------------------------------------------------------- 详情 */

  function loadDetail(i) {
    if (CACHE.has(i)) return Promise.resolve(CACHE.get(i));
    return fetch('/qbank/q/' + i + '.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('题目详情读取失败');
      return r.json();
    }).then(function (det) { CACHE.set(i, det); return det; });
  }

  function pick() {
    var list = filtered();
    if (!list.length) return null;
    if (S.sel != null) {
      for (var i = 0; i < list.length; i++) if (list[i].i === S.sel) return list[i];
    }
    return list[0];
  }
  void pick;

  function renderDetailFromState(list) {
    var box = $('#detail');
    var q = null;
    if (S.sel != null) {
      for (var i = 0; i < ALL.length; i++) if (ALL[i].i === S.sel) { q = ALL[i]; break; }
    }
    if (!q) q = list[0] || null;
    if (!q) { box.innerHTML = '<p class="d-hint">左边选一道题，这边会显示完整题干、选项与分类。</p>'; return; }
    if (box.getAttribute('data-i') === String(q.i)) return;   /* 同一题不重复渲染 */
    box.setAttribute('data-i', String(q.i));
    box.innerHTML = '<p class="d-hint">正在读取第 ' + q.i + ' 题…</p>';
    loadDetail(q.i).then(function (det) {
      if (box.getAttribute('data-i') !== String(q.i)) return;
      box.innerHTML = detailHtml(q, det);
      mathIn(box);
      bindDetail(q, det);
    }).catch(function (err) {
      box.innerHTML = '<p class="d-hint">' + esc(err.message) + '</p>';
    });
  }

  function detailHtml(q, det) {
    var leaf = KG_LEAF.get(q.l);
    var sub = TH_SUB.get(q.t2);
    var opts = (det.options || []).length
      ? '<ol class="qopts">' + det.options.map(function (o) {
          return '<li><b>' + esc(o.l) + '</b><span>' + (o.html || esc(o.text)) + '</span></li>';
        }).join('') + '</ol>'
      : '';
    var tags = [];
    if (leaf) tags.push('<div><b>知识点</b>　' + esc(leaf.mod + ' › ' + leaf.chap + ' › ' + leaf.name) + '</div>');
    if (sub) tags.push('<div><b>思路</b>　' + esc(sub.cat + ' › ' + sub.name) + '</div>');
    tags.push('<div><b>来源</b>　' + esc(det.src || '') + '</div>');
    return '<div class="d-card">' +
      '<div class="d-top"><div><div class="d-code">第 ' + det.i + ' 题</div></div></div>' +
      '<div class="d-chips"><span>' + esc(det.ty) + '</span><span>难度 · ' + esc(det.d) + '</span></div>' +
      '<div class="d-stem">' + (det.stemHtml || '<p>' + esc(det.stemText) + '</p>') + '</div>' +
      opts +
      '<div class="d-tags">' + tags.join('') + '</div>' +
      '<div class="d-actions">' +
      '<button type="button" class="primary" data-act="start">用这道题开始</button>' +
      '<button type="button" data-act="copy">复制题干</button>' +
      '</div>' +
      '<p class="d-note">复制走纯文本（公式是占位符）；开始后会进主应用第 2 页，由服务端读题。</p>' +
      '</div>';
  }

  function bindDetail(q, det) {
    var box = $('#detail');
    box.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act');
        if (act === 'copy') {
          var text = (det.stemText || '') + ((det.options || []).length ? '\n\n' + det.options.map(function (o) { return o.l + '. ' + o.text; }).join('\n') : '');
          copyText(text, btn);
          return;
        }
        startQuestion(q, det);
      });
    });
  }

  function copyText(text, btn) {
    function done(ok) {
      var old = btn.textContent;
      btn.textContent = ok ? '已复制' : '复制失败';
      setTimeout(function () { btn.textContent = old; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      return;
    }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      done(document.execCommand('copy'));
      document.body.removeChild(ta);
    } catch (e) { done(false); }
  }

  /* 与题库地图同一条交接口径：内嵌时交给宿主，独立页时写 sessionStorage 再回主应用 */
  function startQuestion(q, det) {
    var payload = {
      i: q.i,
      stem: det.stemText || q.s || '',
      opt: det.options && det.options.length ? det.options.map(function (o) { return o.l + '. ' + o.text; }).join(' ') : (q.opt || ''),
      ty: q.ty, d: q.d, p: q.p
    };
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'qbank:pick', q: payload }, location.origin);
      return;
    }
    try { sessionStorage.setItem('qbank.pick', JSON.stringify(payload)); } catch (e) { }
    location.href = '/';
  }

  /* ---------------------------------------------------------------- 交互 */

  /* key: mod / chap / leaf / cat / sub / ty / d；mod 传的是模块名，其余传节点 id */
  function setFilter(key, val) {
    if (key === 'mod') {
      S.mod = S.mod === val ? null : val;
      S.chap = null;
      S.leaf = null;
    } else if (key === 'chap') {
      S.chap = S.chap === val ? null : val;
      S.leaf = null;
      S.mod = null;
    } else if (key === 'leaf') {
      S.leaf = S.leaf === val ? null : val;
    } else if (key === 'cat') {
      S.cat = S.cat === val ? null : val;
      S.sub = null;
    } else if (key === 'sub') {
      S.sub = S.sub === val ? null : val;
    } else if (key === 'ty') {
      S.ty = S.ty === val ? null : val;
    } else if (key === 'd') {
      var n = Number(val);
      S.d = S.d === n ? null : n;
    }
    resetView();
  }

  function resetView() {
    S.page = 0;
    S.sel = null;
    $('#detail').removeAttribute('data-i');
    renderRail();
    renderFilters();
    render();
  }

  function bindEvents() {
    document.addEventListener('click', function (e) {
      var clear = e.target.closest('#clearAll');
      if (clear) {
        S.q = ''; $('#q').value = '';
        S.mod = S.chap = S.leaf = S.cat = S.sub = S.ty = S.d = S.p = S.sel = null;
        S.page = 0;
        $('#detail').removeAttribute('data-i');
        renderRail(); renderFilters(); render();
        return;
      }
      var chip = e.target.closest('.chip[data-f]');
      if (chip) { setFilter(chip.getAttribute('data-f'), chip.getAttribute('data-v')); return; }
      var row = e.target.closest('.rail-row');
      if (row) {
        var kind = row.getAttribute('data-kind');
        var id = row.getAttribute('data-id');
        if (kind === 'mod') {
          var name = null;
          (DATA.kg || []).forEach(function (m) { if (m.id === id) name = m.name; });
          expanded.kg.add(id);
          setFilter('mod', name || id);
          return;
        }
        if (kind === 'cat') {
          if (expanded.th.has(id)) expanded.th.delete(id); else expanded.th.add(id);
        }
        setFilter(kind, id);
        return;
      }
      var qrow = e.target.closest('.row');
      if (qrow) { select(Number(qrow.getAttribute('data-i'))); return; }
      var prev = e.target.closest('#prev');
      if (prev && S.page > 0) { S.page -= 1; render(); return; }
      var next = e.target.closest('#next');
      if (next) { S.page += 1; render(); return; }
    });

    document.addEventListener('change', function (e) {
    });

    var timer = null;
    $('#q').addEventListener('input', function (e) {
      var v = e.target.value;
      clearTimeout(timer);
      timer = setTimeout(function () {
        S.q = v; S.page = 0; S.sel = null;
        $('#detail').removeAttribute('data-i');
        render();
      }, 140);
    });

    document.addEventListener('keydown', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) {
        if (e.key !== 'Escape') return;
        e.target.blur();
      }
      var list = filtered();
      if (!list.length) return;
      var idx = -1;
      for (var i = 0; i < list.length; i++) if (list[i].i === S.sel) { idx = i; break; }
      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault();
        select(list[Math.min(list.length - 1, idx + 1)].i);
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault();
        select(list[Math.max(0, idx - 1)].i);
      } else if (e.key === 'PageDown') {
        e.preventDefault();
        select(list[Math.min(list.length - 1, (idx < 0 ? 0 : idx) + 8)].i);
      } else if (e.key === 'PageUp') {
        e.preventDefault();
        select(list[Math.max(0, (idx < 0 ? list.length : idx) - 8)].i);
      } else if (e.key === 'Home' && idx > 0) {
        e.preventDefault();
        select(list[0].i);
      } else if (e.key === 'End' && idx > -1) {
        e.preventDefault();
        select(list[list.length - 1].i);
      } else if (e.key === '/' ) {
        e.preventDefault();
        $('#q').focus();
      }
    });

    var EMBEDDED = /[?&]embedded=1/.test(location.search);
    document.querySelectorAll('.wb-modes button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.getAttribute('data-mode') !== 'map') return;
        location.href = '/qbank/map.html' + (EMBEDDED ? '?embedded=1' : '');
      });
    });

    var theme = $('#theme');
    theme.addEventListener('click', function () {
      var now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', now);
      try { localStorage.setItem('bsj-theme', now); } catch (e) { }
    });

    layoutDefaults();
    bindSplit($('#splitRail'), 'rail-w', RAIL_DEF, 180, 360);
    bindSplit($('#splitDetail'), 'detail-w', DETAIL_DEF, 260, 620);
    normalizePanes();
    var rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(normalizePanes, 160);
    });
  }

  /* 默认分栏宽度按视口算：小屏把两侧收窄，中间结果栏至少留 360 */
  function layoutDefaults() {
    var vw = window.innerWidth || 1280;
    RAIL_DEF = Math.max(180, Math.min(240, Math.round(vw * 0.19)));
    DETAIL_DEF = Math.max(260, Math.min(360, Math.round(vw * 0.32)));
    var rest = vw - RAIL_DEF - DETAIL_DEF - 20;
    if (rest < 360) DETAIL_DEF = Math.max(240, DETAIL_DEF - (360 - rest));
  }

  /* 读回上次宽度后做一次归一：中间结果栏永远不小于 360，两侧按比例让出空间 */
  function normalizePanes() {
    var vw = window.innerWidth || 1280;
    var cs = getComputedStyle(document.documentElement);
    var rail = parseFloat(cs.getPropertyValue('--rail-w')) || RAIL_DEF;
    var detail = parseFloat(cs.getPropertyValue('--detail-w')) || DETAIL_DEF;
    var mid = vw - rail - detail - 20;
    if (mid < 360) {
      detail = Math.max(240, detail - (360 - mid));
      mid = vw - rail - detail - 20;
    }
    if (mid < 360) rail = Math.max(160, rail - (360 - mid));
    document.documentElement.style.setProperty('--rail-w', Math.round(rail) + 'px');
    document.documentElement.style.setProperty('--detail-w', Math.round(detail) + 'px');
  }

  function select(i) {
    S.sel = i;
    var list = filtered();
    var at = -1;
    for (var k = 0; k < list.length; k++) if (list[k].i === i) { at = k; break; }
    if (at >= 0) {
      var page = Math.floor(at / S.per);
      if (page !== S.page) { S.page = page; render(); return; }
      var rows = document.querySelectorAll('.row');
      for (var n = 0; n < rows.length; n++) rows[n].classList.toggle('on', Number(rows[n].getAttribute('data-i')) === i);
      var onRow = document.querySelector('.row.on');
      if (onRow) onRow.scrollIntoView({ block: 'nearest' });
    }
    $('#detail').removeAttribute('data-i');
    renderDetailFromState(list);
    var q = null;
    for (var m = 0; m < ALL.length; m++) if (ALL[m].i === i) { q = ALL[m]; break; }
    if (q) history.replaceState(null, '', '?q=' + q.i);
  }

  /* 两条分隔条：拖动改宽度，双击复位，键盘 ←/→ 微调 */
  function bindSplit(el, key, def, min, max) {
    if (!el) return;
    var saved = NaN;
    try { saved = parseInt(localStorage.getItem('qbank.' + key), 10); } catch (e) { }
    var start = isNaN(saved) ? def : saved;
    document.documentElement.style.setProperty('--' + key, start + 'px');
    var dragging = false, x0 = 0, w0 = 0;
    function apply(px) {
      var w = Math.min(max, Math.max(min, px));
      document.documentElement.style.setProperty('--' + key, w + 'px');
      try { localStorage.setItem('qbank.' + key, String(w)); } catch (e) { }
    }
    function cur() {
      var v = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--' + key), 10);
      return isNaN(v) ? def : v;
    }
    el.addEventListener('pointerdown', function (e) {
      dragging = true; x0 = e.clientX; w0 = cur();
      el.classList.add('dragging');
      document.body.classList.add('resizing');
      try { el.setPointerCapture(e.pointerId); } catch (err) { }
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - x0;
      apply(key === 'rail-w' ? w0 + dx : w0 - dx);
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      document.body.classList.remove('resizing');
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('dblclick', function () { apply(def); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { apply(cur() + (key === 'rail-w' ? -24 : 24)); e.preventDefault(); }
      if (e.key === 'ArrowRight') { apply(cur() + (key === 'rail-w' ? 24 : -24)); e.preventDefault(); }
    });
  }

  /* URL：?q=<题号> 直接打开某题；?leaf=<叶子> 预筛 */
  function applyUrl() {
    var m = /[?&]q=(\d+)/.exec(location.search);
    var leaf = /[?&]leaf=([\w-]+)/.exec(location.search);
    if (leaf && KG_LEAF.has(leaf[1])) S.leaf = leaf[1];
    if (m) {
      var want = Number(m[1]);
      var at = -1;
      for (var i = 0; i < ALL.length; i++) if (ALL[i].i === want) { at = i; break; }
      if (at >= 0) { S.sel = want; S.page = Math.floor(at / S.per); }
    }
  }

  /* CSS 变量名带连字符，这里补一个到 :root 的默认值 */
  document.documentElement.style.setProperty('--rail-w', RAIL_DEF + 'px');
  document.documentElement.style.setProperty('--detail-w', DETAIL_DEF + 'px');

  boot();
  bindEvents();
})();
</script>
</body>
</html>
