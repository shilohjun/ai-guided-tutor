/* ===== 设计 token：与 public/index.html（origin/main）同源 ===== */

  /* —— 主色：全站唯一强调色（HSL 243,54%,53%） —— */

  --amber:#8A6A2A;  --amber-tint:#FBF3E4; --amber-line:#EBD9B8;
  --coral:#B23B3B;  --coral-tint:#FBEDED; --coral-line:#EDC9C9;

  --shadow-1:0 1px 2px rgba(26,26,26,.04), 0 8px 24px rgba(26,26,26,.05);
  --shadow-2:0 16px 40px rgba(26,26,26,.10);

  /* —— 圆角三级：外 = 内 + 内边距，同心 —— */
  --r-card:24px;
  --r-sub:16px;
  --r-inner:8px;
  --r-pill:999px;
  --r-circle:50%;
  --r-sm:8px; --r-md:8px; --r-lg:24px; --r-xl:24px;  /* 兼容别名 */

  /* —— 字号四档 + 行高（对齐 LeetCode：正文 14/21、标签 12、小节 16、大标题 20）

  --fs-meta:11px;

/* ===== 原型组件 ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:var(--fs-body)/var(--lh-body) var(--font-sans);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

.top{
  height:var(--topbar);display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:24px;height:24px;border-radius:6px;display:block}
.brand strong{font-size:var(--fs-sub);font-weight:600;white-space:nowrap}
.brand em{font-style:normal;font-size:var(--fs-meta);color:var(--ink-3);white-space:nowrap}

.seg{display:flex;gap:2px;padding:2px;background:var(--surface-2);border-radius:var(--r-pill)}
.seg button{
  height:28px;padding:0 15px;border:0;background:transparent;border-radius:var(--r-pill);
  font-size:var(--fs-lead);color:var(--ink-3);cursor:pointer;transition:background .18s,color .18s,box-shadow .18s;
}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1)}
.seg button:not([aria-selected="true"]):hover{color:var(--ink-2)}

.tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.tool{
  height:28px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-inner);
  background:var(--surface);color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;
  transition:color .18s,border-color .18s,background .18s;
}
.tool:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.tool.icon{width:30px;padding:0;font-size:14px;line-height:1}
button:focus-visible,.qcard:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
.modal:focus{outline:none}

main{display:grid;grid-template-columns:minmax(0,1fr) 10px var(--panel-w,340px);height:calc(100vh - var(--topbar))}
.canvas{
  position:relative;margin:14px 0 14px 14px;border:1px solid var(--line);
  border-radius:var(--r-sub);background:var(--paper);overflow:hidden;
  padding-top:82px;   /* 给左上角的主控留出位置，节点不要钻到它底下 */
}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#svg.dragging{cursor:grabbing}
.hint{
  position:absolute;left:16px;bottom:13px;margin:0;
  font-size:var(--fs-meta);color:var(--ink-3);pointer-events:none;
}

/* 节点：每个字都住在一个细边气泡里 */
.node{cursor:pointer;outline:none}
.node .chip{
  fill:var(--surface);
  stroke:color-mix(in srgb,var(--brand) 22%,transparent);
  stroke-width:1;
  transition:stroke .16s ease,fill .16s ease;
}
.node:hover .chip{stroke:color-mix(in srgb,var(--brand) 58%,transparent)}
.node text{
  font-family:var(--font-sans);font-size:12.5px;fill:var(--ink-2);
  dominant-baseline:central;pointer-events:none;
}
.node.mod text,.node.chap text,.node.cat text{font-size:13px;fill:var(--ink);font-weight:500}
.node.leaf text,.node.sub text{font-size:12px;fill:var(--ink-3)}

/* —— 颜色分层：越靠近核心，色越实 —— */
.node.d1 .chip{
  fill:var(--brand-tint);
  stroke:var(--brand-line);
}
.node.d1 text{fill:var(--brand-ink);font-weight:600}
.node.d2 .chip{
  fill:var(--surface);
  stroke:color-mix(in srgb,var(--brand) 26%,transparent);
  stroke-width:1.1;
}
.node.d3 .chip{
  fill:transparent;
  stroke:color-mix(in srgb,var(--brand) 15%,transparent);
}
.node.d3 text{fill:var(--ink-2)}
.node.hover .chip{}

/* 核心：实心 + 底盘 + 更大字 */
.hub-disc{
  fill:color-mix(in srgb,var(--brand) 9%,transparent);
}
.node.root .chip{fill:var(--brand);stroke:var(--brand)}
.node.root text{fill:#fff;font-size:14.5px;font-weight:600;letter-spacing:.01em}
.node.root:hover .chip{fill:var(--brand-strong)}
.node.is-sel .chip{fill:var(--brand-tint);stroke:var(--brand)}
.node.is-sel text{fill:var(--brand-ink);font-weight:600}
.node.root.is-sel .chip{fill:var(--brand-strong)}
.node.root.is-sel text{fill:#fff}
.node:focus-visible .chip{stroke:var(--brand);stroke-width:2}
.chev{fill:var(--ink-4);font-size:11px;dominant-baseline:central;pointer-events:none}
.node:hover .chev{fill:var(--brand)}

.node{transition:opacity .22s ease}
.node.dim{opacity:.26}
.node.born{opacity:0}
.link{fill:none;stroke:var(--line-strong);stroke-width:1.05;stroke-linecap:round}
.link[data-d="1"]{stroke-width:1.9;stroke:color-mix(in srgb,var(--brand) 34%,var(--line-strong))}
.link[data-d="2"]{stroke-width:1.45;stroke:color-mix(in srgb,var(--brand) 16%,var(--line-strong))}
.link[data-d="3"]{stroke-width:1.05;stroke:color-mix(in srgb,var(--line-strong) 82%,transparent)}
.link.band{
  stroke:none;
  fill:color-mix(in srgb,var(--brand) 20%,transparent);
}
.link.band[data-d="2"]{fill:color-mix(in srgb,var(--brand) 17%,transparent)}
.link.band[data-d="3"]{fill:color-mix(in srgb,var(--brand) 12%,transparent)}
.link.band.dim{stroke:none}
.link{transition:opacity .22s ease,stroke .2s ease}
.link.dim{opacity:.22}
.spine{fill:none;stroke:color-mix(in srgb,var(--brand) 16%,var(--line-strong));stroke-width:1}

/* 右侧题库 */
.panel{
  display:flex;flex-direction:column;min-height:0;margin:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sub);
}
.panel-head{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px 11px;border-bottom:1px solid var(--line);
}
.crumb{display:flex;align-items:baseline;gap:7px;min-width:0;flex:1}
.crumb b{font-size:var(--fs-sub);font-weight:600;flex:none}
.crumb span{
  font-size:var(--fs-meta);color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.crumb span[hidden]{display:none}
#all{flex:none;height:24px;padding:0 9px;border-radius:var(--r-inner);font-size:var(--fs-meta)}
#all[hidden]{display:none}
.qlist{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}

.qcard{
  border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
  border-radius:10px;padding:9px 11px;background:var(--surface);cursor:pointer;
  transition:border-color .16s,background .16s;
}
.qcard:hover{border-color:color-mix(in srgb,var(--brand) 60%,transparent)}
.qcard.on{border-color:var(--brand);background:var(--brand-tint)}
.qcard .meta{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.qcard .meta span{
  font-size:var(--fs-meta);line-height:1;padding:3px 7px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--brand) 10%,transparent);
  color:var(--brand-ink);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.qcard .meta span:first-child{font-weight:600}
.qcard.on .meta span{background:color-mix(in srgb,var(--brand) 18%,transparent)}
.qcard p{
  margin:0;font-size:var(--fs-body);line-height:1.5;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.qcard.in{animation:cardin .26s cubic-bezier(.2,.8,.2,1) both}
.empty{margin:28px 6px;text-align:center;font-size:var(--fs-body);color:var(--ink-3)}


/* 题库分组头 */
.grp-h{
  display:flex;align-items:center;gap:9px;margin:14px 2px 2px;
  font-size:var(--fs-meta);font-weight:600;color:var(--ink-2);
}
.grp-h:first-child{margin-top:2px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grp-s{
  margin:9px 2px 1px;font-size:var(--fs-meta);color:var(--ink-3);
}
.grp-s + .qcard{margin-top:6px}

/* 弹窗 */
.scrim{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(18,18,24,.30);animation:fadein .18s ease;
}
.scrim[hidden]{display:none}
.modal{
  width:min(620px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;
  background:var(--surface);border-radius:var(--r-sub);
  box-shadow:0 20px 60px rgba(0,0,0,.22);animation:popin .22s cubic-bezier(.2,.8,.2,1);
}
.modal-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:var(--fs-sub);font-weight:600}
.modal-head p{margin:3px 0 0;font-size:var(--fs-meta);color:var(--ink-3)}
.grow{flex:1;min-width:0}
.ghost{
  height:28px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-inner);
  background:var(--surface);color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;
  transition:color .16s,border-color .16s,background .16s;flex:none;
}
.ghost:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.modal-body{overflow:auto;padding:12px 16px 14px}
.qlist-modal{display:flex;flex-direction:column;gap:8px}
.modal-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.primary{
  height:34px;padding:0 16px;border:0;border-radius:var(--r-inner);
  background:var(--brand);color:#fff;font-size:var(--fs-body);font-weight:500;cursor:pointer;
  transition:background .16s;
}
.primary:hover{background:var(--brand-strong)}
/* 公式与图形按原图渲染 */
.qstem img.qf{display:inline-block;vertical-align:-0.22em;margin:0 1px;max-width:100%;height:auto}
.qstem img.qfig{display:block;margin:10px auto;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.qopts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.qdetail .tags{margin-top:16px}
.qopts li{display:flex;gap:9px;align-items:center;font-size:var(--fs-body);line-height:1.55;color:var(--ink-2)}
.qopts li b{flex:none;width:18px;height:18px;border-radius:50%;background:var(--brand-tint);color:var(--brand-ink);
  font-size:var(--fs-meta);font-weight:600;display:flex;align-items:center;justify-content:center}
.qopts img.qf{vertical-align:-0.2em;margin:0 1px;max-width:100%}
.qopts img.qfig{max-width:100%;border-radius:6px;margin:4px 0}
.qloading{color:var(--ink-3);font-size:var(--fs-body)}
.qdetail .stem{font-size:13.5px;line-height:1.72;color:var(--ink);margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{
  font-size:var(--fs-meta);line-height:1;color:var(--brand-ink);
  background:color-mix(in srgb,var(--brand) 10%,transparent);
  border-radius:var(--r-pill);padding:4px 9px;
}
html[data-theme="dark"] .qcard .meta span,
html[data-theme="dark"] .tags span{background:color-mix(in srgb,var(--brand) 20%,transparent)}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

html[data-theme="dark"] .node .chip{stroke:color-mix(in srgb,var(--brand) 34%,transparent)}
html[data-theme="dark"] .node.d1 .chip{fill:color-mix(in srgb,var(--brand) 18%,var(--surface));stroke:color-mix(in srgb,var(--brand) 42%,transparent)}
html[data-theme="dark"] .node.d1 text{fill:var(--ink)}
html[data-theme="dark"] .hub-disc{fill:color-mix(in srgb,var(--brand) 14%,transparent)}
html[data-theme="dark"] .link[data-d="1"]{stroke:color-mix(in srgb,var(--brand) 44%,#2A2A2A)}
html[data-theme="dark"] .link[data-d="2"]{stroke:color-mix(in srgb,var(--brand) 24%,#2A2A2A)}
html[data-theme="dark"] .link.band{fill:color-mix(in srgb,var(--brand) 30%,#141418)}
html[data-theme="dark"] .link.band[data-d="2"]{fill:color-mix(in srgb,var(--brand) 22%,#141418)}
html[data-theme="dark"] .link.band[data-d="3"]{fill:color-mix(in srgb,var(--brand) 16%,#141418)}
html[data-theme="dark"] .node:hover .chip{stroke:color-mix(in srgb,var(--brand) 72%,transparent)}
html[data-theme="dark"] .qcard{border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
html[data-theme="dark"] .qcard:hover{border-color:color-mix(in srgb,var(--brand) 68%,transparent)}
html[data-theme="dark"] .modal{box-shadow:0 24px 70px rgba(0,0,0,.55)}
html[data-theme="dark"] .scrim{background:rgba(6,6,10,.55)}

/* ===== 左上角主控：分类视角 + 视图（导图 / 工作台） ===== */
.viewswitch{
  position:absolute;top:10px;left:10px;z-index:8;
  display:flex;flex-direction:column;gap:4px;padding:6px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  border:1px solid var(--line);border-radius:var(--r-sub);box-shadow:var(--shadow-1);
}
.viewswitch .vs-row{display:flex;align-items:center;gap:4px}
.viewswitch .vs-label{font-size:var(--fs-meta);color:var(--ink-3);width:44px;white-space:nowrap}
.viewswitch .seg{background:var(--surface-2);padding:2px}
.viewswitch .seg button{height:24px;padding:0 12px;font-size:var(--fs-meta)}
.viewswitch .seg button[aria-selected="true"]{background:var(--brand);color:#fff;font-weight:600;box-shadow:none}
.viewswitch .seg button[aria-selected="true"]:hover{color:#fff}
html[data-theme="dark"] .viewswitch{background:color-mix(in srgb,var(--surface) 92%,transparent)}
html[data-theme="dark"] .viewswitch .seg button[aria-selected="true"]{background:color-mix(in srgb,var(--brand) 72%,#1A1A1F)}

/* ===== 导图 / 题库之间的分隔条：左右拖动改宽度，双击复位 ===== */
/* 悬停说明：每个选项一句话讲清它是干什么的 */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;top:50%;left:calc(100% + 10px);transform:translateY(-50%);
  width:max-content;max-width:240px;padding:6px 8px;border-radius:var(--r-inner);
  background:var(--ink);color:var(--surface);font-size:var(--fs-meta);line-height:1.5;font-weight:400;
  white-space:normal;text-align:left;opacity:0;pointer-events:none;transition:opacity .14s;z-index:40;
  box-shadow:var(--shadow-2);
}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}

.split{position:relative;cursor:col-resize;touch-action:none}
.split::after{
  content:"";position:absolute;top:16px;bottom:16px;left:50%;width:2px;transform:translateX(-50%);
  border-radius:var(--r-pill);background:var(--line-strong);opacity:.55;
  transition:opacity .16s,background .16s;
}
.split:hover::after,.split:focus-visible::after,.split.dragging::after{opacity:1;background:var(--brand)}
body.resizing{cursor:col-resize;user-select:none}

/* ===== 题库卡片：公式直接显示（KaTeX + 公式原图），图形只留占位 ===== */
.qcard-stem{
  margin:0;font-size:var(--fs-body);line-height:1.5;color:var(--ink-2);
  max-height:76px;overflow:hidden;
}
.qcard-stem p{margin:0}
.qcard-stem p+p{margin-top:4px}
.qcard-stem img{max-height:1.45em;width:auto;vertical-align:-0.3em}
.qcard-stem .fig-ph{color:var(--ink-3);font-size:var(--fs-meta)}
.qcard-stem .katex{font-size:1.02em}
.qcard-stem .katex-display{margin:4px 0;overflow:hidden}
a.tool{display:inline-flex;align-items:center;text-decoration:none}
a.ghost{display:inline-flex;align-items:center;text-decoration:none}

@media (max-width:860px){
  .split{display:none}
  main{grid-template-columns:1fr;grid-template-rows:1fr 38vh;height:auto;min-height:calc(100vh - var(--topbar))}
  .canvas{margin:12px 12px 0}
  .panel{margin:12px;min-height:0}
  .brand em{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ===== 首页 → 题库：滚动淡入（仿 deepseek 首页节奏） ===== */
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.sheet{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scrollbar-width:none}
.sheet::-webkit-scrollbar{width:0;height:0}

.hero{
  min-height:calc(100dvh - var(--topbar));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px 96px;position:relative;
}
.hero-in{width:min(680px,100%);will-change:opacity,transform}
.hero-in{text-align:center}
.hero h1{
  margin:0;font-size:clamp(27px,3.5vw,35px);line-height:1.26;font-weight:600;
  letter-spacing:-.012em;color:var(--ink);
}
.hero .lede{margin:12px 0 0;font-size:var(--fs-lead);color:var(--ink-3)}
.composer{
  margin-top:28px;padding:14px 14px 10px;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.composer:focus-within{border-color:color-mix(in srgb,var(--brand) 42%,transparent)}
.composer textarea{
  width:100%;min-height:54px;border:0;outline:none;resize:none;background:transparent;
  font-family:inherit;font-size:var(--fs-lead);line-height:1.62;color:var(--ink);
}
.composer textarea::placeholder{color:var(--ink-3)}
.composer-bar{display:flex;align-items:center;gap:10px;margin-top:4px}
.hint-mini{font-size:var(--fs-meta);color:var(--ink-3)}
.send{
  margin-left:auto;height:32px;padding:0 18px;border:0;border-radius:var(--r-pill);
  background:var(--brand);color:#fff;font-size:var(--fs-lead);cursor:pointer;
  transition:background .18s ease;
}
.send:hover{background:var(--brand-strong)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.chips button{
  height:30px;padding:0 13px;border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;
  transition:color .18s ease,border-color .18s ease;
}
.chips button:hover{color:var(--ink);border-color:var(--line-strong)}

.goodbar{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  width:min(680px,calc(100% - 40px));display:flex;align-items:center;gap:12px;
  padding:13px 16px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
  border-radius:var(--r-pill);
  transition:border-color .2s ease,transform .2s ease;
}
.goodbar:hover{border-color:color-mix(in srgb,var(--brand) 55%,transparent);transform:translateX(-50%) translateY(-1px)}
.gb-ico{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--brand-tint);color:var(--brand-ink);font-size:12px;
}
.gb-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.gb-txt b{font-size:var(--fs-lead);font-weight:600;color:var(--ink)}
.gb-txt em{font-style:normal;font-size:var(--fs-meta);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-go{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--ink-3)}
.gb-go i{font-style:normal;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

.mapzone{min-height:calc(100dvh - var(--topbar))}
.mapzone main{height:calc(100dvh - var(--topbar))}
html.is-embed .mapzone main{height:100dvh}

body[data-page="home"] .top{border-bottom-color:transparent;background:color-mix(in srgb,var(--paper) 92%,transparent)}
body[data-page="home"] .top .seg,body[data-page="home"] .top .tools{opacity:0;pointer-events:none}
body[data-page="bank"] .top .seg,body[data-page="bank"] .top .tools{opacity:1}
/* 导图左上角的主控不跟着首页淡出，它只出现在题库区 */
.viewswitch .seg,.viewswitch .vs-label{opacity:1;pointer-events:auto}
body[data-page="bank"] .home-only{opacity:0;pointer-events:none}
.home-only{margin-left:auto;opacity:1}
.tools{margin-left:0}
.seg,.tools{transition:opacity .22s ease}

/* ===== 第三页：做题（唯一显示题号与总数的页面） ===== */
.practice{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--paper);animation:prIn .3s cubic-bezier(.2,.8,.2,1) both}
.practice[hidden]{display:none}
.practice:focus{outline:none}
@keyframes prIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pr-top{
  height:var(--topbar);flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.pr-count{margin-left:auto;font-size:var(--fs-meta);color:var(--ink-3);letter-spacing:.02em}
.pr-body{flex:1;overflow:auto;display:flex;justify-content:center;padding:34px 20px 70px}
.pr-card{width:min(720px,100%)}
.pr-meta{display:flex;flex-wrap:wrap;gap:6px}
.pr-meta span{
  font-size:var(--fs-meta);line-height:1;padding:4px 9px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--brand) 10%,transparent);color:var(--brand-ink);
}
.pr-stem{margin:18px 0 0;font-size:16px;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.pr-actions{display:flex;gap:10px;margin-top:26px}
@media (prefers-reduced-motion:reduce){
  .gb-go i{animation:none}
  .practice{animation:none}
}


/* 宿主内嵌：浮动的切轴与工具条 */
.is-embed .sheet{padding-top:10px}
.is-embed #navBank{display:none}
.is-embed .top{display:none}   /* 内嵌时控件交给宿主顶栏 */
.is-embed .top>*{pointer-events:auto}
.is-embed .top .brand{display:none}
.is-embed .seg{
  padding:3px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-pill);box-shadow:var(--shadow-1);
}
.is-embed .tools{margin-left:auto;gap:6px}
/* 宿主内嵌 + 窄屏：工具条压成一行，隐藏底部提示 */
@media (max-width:720px){
  .is-embed .top{left:10px;right:10px;top:8px;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .is-embed .top::-webkit-scrollbar{display:none}
  .is-embed .seg{padding:2px}
  .is-embed .seg button{height:28px;padding:0 10px;font-size:var(--fs-meta)}
  .is-embed .tools{gap:4px}
  .is-embed .tools .tool{height:28px;padding:0 9px;font-size:var(--fs-meta)}
  .is-embed .hint{display:none}
  .is-embed .sheet{padding-top:42px}
}
.is-embed .tools .tool{
  height:30px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-pill);box-shadow:var(--shadow-1);
}

<body>

，神经网络状态向函数值降低的方向演化，最终达到某个极小值为止，实现已存储信息的重现。该过程可做如下类比：在如图所示的峰谷交错地形中某位置释放一个小球，小球始终沿着重力势能减小的方向运动，直至停在某个山谷底部；小球的位置对应神经网络状态，势能对应函数值。例如，输入模糊字母对应设定小球的初始位置⟨式⟩，小球到达谷底⟨式⟩对应重现出已存储的字母⟨式⟩。下列说法正确的是（ ） ⟨图⟩","stem":"霍普菲尔德模型是神经网络实现联想记忆的核心机制之一。作为物理思想方法在人工神经网络领域应用的重要成果，这项工作获得2024年诺贝尔物理学奖。 简单来说，该模型以0或1表示神经元的状态，所有神经元状态的集合表示神经网络状态；并给神经网络定义了一个“能量函数”（以下简称函数），通过训练使函数变化产生多个极小值，每个极小值对应的神经网络状态代表一个存储信息，也就是记忆。在信息检索与重现过程中，神经网络状态向函数值降低的方向演化，最终达到某个极小值为止，实现已存储信息的重现。该过程可做如下类比：在如图所示的峰谷交错地形中某位置释放一个小球，小球始终沿着重力势能减小的方向运动，直至停在某个山谷底部；小球的位置对应神经网络状态，势能对应函数值。例如，输入模糊字母对应设定小球的初始位置⟨式⟩，小球到达谷底⟨式⟩对应重现出已存储的字母⟨式⟩。下列说法正确的是（ ） ⟨图⟩","opt":"A. 信息的重现过程可类比小球在光滑的凹凸曲面上运动 B. 输入具有微小差别的两个模糊字母，可能重现出不同的已存储字母 C. 输入函数值相等的模糊字母，都可以重现出相同的已存储字母 D. 函数变化使某个谷底消失，仍可重现出原来对应的存储信息"},{"i":53,"c":"BJ-2026-15","src":"2026 北京 · 第 15 题","m":"实验","k":"c-实验-力学实验","l":"k64","t":"t8","t2":"t8d","ty":"实验","d":3,"p":"北京","s":"(1)图1为“探究加速度与力的关系”的实验装置示意图。平衡阻力后，认为桶和砂所受的重力等于小车所受的合力，则桶和砂的总质量⟨式⟩与小车的质量⟨式⟩满足的关系是________。 ⟨图⟩ (2)下列实验操作，正确的是_____________（填选项前的字母）。","stem":"(1)图1为“探究加速度与力的关系”的实验装置示意图。平衡阻力后，认为桶和砂所受的重力等于小车所受的合力，则桶和砂的总质量⟨式⟩与小车的质量⟨式⟩满足的关系是________。 ⟨图⟩ (2)下列实验操作，正确的是_____________（填选项前的字母）。","opt":"A. 在“验证机械能守恒定律”实验中，先接通电源，后释放重锤 B. 在“探究气体等温变化规律”实验中，快速拉动柱塞改变空气柱体积 C. 在“测量玻璃的折射率”实验中，为准确确定入射光线的方向，两枚大头针的距离应适当大些 (3)在“测量金属丝的电阻率”实验中，某同学将实验器材连接成如图2所示的电路。闭合开关后，电流表和电压表均有示数，但移动滑动变阻器的滑片，电流表和电压表的示数几乎不变。拆除导线________可排除故障（填图中导线字母编号）。 〔图〕 排除故障后进行实验。仅考虑由电表内阻引起的实验误差，电阻率的测量值________（选填“偏大”、“偏小”或“没有影响”）。"},{"i":54,"c":"BJ-2026-17","src":"2026 北京 · 第 17 题","m":"电磁学","k":"c-电磁学-电磁感应","l":"k38","t":"t2","t2":"t2c","ty":"计算","d":3,"p":"北京","s":"如图所示，匀强磁场的磁感应强度大小为⟨式⟩、方向竖直向下，宽为⟨式⟩的⟨式⟩型长直金属导轨水平放置，导轨左端接阻值为⟨式⟩的电阻。质量为⟨式⟩的导体棒⟨式⟩在导轨上以初速度⟨式⟩开始运动。运动过程中导体棒与导轨垂直且接触良好，不计导体棒和导轨的电阻及它们间的摩擦。求： ⟨图⟩ (1)初始时刻通过导体棒的电流大小和方向； (2)初始时刻导体棒加速度的大小； (3)导体棒速度从⟨式⟩减为0的过程中电阻⟨式⟩产生的热量。","stem":"如图所示，匀强磁场的磁感应强度大小为⟨式⟩、方向竖直向下，宽为⟨式⟩的⟨式⟩型长直金属导轨水平放置，导轨左端接阻值为⟨式⟩的电阻。质量为⟨式⟩的导体棒⟨式⟩在导轨上以初速度⟨式⟩开始运动。运动过程中导体棒与导轨垂直且接触良好，不计导体棒和导轨的电阻及它们间的摩擦。求： ⟨图⟩ (1)初始时刻通过导体棒的电流大小和方向； (2)初始时刻导体棒加速度的大小； (3)导体棒速度从⟨式⟩减为0的过程中电阻⟨式⟩产生的热量。","opt":""},{" 1} = 77\\,{}^\\circ\\mathrm{C}$，$t_{2} = 27\\,{}^\\circ\\mathrm{C}$。忽略皮肤的形变，大气压强 $p_{0} = 1.05 \\times 10^{5}\\,\\mathrm{Pa}$。求： ⟨图⟩ （1）状态 2 时罐内气体的压强； （2）状态 1 到状态 2 罐内气体内能的变化； （3）状态 2 时皮肤受到的吸力大小。","opt":""},{"i":187,"c":"ZJ6-2025-16","src":"2025 浙江 · 第 16 题","m":"力学","k":"c-力学-牛顿运动定律","l":"k5","t":"t3","t2":"t3b","ty":"计算","d":3,"p":"浙江","s":"某兴趣小组设计了一传送装置，其竖直截面如图所示。AB 是倾角为 $30^{\\circ}$ 的斜轨道，BC 是以恒定速率 $v_{0}$ 顺时针转动的水平传送带，紧靠 C 端有半径为 $R$、质量为 $M$ 置于光滑水平面上的可动半圆弧轨道，水平面和传送带 BC 处于同一高度，各连接处平滑过渡。现有一质量为 $m$ 的物块，从轨道 AB 上与 B 相距 $L$ 的 P 点由静止下滑，经传送带末端 C 点滑入圆弧轨道。物块与传送带间的动摩擦因数为 $\\mu$，其余接触面均光滑。已知 $R = 0.36\\,\\mathrm{m}$，$L = 1.6\\,\\mathrm{m}$，$v_{0} = 5\\,\\mathrm{m}/\\mathrm{s}$，$m = 0.2\\,\\mathrm{kg}$，$M = 1.8\\,\\mathrm{kg}$，$\\mu = 0.25$。不计空气阻力，物块可视为质点，传送带足够长。求物块 ⟨图⟩ （1）滑到 B 点处的速度大小； （2）从 B 点运动到 C 点过程中摩擦力对其做的功； （3）在传送带上滑动过程中产生的滑痕长度； （4）即将离开圆弧轨道最高点的瞬间，受到轨道的压力大小。","stem":"某兴趣小组设计了一传送装置，其竖直截面如图所示。AB 是倾角为 $30^{\\circ}$ 的斜轨道，BC 是以恒定速率 $v_{0}$ 顺时针转动的水平传送带，紧靠 C 端有半径为 $R$、质量为 $M$ 置于光滑水平面上的可动半圆弧轨道，水平面和传送带 BC 处于同一高度，各连接处平滑过渡。现有一质量为 $m$ 的物块，从轨道 AB 上与 B 相距 $L$ 的 P 点由静止下滑，经传送带末端 C 点滑入圆弧轨道。物块与传送带间的动摩擦因数为 $\\mu$，其余接触面均光滑。已知 $R = 0.36\\,\\mathrm{m}$，$L = 1.6\\,\\mathrm{m}$，$v_{0} = 5\\,\\mathrm{m}/\\mathrm{s}$，$m = 0.2\\,\\mathrm{kg}$，$M = 1.8\\,\\mathrm{kg}$，$\\mu = 0.25$。不计空气阻力，物块可视为质点，传送带足够长。求物块 ⟨图⟩ （1）滑到 B 点处的速度大小； （2）从 B 点运动到 C 点过程中摩擦力对其做的功； （3）在传送带上滑动过程中产生的滑痕长度； （4）即将离开圆弧轨道最高点的瞬间，受到轨道的压力大小。","opt":""},{"i":188,"c":"ZJ6-2025-17","src":"2025 浙江 · 第 17 题","m":"电磁学","k":"c-电磁学-电磁感应","l":"k38","t":"t2","t2":"t2c","ty":"计算","d":4,"p":"浙江","s":"如图所示，某兴趣小组设计了一新型两级水平电磁弹射系统。第一级由间距为 $l$ 的水平金属导轨、可在导轨上滑行的导电动子、输出电压恒为 $U$ 的电源和开关 S 组成，由此构成的回路总电阻为 $R_{1}$；第二级由固定在动子上间距也为 $l$ 的导电“$\\subset$”形滑杆、锁定在滑杆上可导电的模型飞机组成，由此构成的回路总电阻为 $R_{2}$。另外在第二级回路内固定一超导线圈，它与第一、第二两级回路三者彼此绝缘。导轨间存在方向竖直向下、磁感应强度大小为 $B$ 的匀强磁场。接通开关 S，动子从静止开始运动，所受阻力与其速度成正比，比例系数为 $k$。当动子运动距离为 $x_{m}$ 时（可视为已匀速），立即断开 S，在极短时间内实现下列操作：首先让超导线圈通上大电流，产生竖直方向的强磁场，在第二级回路中产生磁通量 $\\Phi$；再让超导线圈断开，磁场快速消失，同时解锁飞机，对飞机实施第二次加速，飞机起飞。已知动子及安装其上所有装备的总质量为 $M$，其中飞机质量为 $m$，在运动过程 子 1 的速度方向与磁场方向垂直，粒子 2 的速度方向与磁场方向平行。在相同的时间内，粒子 1 在半径为 $R$ 的圆周上转过的圆心角为 $\\theta$，粒子 2 运动的距离为 $d$。求： a．粒子 1 与粒子 2 的速度大小之比 $v_{1}:v_{2}$； b．粒子 2 的动量大小 $p_{2}$。","opt":""},{"i":235,"c":"BJ-2025-19","src":"2025 北京 · 第 19 题","m":"力学","k":"c-力学-动量","l":"k21","t":"t1","t2":"t1b","ty":"计算","d":3,"p":"北京","s":"关于飞机的运动，研究下列问题。 （1）质量为 $m$ 的飞机在水平跑道上由静止开始做加速直线运动，当位移为 $x$ 时速度为 $v$。在此过程中，飞机受到的平均阻力为 $f$，求牵引力对飞机做的功 $W$。 （2）飞机准备起飞，在跑道起点由静止开始做匀加速直线运动。跑道上存在这样一个位置，飞机一旦超过该位置就不能放弃起飞，否则将会冲出跑道。已知跑道的长度为 $L$，飞机加速时加速度大小为 $a_{1}$，减速时最大加速度大小为 $a_{2}$。求该位置距起点的距离 $d$。 （3）无风时，飞机以速率 $u$ 水平向前匀速飞行，相当于气流以速率 $u$ 相对飞机向后运动。气流掠过飞机机翼，方向改变，沿机翼向后下方运动，如图所示。请建立合理的物理模型，论证气流对机翼竖直向上的作用力大小 $F$ 与 $u$ 的关系满足 $F \\propto u^{\\alpha}$，并确定 $\\alpha$ 的值。 ⟨图⟩","stem":"关于飞机的运动，研究下列问题。 （1）质量为 $m$ 的飞机在水平跑道上由静止开始做加速直线运动，当位移为 $x$ 时速度为 $v$。在此过程中，飞机受到的平均阻力为 $f$，求牵引力对飞机做的功 $W$。 （2）飞机准备起飞，在跑道起点由静止开始做匀加速直线运动。跑道上存在这样一个位置，飞机一旦超过该位置就不能放弃起飞，否则将会冲出跑道。已知跑道的长度为 $L$，飞机加速时加速度大小为 $a_{1}$，减速时最大加速度大小为 $a_{2}$。求该位置距起点的距离 $d$。 （3）无风时，飞机以速率 $u$ 水平向前匀速飞行，相当于气流以速率 $u$ 相对飞机向后运动。气流掠过飞机机翼，方向改变，沿机翼向后下方运动，如图所示。请建立合理的物理模型，论证气流对机翼竖直向上的作用力大小 $F$ 与 $u$ 的关系满足 $F \\propto u^{\\alpha}$，并确定 $\\alpha$ 的值。 ⟨图⟩","opt":""},{"i":236,"c":"BJ-2025-20","src":"2025 北京 · 第 20 题","m":"力学","k":"c-力学-功和能","l":"k16","t":"t5","t2":"t5b","ty":"计算","d":4,"p":"北京","s":"如图(a)所示，金属圆筒 A 接高压电源的正极，其轴线上的金属线 B 接负极。 （1）设 A、B 两极间电压为 $U$，求在 B 极附近电荷量为 $Q$ 的负电荷到达 A 极过程中静电力做的功 $W$。 （2）已知筒内距离轴线 $r$ 处的电场强度大小 $E = k\\frac{2\\lambda}{r}$，其中 $k$ 为静电力常量，$\\lambda$ 为金属线 B 单位长度的电荷量。如图(b)所示，在圆筒内横截面上，电荷量为 $q$、质量为 $m$ 的粒子绕轴线做半径不同的匀速圆周运动，其半径为 $r_{1}$、$r_{2}$ 和 $r_{3}$ 时的总能量分别为 $E_{1}$、$E_{2}$ 和 $E_{3}$。若 $r_{3} - r_{2} = r_{2} - r_{1}$，推理分析并比较（$E_{3} - E_{2}$）与（$E_{2} - E_{1}$）的大小。 （3）图(a)实为某种静电除尘装置原理图，空气分子在 B 极附近电离，筒内尘埃吸附电子而带负电，在电场作用下最终被 A 极收集。使分子或原子电离需要一定条件。以电离氢原子为例。根据玻尔原子模型，定态氢原子中电子在特定轨道上绕核做圆周运动，处于特定能量状态，只有当原子获得合适能量才能跃迁或电离。若氢原子处于外电场中，推导说明外电场的电场强度多大能将基态氢原子电离。（可能用到：元电荷 $e = 1.60 \\times 10^{-19} \\,\\mathrm{C}$，电子质量 $m = 9.1 \\times 10^{-31} \\,\\mathrm{kg}$，静电力常量 $k = 9.0 \\times 10^{9} \\,\\mathrm{N}\\c 、乙的引力，则","stem":"2025 年 4 月，我国已成功构建国际首个基于 DRO（远距离逆行轨道）的地月空间三星星座，DRO 具有“低能进入、稳定停泊、机动转移”的特点。若卫星甲从 DRO 变轨进入环月椭圆轨道，该轨道的近月点和远月点距月球表面的高度分别为 $a$ 和 $b$，卫星的运行周期为 $T$；卫星乙从 DRO 变轨进入半径为 $r$ 的环月圆形轨道，周期也为 $T$。月球的质量为 $M$，半径为 $R$，引力常量为 $G$。假设只考虑月球对甲、乙的引力，则","opt":"A. $r = \\frac{a + b + R}{2}$ B. $r = \\frac{a + b}{2} + R$ C. $M = \\frac{4\\pi^{2}r^{3}}{GT^{2}}$ D. $M = \\frac{4\\pi^{2}R^{3}}{GT^{2}}$"},{"i":273,"c":"AH-2025-10","src":"2025 安徽 · 第 10 题","m":"力学","k":"c-力学-牛顿运动定律","l":"k5","t":"t3","t2":"t3a","ty":"多选","d":4,"p":"安徽","s":"如图，两个倾角相等、底端相连的光滑绝缘轨道被固定在竖直平面内，空间存在平行于该竖直平面水平向右的匀强电场。带正电的甲、乙小球（均可视为质点）在轨道上同一高度保持静止，间距为 $L$，甲、乙所带电荷量分别为 $q$、$2q$，质量分别为 $m$、$2m$，静电力常量为 $k$，重力加速度大小为 $g$。甲、乙所受静电力的合力大小分别为 $F_{1}$、$F_{2}$，匀强电场的电场强度大小为 $E$，不计空气阻力，则 ⟨图⟩","stem":"如图，两个倾角相等、底端相连的光滑绝缘轨道被固定在竖直平面内，空间存在平行于该竖直平面水平向右的匀强电场。带正电的甲、乙小球（均可视为质点）在轨道上同一高度保持静止，间距为 $L$，甲、乙所带电荷量分别为 $q$、$2q$，质量分别为 $m$、$2m$，静电力常量为 $k$，重力加速度大小为 $g$。甲、乙所受静电力的合力大小分别为 $F_{1}$、$F_{2}$，匀强电场的电场强度大小为 $E$，不计空气阻力，则 ⟨图⟩","opt":"A. $F_{1} = \\frac{1}{2}F_{2}$ B. $E = \\frac{kq}{2L^{2}}$ C. 若将甲、乙互换位置，二者仍能保持静止 D. 若撤去甲，乙下滑至底端时的速度大小 $v = \\sqrt{\\frac{kq^{2}}{mL}}$"},{"i":274,"c":"AH-2025-11","src":"2025 安徽 · 第 11 题","m":"实验","k":"c-实验-力学实验","l":"k64","t":"t8","t2":"t8c","ty":"实验","d":3,"p":"安徽","s":"某实验小组通过实验探究加速度与力、质量的关系。 （1）利用图(a) 装置进行实验，要平衡小车受到的阻力。平衡阻力的方法是：调整轨道的倾斜度，使小车 ＿＿＿＿＿＿。（选填正确答案标号） a．能在轨道上保持静止 b．受牵引时，能拖动纸带沿轨道做匀速运动 c．不受牵引时，能拖动纸带沿轨道做匀速运动 （2）利用图(b) 装置进行实验，箱体的水平底板上安装有力传感器和加速度传感器，将物体置于力传感器上，箱体沿竖直方向运动。利用传感器测得物体受到的支持力 $F_{N}$ 和物体的加速度 $a$，并将数据实时传送到计算机。 ①图(c) 是根据某次实验采集的数据生成的 $F_{N}$ 和 $a$ 随时间 $t$ 变化的散点图，以竖直向上为正方向。$t = 4 \\,\\mathrm{s}$ 时，物体处于 ＿＿＿＿＿＿（选填“超重”或“失重”）状态；以 $F_{N}$ 为横轴、$a$ 为纵轴，根据实验数据拟合得到的 $a-F_{N}$ 图像为图(d) 中的图线 a。 ②若将物体质量增大一倍，重新进行实验，其 $a-F_{N}$ 图像为图(d) 中的图线 ＿＿＿＿＿＿。（选填“b”“c”或“d”） ⟨图⟩⟨图⟩⟨图⟩⟨图⟩","stem":"某实验小组通过实验探究加速度与力、质量的关系。 （1）利用图(a) 装置进行实验，要平衡小车受到的阻力。平衡阻力的方法是：调整轨道的倾斜度，使小车 ＿＿＿＿＿＿。（选填正确答案标号） a．能在轨道上保持静止 b．受牵引时，能拖动纸带沿轨道做匀速运动 c．不受牵引时，能拖动纸带沿轨道做匀速运动 （2）利用图(b) 装置进行实验，箱体的水平底板上安装有力传感器和加速度传感器，将物体置于力传感器上，箱体沿竖直方向运动。利用传感器测得物体受到的支持力 $F_{N}$ 和物体 着闭合 $S_{1}$、断开 $S_{2}$，将滑动变阻器的阻值调到零，再调节电阻箱的阻值。当电阻箱的阻值调为 $228 \\,\\Omega$ 时，指针指向“15”刻度位置（即电路中的电流为 $10 \\,\\mathrm{mA}$）；当电阻箱的阻值调为 $88 \\,\\Omega$ 时，指针指向“0”刻度位置（即电路中的电流为 $20 \\,\\mathrm{mA}$）。由测量数据计算出电源电动势为 ＿＿＿＿＿＿ $\\,\\mathrm{V}$。（结果保留 2 位有效数字） ⟨图⟩⟨图⟩","opt":""},{"i":276,"c":"AH-2025-13","src":"2025 安徽 · 第 13 题","m":"光学","k":"c-光学-几何光学","l":"k52","t":"t6","t2":"t6c","ty":"计算","d":3,"p":"安徽","s":"如图，玻璃砖的横截面是半径为 $R$ 的半圆，圆心为 $O$ 点，直径与 $x$ 轴重合。一束平行于 $x$ 轴的激光，从横截面上的 $P$ 点由空气射入玻璃砖，从 $Q$ 点射出。已知 $P$ 点到 $x$ 轴的距离为 $\\frac{\\sqrt{2}}{2}R$，$P$、$Q$ 间的距离为 $\\sqrt{3}R$。 （1）求玻璃砖的折射率； （2）在该横截面沿圆弧任意改变入射点的位置和入射方向，使激光能在圆心 $O$ 点发生全反射，求入射光线与 $x$ 轴之间夹角的范围。 ⟨图⟩","stem":"如图，玻璃砖的横截面是半径为 $R$ 的半圆，圆心为 $O$ 点，直径与 $x$ 轴重合。一束平行于 $x$ 轴的激光，从横截面上的 $P$ 点由空气射入玻璃砖，从 $Q$ 点射出。已知 $P$ 点到 $x$ 轴的距离为 $\\frac{\\sqrt{2}}{2}R$，$P$、$Q$ 间的距离为 $\\sqrt{3}R$。 （1）求玻璃砖的折射率； （2）在该横截面沿圆弧任意改变入射点的位置和入射方向，使激光能在圆心 $O$ 点发生全反射，求入射光线与 $x$ 轴之间夹角的范围。 ⟨图⟩","opt":""},{"i":277,"c":"AH-2025-14","src":"2025 安徽 · 第 14 题","m":"力学","k":"c-力学-曲线运动","l":"k9","t":"t6","t2":"t6a","ty":"计算","d":3,"p":"安徽","s":"如图，M、N 为固定在竖直平面内同一高度的两根细钉，间距 $L = 0.5 \\,\\mathrm{m}$。一根长为 $3L$ 的轻绳一端系在 M 上，另一端竖直悬挂质量 $m = 0.1 \\,\\mathrm{kg}$ 的小球，小球与水平地面接触但无压力。$t = 0$ 时，小球以水平向右的初速度 $v_{0} = 10 \\,\\mathrm{m}/\\mathrm{s}$ 开始在竖直平面内做圆周运动。小球牵引着绳子绕过 N、M，运动到 M 正下方与 M 相距 $L$ 的位置时，绳子刚好被拉断，小球开始做平抛运动。小球可视为质点，绳子不可伸长，不计空气阻力，重力加速度 $g$ 取 $10 \\,\\mathrm{m}/\\mathrm{s}^2$。 （1）求绳子被拉断时小球的速度大小，及绳子所受的最大拉力大小； （2）求小球做平抛运动时抛出点到落地点的水平距离； （3）若在 $t = 0$ 时，只改变小球的初速度大小，使小球能通过 N 的正上方且绳子不松弛，求初速度的最小值。 ⟨图⟩","stem":"如图，M、N 为固定在竖直平面内同一高度的两根细钉，间距 $L = 0.5 \\,\\mathrm{m}$。一根长为 $3L$ 的轻绳一端系在 M 上，另一端竖直悬挂质量 $m = 0.1 \\,\\mathrm{kg}$ 的小球，小球与水平地面接触但无压力。$t = 0$ 时，小球以水平向右的初速度 $v_{0} = 10 \\,\\mathrm{m}/\\mathrm{s}$ 开始在竖直平面内做圆周运动。小球牵引着绳子绕过 N、M，运动到 M 正下方与 M 相距 $L$ 的位置时，绳子刚好被拉断，小球开始做平抛运动。小球可视为质点，绳子不可伸长，不计空气阻力，重力加速度 $g$ 取 $10 \\,\\mathrm{m}/\\mathrm{s}^2$。 （1）求绳子被拉断时小球的速度大小，及绳子所受的最大拉力大小； （2）求小球做平抛运动时抛出点到落地点的水平距离； （3）若在 $t = 0$ 时，只改变小球的初速度大小，使小球能通过 N 的正上方且绳子不松弛，求初速度的最小值。 ⟨图⟩","opt":""},{"i":278,"c":"AH-2025-15","src":"2025 安徽 · 第 15 题","m":"电磁学","k":"c-电磁学-电磁感应","l":"k39","t":"t2","t2":"t2c","ty":"计算","d":4,"p":"安徽","s":"如图，平行光滑金属导轨被固定在水平绝缘桌面上，导轨间距为 $L$，右端连接阻值为 $R$ 的定值电阻。水平导轨上足够长的矩形区域 MNPQ 存在竖直向上的匀强磁场，磁感应强度大小为 $B$。某装置从 MQ 左侧沿导轨水平向右发射第 1 根导体棒，导体棒以初速度 $v_{0}$ 进入磁场，速度减为 0 时被锁定；从原位置再发射第 2 根相同的导体棒，导体棒仍以初速度 $v_{0}$ 进入磁场，速度减为 0 时被锁定，以此类推，直到发射第 $n$ 根相同的导体棒进入磁场。已知导体棒的质量为 $m$，电阻为 $R$，长度恰好等于导轨间距，与导轨接触良好（发射前导体棒与导轨不接触），不计空气阻力、导轨的电阻，忽略回路中的电流对原磁场的影响。求： （1）第 1 根导体棒刚进入磁场时，所受安培力的功率； （2）第 2 根导体棒从进入磁场到速度减为 0 的过程中，其横截面上通过的电荷量； （3）从第 1 根导体棒进入磁场到第 $n$ 根导体棒速度减为 0 的过程中，导轨右端定值电阻 $R$ 上产生的总热量。 ⟨图⟩","stem":"如图，平行光滑金属导轨被固定在水平绝缘桌面上，导轨间距为 $L$，右端连接阻值为 $R$ 的定值电阻。水平导轨上足够长的矩形区域 MNPQ 存在竖直向上的匀强磁场，磁感应强度大小为 $B$。某装置从 MQ 左侧沿导轨水平向右发射第 1 根导体棒，导体棒以初速度 $v_{0}$ 进入磁场，速度减为 0 时被锁定；从原位置再发射第 2 根相同的导体棒，导体棒仍以初速度 $v_{0}$ 进入磁场，速度减为 0 时被锁定，以此类推，直到发射第 $n$ 根相同的导体棒进入磁场。已知导体棒的质量为 $m$，电阻为 $R$，长度恰好等于导轨间距，与导轨接触良好（发射前导体棒与导轨不接触），不计空气阻力、导轨的电阻，忽略回路中的电流对原磁场的影响。求： （1）第 1 根导体棒刚进入磁场时，所受安培力的功率； （2）第 2 根导体棒从进入磁场到速度减为 0 的过程中，其横截面上通过的电荷量； （3）从第 1 根导体棒进入磁场到第 $n$ 根导体棒速度减为 0 的过程中，导轨右端定值电阻 $R$ 上产生的总热量。 ⟨图⟩","opt":""},{"i":279,"c":"SD-2025-01","src":"2025 山东 · 第 1 题","m":"近代物理","k":"c-近代物理-原子物理","l":"k58","t":"t8","t2":"t8a","ty":"单选","d":2,"p":"山东","s":"在光电效应实验中，用频率和强度都相同的单色光分别照射编号为 1、2、3 的金属，所得遏止电压如图所示，关于光电子最大初动能 $E_{k}$ 的大小关系正确的是 ⟨图⟩","stem":"在光电效应实验中，用频率和强度都相同的单色光分别照射编号为 1、2、3 的金属，所得遏止电压如图所示，关于光电子最大初动能 $E_{k}$ 的大小关系正确的是 ⟨图⟩","opt":"A. $E_{k1} > E_{k2} > E_{k3}$ B. $E_{k2} > E_{k3} > E_{k1}$ C. $E_{k3} > E_{k2} > E_{k1}$ D. $E_{k3} > E_{k1} > E_{k2}$"},{"i":280,"c":"SD-2025-02","src":"2025 山东 · 第 2 题","m":"热学","k":"c-热学-分子动理论与热力学定律","l":"k46","t":"t1","t2":"t1b","ty":"单选","d":2,"p":"山东","s":"分子间作用力 $F$ 与分子间距离 $r$ 的关系如图所示，若规定两个分子间距离 $r$ 等于 $r_{0}$ 时分子势能 $E_{p}$ 为零，则 ⟨图⟩","stem":"分子间作用力 $F$ 与分子间距离 $r$ 的关系如图所示，若规定两个分子间距离 $r$ 等于 $r_{0}$ 时分子势能 $E_{p}$ 为零，则 ⟨图⟩","opt":"A. 只有 $r$ 大于 $r_{0}$ 时，$E_{p}$ 为正 B. 只有 $r$ 小于 $r_{0}$ 时，$E_{p}$ 为正 C. 当 $r$ 不等于 $r_{0}$ 时，$E_{p}$ 为正 D. 当 $r$ 不等于 $r_{0}$ 时，$E_{p}$ 为负"},{"i":281,"c":"SD-2025-03","src":"2025 山东 · 第 3 题","m": 电阻抑制电流异常增大，起到过热保护作用。这种热敏电阻与电阻 ＿＿＿＿＿＿（填“$R_{1}$”或“$R_{2}$”）具有相同温度特性。 （2）某学习小组在倾斜的气垫导轨上验证机械能守恒定律，实验装置如图(c)所示，当地重力加速度为 $g$。 ①方案设计阶段，该小组同学对需要测量哪些物理量产生了不同意见。 甲同学：需测量滑块和遮光条的总质量、滑块通过两个光电门的速度、两个光电门间的竖直高度差。 乙同学：只需测量滑块通过两个光电门的速度、两个光电门间的竖直高度差。 丙同学：只需测量滑块通过两个光电门的速度、两个光电门间的距离。 你认为 ＿＿＿＿＿＿（填“甲”“乙”或“丙”）同学的方案不可行。 ②如图(c)，光电门中光源与光敏管相对，光源发出的光使光敏管感光。当滑块经过时，遮光条把光遮住，计时器记录遮光时间，可计算出滑块的速度。实验中使用的遮光条宽度 $d_{1} = 10.0\\,\\mathrm{mm}$，光电门宽度 $d_{2} = 20.0\\,\\mathrm{mm}$。某次测量时，记录通过光电门 A 的遮光时间为 $25.0 \\, \\mathrm{ms} $，则滑块经过光电门 A 的速度大小为 ＿＿＿＿＿＿ $\\,\\mathrm{m}/\\mathrm{s}$。 ⟨图⟩⟨图⟩⟨图⟩","stem":"（1）某学习小组把热敏电阻置于带有温控的加热装置中，利用图(a)所示电路研究热敏电阻的温度特性。 ①闭合开关 S，观察到温度改变时电流表示数也随之改变。定量研究热敏电阻的阻值 $R$ 随温度 $t$ 变化的规律时，将欧姆表两表笔分别接到热敏电阻 a、b 两端测量其阻值，这时开关 S 应 ＿＿＿＿＿＿（填“断开”或“闭合”）。 ②按照正确方法测出不同温度下热敏电阻的阻值。电阻 $R_{1}$、$R_{2}$ 与温度 $t$ 的关系分别对应图(b)中曲线 Ⅰ、Ⅱ。设计电路时，为防止用电器发生故障引起电流异常增大，导致个别电子元件温度过高而损坏，可串联一个热敏电阻抑制电流异常增大，起到过热保护作用。这种热敏电阻与电阻 ＿＿＿＿＿＿（填“$R_{1}$”或“$R_{2}$”）具有相同温度特性。 （2）某学习小组在倾斜的气垫导轨上验证机械能守恒定律，实验装置如图(c)所示，当地重力加速度为 $g$。 ①方案设计阶段，该小组同学对需要测量哪些物理量产生了不同意见。 甲同学：需测量滑块和遮光条的总质量、滑块通过两个光电门的速度、两个光电门间的竖直高度差。 乙同学：只需测量滑块通过两个光电门的速度、两个光电门间的竖直高度差。 丙同学：只需测量滑块通过两个光电门的速度、两个光电门间的距离。 你认为 ＿＿＿＿＿＿（填“甲”“乙”或“丙”）同学的方案不可行。 ②如图(c)，光电门中光源与光敏管相对，光源发出的光使光敏管感光。当滑块经过时，遮光条把光遮住，计时器记录遮光时间，可计算出滑块的速度。实验中使用的遮光条宽度 $d_{1} = 10.0\\,\\mathrm{mm}$，光电门宽度 $d_{2} = 20.0\\,\\mathrm{mm}$。某次测量时，记录通过光电门 A 的遮光时间为 $25.0 \\, \\mathrm{ms} $，则滑块经过光电门 A 的速度大小为 ＿＿＿＿＿＿ $\\,\\mathrm{m}/\\mathrm{s}$。 ⟨图⟩⟨图⟩⟨图⟩","opt":""},{"i":364,"c":"HE-2025-12","src":"2025 河北 · 第 12 题","m":"实验","k":"c-实验-力学实验","l":"kx14","t":"t8","t2":"t8c","ty":"实验","d":3,"p":"河北","s":"自动洗衣机水位检测的精度会影响洗净比和能效等级。某款洗衣机水位检测结构如图(a)所示。洗衣桶内水位升高时，集气室内气体压强增大，铁芯进入电感线圈的长度增加，从而改变线圈的自感系数。洗衣机智能电路通过测定 LC 振荡电路的频率来确定水位高度。 某兴趣小组在恒温环境中对此装置进行实验研究。 （1）研究集气室内气体压强与体积的关系。 ①洗衣桶内水位 $H$ 一定时，其内径 $D$ 的大小 ＿＿＿＿＿＿（填“会”或“不会”）影响集气室内气体压强的大小。 ②测量集气室高度 $h_{0}$、集气室内径 $d$。然后缓慢增加桶内水量，记录桶内水位高度 $H$ 和集气室进水高度，同时使用气压传感器测量集气室内气体压强 $p$。$H$ 和 $h$ 数据如下表所示。 $H/\\,\\mathrm{cm}$ ｜ 15.00 ｜ 20.00 ｜ 25.00 ｜ 30.00 ｜ 35.00 ｜ 40.00 ｜ 45.00 ｜ 50.00 $h/\\,\\mathrm{cm}$ ｜ 0.33 ｜ 0.40 ｜ 0 。已知 $A_{5}$ 音和 $D_{6}$ 音所对应的频率分别为 $880 \\,\\mathrm{Hz}$ 和 $1175 \\,\\mathrm{Hz}$，则","opt":"A. 在空气中传播时，$A_{5}$ 音的波长大于 $D_{6}$ 音的 B. 在空气中传播时，$A_{5}$ 音的波速小于 $D_{6}$ 音的 C. 由空气进入水中，$A_{5}$ 音和 $D_{6}$ 音的频率都变大 D. 由空气进入水中，$A_{5}$ 音的波长改变量大于 $D_{6}$ 音的"},{"i":374,"c":"HA-2025-09","src":"2025 河南 · 第 9 题","m":"电磁学","k":"c-电磁学-电磁感应","l":"kx9","t":"t7","t2":"t7c","ty":"多选","d":3,"p":"河南","s":"手机拍照时手的抖动产生的微小加速度会影响拍照质量，光学防抖技术可以消除这种影响。如图，镜头仅通过左、下两侧的弹簧与手机框架相连，两个相同线圈 c、d 分别固定在镜头右、上两侧，c、d 中的一部分处在相同的匀强磁场中，磁场方向垂直纸面向里。拍照时，手机可实时检测手机框架的微小加速度 $a$ 的大小和方向，依此自动调节 c、d 中通入的电流 $I_{c}$ 和 $I_{d}$ 的大小和方向（无抖动时 $I_{c}$ 和 $I_{d}$ 均为零），使镜头处于零加速度状态。下列说法正确的是 ⟨图⟩","stem":"手机拍照时手的抖动产生的微小加速度会影响拍照质量，光学防抖技术可以消除这种影响。如图，镜头仅通过左、下两侧的弹簧与手机框架相连，两个相同线圈 c、d 分别固定在镜头右、上两侧，c、d 中的一部分处在相同的匀强磁场中，磁场方向垂直纸面向里。拍照时，手机可实时检测手机框架的微小加速度 $a$ 的大小和方向，依此自动调节 c、d 中通入的电流 $I_{c}$ 和 $I_{d}$ 的大小和方向（无抖动时 $I_{c}$ 和 $I_{d}$ 均为零），使镜头处于零加速度状态。下列说法正确的是 ⟨图⟩","opt":"A. 若 $I_{c}$ 沿顺时针方向，$I_{d} = 0$，则表明 $a$ 的方向向右 B. 若 $I_{d}$ 沿顺时针方向，$I_{c} = 0$，则表明 $a$ 的方向向下 C. 若 $a$ 的方向沿左偏上 $30^\\circ$，则 $I_{c}$ 沿顺时针方向，$I_{d}$ 沿逆时针方向且 $I_{c} > I_{d}$ D. 若 $a$ 的方向沿右偏上 $30^\\circ$，则 $I_{c}$ 沿顺时针方向，$I_{d}$ 沿顺时针方向且 $I_{c} < I_{d}$"},{"i":375,"c":"HA-2025-10","src":"2025 河南 · 第 10 题","m":"热学","k":"c-热学-理想气体","l":"k49","t":"t3","t2":"t3a","ty":"多选","d":4,"p":"河南","s":"如图，一圆柱形汽缸水平固置，其内部被活塞 M、P、N 密封成两部分，活塞 P 与汽缸壁均绝热且两者间无摩擦。平衡时，P 左、右两侧理想气体的温度分别为 $T_{1}$ 和 $T_{2}$，体积分别为 $V_{1}$ 和 $V_{2}$，$T_{1} < T_{2}$，$V_{1} < V_{2}$。则 ⟨图⟩","stem":"如图，一圆柱形汽缸水平固置，其内部被活塞 M、P、N 密封成两部分，活塞 P 与汽缸壁均绝热且两者间无摩擦。平衡时，P 左、右两侧理想气体的温度分别为 $T_{1}$ 和 $T_{2}$，体积分别为 $V_{1}$ 和 $V_{2}$，$T_{1} < T_{2}$，$V_{1} < V_{2}$。则 ⟨图⟩","opt":"A. 固定 M、N，若两侧气体同时缓慢升高相同温度，P 将右移 B. 固定 M、N，若两侧气体同时缓慢升高相同温度，P 将左移 C. 保持 $T_{1}$、$T_{2}$ 不变，若 M、N 同时缓慢向中间移动相同距离，P 将右移 D. 保持 $T_{1}$、$T_{2}$ 不变，若 M、N 同时缓慢向中间移动相同距离，P 将左移"},{"i":376,"c":"HA-2025-11","src":"2025 河南 · 第 11 题","m":"实验","k":"c-实验-电学实验","l":"kx13","t":"t8","t2":"t9b","ty":"实验","d":3,"p":"河南","s":"实验小组研究某热敏电阻的特性，并依此利用电磁铁、电阻箱等器材组装保温箱。该热敏电阻阻值随温度的变化曲线如图(a) 所示，保温箱原理图如图(b) 所示。回答下列问题： （1 、乙两个合金导线框的质量均为 $m$，长均为 $2L$，宽均为 $L$，电阻分别为 $R$ 和 $2R$。两线框在光滑水平面上以相同初速度 $v_{0} = \\frac{4B^{2}L^{3}}{mR}$ 并排进入磁场，忽略两线框之间的相互作用。则 ⟨图⟩","opt":"A. 甲线框进磁场和出磁场的过程中电流方向相同 B. 甲、乙线框刚进磁场区域时，所受合力大小之比为 $1:1$ C. 乙线框恰好完全出磁场区域时，速度大小为 $0$ D. 甲、乙线框从刚进磁场区域到完全出磁场区域产生的焦耳热之比为 $4:3$"},{"i":494,"c":"SN-2025-09","src":"2025 陕晋宁青 · 第 9 题","m":"光学","k":"c-光学-波动光学","l":"k55","t":"t8","t2":"t8a","ty":"多选","d":3,"p":"陕晋宁青","s":"在双缝干涉实验中，某实验小组用波长为 $440 \\,\\mathrm{nm}$ 的蓝色激光和波长为 $660 \\,\\mathrm{nm}$ 的红色激光组成的复合光垂直照射双缝，双缝间距为 $0.5 \\,\\mathrm{mm}$，双缝到屏的距离为 $500 \\,\\mathrm{mm}$，则屏上","stem":"在双缝干涉实验中，某实验小组用波长为 $440 \\,\\mathrm{nm}$ 的蓝色激光和波长为 $660 \\,\\mathrm{nm}$ 的红色激光组成的复合光垂直照射双缝，双缝间距为 $0.5 \\,\\mathrm{mm}$，双缝到屏的距离为 $500 \\,\\mathrm{mm}$，则屏上","opt":"A. 蓝光与红光之间能发生干涉形成条纹 B. 蓝光相邻条纹间距比红光相邻条纹间距小 C. 距中央亮条纹中心 $1.32 \\,\\mathrm{mm}$ 处蓝光和红光亮条纹中心重叠 D. 距中央亮条纹中心 $1.98 \\,\\mathrm{mm}$ 处蓝光和红光亮条纹中心重叠"},{"i":495,"c":"SN-2025-10","src":"2025 陕晋宁青 · 第 10 题","m":"力学","k":"c-力学-功和能","l":"k16","t":"t3","t2":"t3b","ty":"多选","d":4,"p":"陕晋宁青","s":"如图，与水平面成 $53^\\circ$ 夹角且固定于 O、M 两点的硬直杆上套着一质量为 $1 \\,\\mathrm{kg}$ 的滑块，弹性轻绳一端固定于 O 点，另一端跨过固定在 Q 处的光滑定滑轮与位于直杆上 P 点的滑块拴接，弹性轻绳原长为 OQ，PQ 为 $1.6 \\,\\mathrm{m}$ 且垂直于 OM。现将滑块无初速度释放，假设最大静摩擦力与滑动摩擦力相等。滑块与杆之间的动摩擦因数为 0.16，弹性轻绳上弹力 $F$ 的大小与其伸长量 $x$ 满足 $F = kx$，$k = 10 \\,\\mathrm{N}/\\mathrm{m}$，$g$ 取 $10 \\,\\mathrm{m}/\\mathrm{s}^2$，$\\sin 53^\\circ = 0.8$。则滑块 ⟨图⟩","stem":"如图，与水平面成 $53^\\circ$ 夹角且固定于 O、M 两点的硬直杆上套着一质量为 $1 \\,\\mathrm{kg}$ 的滑块，弹性轻绳一端固定于 O 点，另一端跨过固定在 Q 处的光滑定滑轮与位于直杆上 P 点的滑块拴接，弹性轻绳原长为 OQ，PQ 为 $1.6 \\,\\mathrm{m}$ 且垂直于 OM。现将滑块无初速度释放，假设最大静摩擦力与滑动摩擦力相等。滑块与杆之间的动摩擦因数为 0.16，弹性轻绳上弹力 $F$ 的大小与其伸长量 $x$ 满足 $F = kx$，$k = 10 \\,\\mathrm{N}/\\mathrm{m}$，$g$ 取 $10 \\,\\mathrm{m}/\\mathrm{s}^2$，$\\sin 53^\\circ = 0.8$。则滑块 ⟨图⟩","opt":"A. 与杆之间的滑动摩擦力大小始终为 $1.6 \\,\\mathrm{N}$ B. 下滑与上滑过程中所受滑动摩擦力的冲量相同 C. 从释放到静止的位移大小为 $0.64 \\,\\mathrm{m}$ D. 从释放到静止克服滑动摩擦力做功为 $2.56 \\,\\mathrm{J}$"},{"i":496,"c":"SN-2025-11","src":"2025 陕晋宁青 · 第 11 题","m":"实验","k":"c-实验-力学实验","l":"k67","t":"t8","t2":"t8c","ty":"实验","d 。两弹簧处于原长时，M 位于 $R$ 的中点，理想电压表的指针位于表盘中央。当 P 端电势高于 Q 端时，指针位于表盘右侧。将加速度计固定在水平运动的被测物体上，则下列说法正确的是 ⟨图⟩","stem":"如图所示为一个加速度计的原理图。滑块可沿光滑杆移动，滑块两侧与两根相同的轻弹簧连接；固定在滑块上的滑动片 M 下端与滑动变阻器 $R$ 接触良好，且不计摩擦；两个电源的电动势 $E$ 相同，内阻不计。两弹簧处于原长时，M 位于 $R$ 的中点，理想电压表的指针位于表盘中央。当 P 端电势高于 Q 端时，指针位于表盘右侧。将加速度计固定在水平运动的被测物体上，则下列说法正确的是 ⟨图⟩","opt":"A. 若 M 位于 $R$ 的中点右侧，P 端电势低于 Q 端 B. 电压表的示数随物体加速度的增大而增大，但不成正比 C. 若电压表指针位于表盘左侧，则物体速度方向向右 D. 若电压表指针位于表盘左侧，则物体加速度方向向右"},{"i":590,"c":"BJ-2024-13","src":"2024 北京 · 第 13 题","m":"近代物理","k":"c-近代物理-原子物理","l":"k59","t":"t9","t2":"t9b","ty":"单选","d":3,"p":"北京","s":"产生阿秒光脉冲的研究工作获得 2023 年的诺贝尔物理学奖，阿秒（as）是时间单位，$1\\ \\mathrm{as} = 1\\times10^{-18}\\,\\mathrm{s}$，阿秒光脉冲是发光持续时间在阿秒量级的极短闪光，提供了阿秒量级的超快“光快门”，使探测原子内电子的动态过程成为可能。设有一个持续时间为 $100\\ \\mathrm{as}$ 的阿秒光脉冲，持续时间内至少包含一个完整的光波周期。取真空中光速 $c = 3.0\\times10^{8}\\,\\mathrm{m}/\\mathrm{s}$，普朗克常量 $h = 6.6\\times10^{-34}\\,\\mathrm{J}/\\mathrm{s}$，下列说法正确的是","stem":"产生阿秒光脉冲的研究工作获得 2023 年的诺贝尔物理学奖，阿秒（as）是时间单位，$1\\ \\mathrm{as} = 1\\times10^{-18}\\,\\mathrm{s}$，阿秒光脉冲是发光持续时间在阿秒量级的极短闪光，提供了阿秒量级的超快“光快门”，使探测原子内电子的动态过程成为可能。设有一个持续时间为 $100\\ \\mathrm{as}$ 的阿秒光脉冲，持续时间内至少包含一个完整的光波周期。取真空中光速 $c = 3.0\\times10^{8}\\,\\mathrm{m}/\\mathrm{s}$，普朗克常量 $h = 6.6\\times10^{-34}\\,\\mathrm{J}/\\mathrm{s}$，下列说法正确的是","opt":"A. 对于 $0.1\\,\\mathrm{mm}$ 宽的单缝，此阿秒光脉冲比波长为 $550\\,\\mathrm{nm}$ 的可见光的衍射现象更明显 B. 此阿秒光脉冲和波长为 $550\\,\\mathrm{nm}$ 的可见光束总能量相等时，阿秒光脉冲的光子数更多 C. 此阿秒光脉冲可以使能量为 $-13.6\\,\\mathrm{eV}$（$-2.2\\times10^{-18}\\,\\mathrm{J}$）的基态氢原子电离 D. 为了探测原子内电子的动态过程，阿秒光脉冲的持续时间应大于电子的运动周期"},{"i":591,"c":"BJ-2024-14","src":"2024 北京 · 第 14 题","m":"力学","k":"c-力学-牛顿运动定律","l":"kx5","t":"t9","t2":"t9b","ty":"单选","d":3,"p":"北京","s":"电荷量 $Q$、电压 $U$、电流 $I$ 和磁通量 $\\Phi$ 是电磁学中重要的物理量，其中特定的两个物理量之比可用来描述电容器、电阻、电感三种电磁学元件的属性，如图所示。类似地，上世纪七十年代有科学家预言 $\\Phi$ 和 $Q$ 之比可能也是一种电磁学元件的属性，并将此元件命名为“忆阻器”，近年来实验室已研制出了多种类型的“忆阻器”。由于“忆阻器”对电阻的记忆特性，其在信息存储、人工智能等领域具有广阔的应用前景。下列说法错误的是 ⟨图⟩","stem":"电荷量 $Q$、电压 $U$、电流 $I$ 和磁通量 $\\Phi$ 是电磁学中重要的物理量，其中特定的两个物理量之比可用来描述电容器、电阻、电感三种电磁学元件的属性，如图所示。类似地，上世纪七十年代有科学家预言 $\\Phi$ 和 $Q$ 之比可能也是 }$，月球半径约为地球半径的 $\\frac{1}{4}$。关于返回舱在该绕月轨道上的运动，下列说法正确的是","opt":"A. 其相对于月球的速度大于地球第一宇宙速度 B. 其相对于月球的速度小于地球第一宇宙速度 C. 其绕月飞行周期约为地球上近地圆轨道卫星周期的 $\\sqrt{\\frac{2}{3}}$ 倍 D. 其绕月飞行周期约为地球上近地圆轨道卫星周期的 $\\sqrt{\\frac{3}{2}}$ 倍"},{"i":753,"c":"HU-2024-08","src":"2024 湖南 · 第 8 题","m":"电磁学","k":"c-电磁学-电磁感应","l":"k40","t":"t2","t2":"t2c","ty":"多选","d":4,"p":"湖南","s":"某电磁缓冲装置如图所示，两足够长的平行金属导轨置于同一水平面内，导轨左端与一阻值为 $R$ 的定值电阻相连，导轨 $BC$ 段与 $B_{1}C_{1}$ 段粗糙，其余部分光滑，$AA_{1}$ 右侧处于竖直向下的匀强磁场中，一质量为 $m$ 的金属杆垂直导轨放置。现让金属杆以初速度 $v_{0}$ 沿导轨向右经过 $AA_{1}$ 进入磁场，最终恰好停在 $CC_{1}$ 处。已知金属杆接入导轨之间的阻值为 $R$，与粗糙导轨间的摩擦因数为 $\\mu$，$AB = BC = d$。导轨电阻不计，重力加速度为 $g$，下列说法正确的是 ⟨图⟩","stem":"某电磁缓冲装置如图所示，两足够长的平行金属导轨置于同一水平面内，导轨左端与一阻值为 $R$ 的定值电阻相连，导轨 $BC$ 段与 $B_{1}C_{1}$ 段粗糙，其余部分光滑，$AA_{1}$ 右侧处于竖直向下的匀强磁场中，一质量为 $m$ 的金属杆垂直导轨放置。现让金属杆以初速度 $v_{0}$ 沿导轨向右经过 $AA_{1}$ 进入磁场，最终恰好停在 $CC_{1}$ 处。已知金属杆接入导轨之间的阻值为 $R$，与粗糙导轨间的摩擦因数为 $\\mu$，$AB = BC = d$。导轨电阻不计，重力加速度为 $g$，下列说法正确的是 ⟨图⟩","opt":"A. 金属杆经过 $BB_{1}$ 的速度为 $\\frac{v_{0}}{2}$ B. 在整个过程中，定值电阻 $R$ 产生的热量为 $\\frac{1}{2}mv_{0}^{2} - \\frac{1}{2}\\mu mgd$ C. 金属杆经过 $AA_{1}B_{1}B$ 与 $BB_{1}C_{1}C$ 区域，金属杆所受安培力的冲量相同 D. 若将金属杆的初速度加倍，则金属杆在磁场中运动的距离大于原来的 2 倍"},{"i":754,"c":"HU-2024-09","src":"2024 湖南 · 第 9 题","m":"光学","k":"c-光学-波动光学","l":"k55","t":"t7","t2":"t7c","ty":"多选","d":3,"p":"湖南","s":"1834 年，洛埃利用平面镜得到杨氏双缝干涉的结果（称洛埃镜实验），平面镜沿 $OA$ 放置，靠近并垂直于光屏。某同学重复此实验时，平面镜意外倾斜了某微小角度 $\\theta$，如图所示。$S$ 为单色点光源。下列说法正确的是 ⟨图⟩","stem":"1834 年，洛埃利用平面镜得到杨氏双缝干涉的结果（称洛埃镜实验），平面镜沿 $OA$ 放置，靠近并垂直于光屏。某同学重复此实验时，平面镜意外倾斜了某微小角度 $\\theta$，如图所示。$S$ 为单色点光源。下列说法正确的是 ⟨图⟩","opt":"A. 沿 $AO$ 向左略微平移平面镜，干涉条纹不移动 B. 沿 $OA$ 向右略微平移平面镜，干涉条纹间距减小 C. 若 $\\theta = 0^\\circ$，沿 $OA$ 向右略微平移平面镜，干涉条纹间距不变 D. 若 $\\theta = 0^\\circ$，沿 $AO$ 向左略微平移平面镜，干涉条纹向 $A$ 处移动"},{"i":755,"c":"HU-2024-10","src":"2024 湖南 · 第 10 题","m":"力学","k":"c-力学-直线运动","l":"k4","t":"t2","t2":"t2d","ty":"多选","d":4,"p":"湖南","s":"如图，光滑水平面内建立直角坐标系 $xOy$。$A$、$B$ 两小球同时从 $O$ 点出发，$A$ 球速度大小为 $v_{1}$，方向沿 $x$ 轴正方向，$B$ 球速度大小为 $v_{2} = 2 \\,\\mathrm{m}/\\mathrm{s}$、方向与 $x$ 轴正方向夹角为 $\\theta$。坐标系第一象限中有一个挡板 $L$，与 左”或“右”）； （5）若电压表是非理想电压表，则金属丝电阻的测量值＿＿＿＿＿＿真实值（填“大于”“小于”或“等于”）。 ⟨图⟩⟨图⟩⟨图⟩⟨图⟩","opt":""},{"i":757,"c":"HU-2024-12","src":"2024 湖南 · 第 12 题","m":"实验","k":"c-实验-力学实验","l":"k66","t":"t8","t2":"t8c","ty":"实验","d":3,"p":"湖南","s":"在太空，物体完全失重，用天平无法测量质量。如图(a)，某同学设计了一个动力学方法测量物体质量的实验方案，主要实验仪器包括：气垫导轨、滑块、轻弹簧、标准砝码、光电计时器和待测物体，主要步骤如下： （1）调平气垫导轨，将弹簧左端连接气垫导轨左端，右端连接滑块； （2）将滑块拉至离平衡位置 $20 \\,\\mathrm{cm}$ 处由静止释放，滑块第 1 次经过平衡位置处开始计时，第 21 次经过平衡位置时停止计时，由此测得弹簧振子的振动周期 $T$； （3）将质量为 $m$ 的砝码固定在滑块上，重复步骤（2）； （4）依次增加砝码质量 $m$，测出对应的周期 $T$，实验数据如下表所示，在图中绘制 $T^{2} - m$ 关系图线＿＿＿＿＿＿； $m/\\,\\mathrm{kg}$ ｜ $T/\\,\\mathrm{s}$ ｜ $T^{2}/\\,\\mathrm{s}^2$ 0.000 ｜ 0.632 ｜ 0.399 0.050 ｜ 0.775 ｜ 0.601 0.100 ｜ 0.893 ｜ 0.797 0.150 ｜ 1.001 ｜ 1.002 0.200 ｜ 1.105 ｜ 1.221 0.250 ｜ 1.175 ｜ 1.381 （5）由 $T^{2} - m$ 图像可知，弹簧振子振动周期的平方与砝码质量的关系是＿＿＿＿＿＿（填“线性的”或“非线性的”）； （6）取下砝码后，将待测物体固定在滑块上，测量周期并得到 $T^{2} = 0.880 \\,\\mathrm{s}^2$，则待测物体质量是＿＿＿＿＿＿ $\\,\\mathrm{kg}$（保留 3 位有效数字）； （7）若换一个质量较小的滑块重做上述实验，所得 $T^{2} - m$ 图线与原图线相比将沿纵轴＿＿＿＿＿＿移动（填“正方向”“负方向”或“不”）。 ⟨图⟩⟨图⟩","stem":"在太空，物体完全失重，用天平无法测量质量。如图(a)，某同学设计了一个动力学方法测量物体质量的实验方案，主要实验仪器包括：气垫导轨、滑块、轻弹簧、标准砝码、光电计时器和待测物体，主要步骤如下： （1）调平气垫导轨，将弹簧左端连接气垫导轨左端，右端连接滑块； （2）将滑块拉至离平衡位置 $20 \\,\\mathrm{cm}$ 处由静止释放，滑块第 1 次经过平衡位置处开始计时，第 21 次经过平衡位置时停止计时，由此测得弹簧振子的振动周期 $T$； （3）将质量为 $m$ 的砝码固定在滑块上，重复步骤（2）； （4）依次增加砝码质量 $m$，测出对应的周期 $T$，实验数据如下表所示，在图中绘制 $T^{2} - m$ 关系图线＿＿＿＿＿＿； $m/\\,\\mathrm{kg}$ ｜ $T/\\,\\mathrm{s}$ ｜ $T^{2}/\\,\\mathrm{s}^2$ 0.000 ｜ 0.632 ｜ 0.399 0.050 ｜ 0.775 ｜ 0.601 0.100 ｜ 0.893 ｜ 0.797 0.150 ｜ 1.001 ｜ 1.002 0.200 ｜ 1.105 ｜ 1.221 0.250 ｜ 1.175 ｜ 1.381 （5）由 $T^{2} - m$ 图像可知，弹簧振子振动周期的平方与砝码质量的关系是＿＿＿＿＿＿（填“线性的”或“非线性的”）； （6）取下砝码后，将待测物体固定在滑块上，测量周期并得到 $T^{2} = 0.880 \\,\\mathrm{s}^2$，则待测物体质量是＿＿＿＿＿＿ $\\,\\mathrm{kg}$（保留 3 位有效数字）； （7）若换一个质量较小的滑块重做上述实验，所得 $T^{2} - m$ 图线与原图线相比将沿纵轴＿＿＿＿＿＿移动（填“正方向”“负方向”或“不”）。 ⟨图⟩⟨图⟩","opt":""},{"i":758,"c":"HU-2024-13","src":"2024 湖南 · 第 13 题","m":"热学","k":"c-热学-理想气体","l":"k49","t":"t8","t2":"t8a","ty":"计算","d":2,"p":"湖南","s":"一个充有空气的薄壁气球，气球内气体压强为 $p$、体积为 $V$。气球内空气可视为理想气体。 （1）若将气球内气体等温膨胀 ","t2":"t9a","ty":"实验","d":3,"p":"贵州","s":"某实验小组根据热敏电阻的阻值随温度变化的规律，探测温度控制室内的温度。选用的器材有： 热敏电阻 $R_{1}$； 电流表 G（内阻 $R_{g}$ 为 $240 \\,\\Omega$，满偏电流为 $I_{g}$）； 定值电阻 $R$（阻值为 $48 \\,\\Omega$）； 电阻箱 $R_{0}$（阻值 $0 \\sim 999.9 \\,\\Omega$）； 电源 $E$（电动势恒定，内阻不计）； 单刀双掷开关 $S_{1}$、单刀单掷开关 $S_{2}$；导线若干。 请完成下列步骤： （1）该小组设计了如图（a）所示的电路图。根据图（a），在答题卡上完成图（b）中的实物图连线。 （2）开关 $S_{1}$、$S_{2}$ 断开，将电阻箱的阻值调到＿＿＿＿＿＿（填“最大”或“最小”）。开关 $S_{1}$ 接 1，调节电阻箱，当电阻箱读数为 $60.0 \\,\\Omega$ 时，电流表示数为 $I_{g}$。再将 $S_{1}$ 改接 2，电流表示数为 $\\frac{I_{g}}{2}$，断开 $S_{1}$。得到此时热敏电阻 $R_{1}$ 的阻值为＿＿＿＿＿＿ $\\,\\Omega$。 （3）该热敏电阻 $R_{1}$ 阻值随温度 $t$ 变化的 $R_{1} - t$ 曲线如图（c）所示，结合（2）中的结果得到温度控制室内此时的温度约为＿＿＿＿＿＿ ${}^{\\circ}\\mathrm{C}$。（结果取整数） （4）开关 $S_{1}$ 接 1，闭合 $S_{2}$，调节电阻箱，使电流表示数为 $I_{g}$。再将 $S_{1}$ 改接 2，如果电流表示数为 $\\frac{I_{g}}{k}$（$k > 1$），则此时热敏电阻 $R_{1} = $＿＿＿＿＿＿ $\\,\\Omega$（用 $k$ 表示），根据图（c）即可得到此时温度控制室内的温度。 ⟨图⟩","stem":"某实验小组根据热敏电阻的阻值随温度变化的规律，探测温度控制室内的温度。选用的器材有： 热敏电阻 $R_{1}$； 电流表 G（内阻 $R_{g}$ 为 $240 \\,\\Omega$，满偏电流为 $I_{g}$）； 定值电阻 $R$（阻值为 $48 \\,\\Omega$）； 电阻箱 $R_{0}$（阻值 $0 \\sim 999.9 \\,\\Omega$）； 电源 $E$（电动势恒定，内阻不计）； 单刀双掷开关 $S_{1}$、单刀单掷开关 $S_{2}$；导线若干。 请完成下列步骤： （1）该小组设计了如图（a）所示的电路图。根据图（a），在答题卡上完成图（b）中的实物图连线。 （2）开关 $S_{1}$、$S_{2}$ 断开，将电阻箱的阻值调到＿＿＿＿＿＿（填“最大”或“最小”）。开关 $S_{1}$ 接 1，调节电阻箱，当电阻箱读数为 $60.0 \\,\\Omega$ 时，电流表示数为 $I_{g}$。再将 $S_{1}$ 改接 2，电流表示数为 $\\frac{I_{g}}{2}$，断开 $S_{1}$。得到此时热敏电阻 $R_{1}$ 的阻值为＿＿＿＿＿＿ $\\,\\Omega$。 （3）该热敏电阻 $R_{1}$ 阻值随温度 $t$ 变化的 $R_{1} - t$ 曲线如图（c）所示，结合（2）中的结果得到温度控制室内此时的温度约为＿＿＿＿＿＿ ${}^{\\circ}\\mathrm{C}$。（结果取整数） （4）开关 $S_{1}$ 接 1，闭合 $S_{2}$，调节电阻箱，使电流表示数为 $I_{g}$。再将 $S_{1}$ 改接 2，如果电流表示数为 $\\frac{I_{g}}{k}$（$k > 1$），则此时热敏电阻 $R_{1} = $＿＿＿＿＿＿ $\\,\\Omega$（用 $k$ 表示），根据图（c）即可得到此时温度控制室内的温度。 ⟨图⟩","opt":""},{"i":804,"c":"GZ-2024-13","src":"2024 贵州 · 第 13 题","m":"热学","k":"c-热学-理想气体","l":"k50","t":"t5","t2":"t5a","ty":"计算","d":3,"p":"贵州","s":"制作水火箭是青少年科技活动的常见项目之一。某研究小组为了探究水火箭在充气与喷水过程中气体的热学规律，把水火箭的塑料容器竖直固定，其中 A、C 分别是塑料容器的充气口、喷水口，B 是气压计，如图（a）所示。在室温环境下，容器内装入一定质量的水，此时容器内的气体体积为 $V_{0}$，压强为 $p_{0}$，现缓慢充气后压强变为 $4p_{0}$，不计容器的容积变化。求： （1）设充气过程中气体温度不变，求充入的气体在该室温环境下压强为 $p_{0}$ 时的体积。 （2）打开喷水口阀门，喷出一部分水后关闭阀门，容器内气体从状态 M 变化到状态 N，其压强 $p$ 与体积 $V$ 的变化关系如图（b）中实线所示，已知气体在状态 N 时的体积为 $V_{1}$，压强为 $p_{1}$。求气体在状态 N 与状态 M 时的热力学温度之比。 （3）图（b）中虚线 $MN'$ 是容器内气体在绝热（既不吸热也不放热）条件下压强 $p$ 与体积 $V$ 的变化关系图线，试判断气体在图（b）中沿实线从 M 到 N 的过程是吸热还是放热。（不需要说明理由） ⟨图⟩","stem":"制作水火箭是青少年科技活动的常见项目之一。某研究小组为了探究水火箭在充气与喷水过程中气体的热学规律，把水火箭的塑料容器竖直固定，其中 A、C 分别是塑料容器的充气口、喷水口，B 是气压计，如图（a）所示。在室温环境下，容器内装入一定质量的水，此时容器内的气体体积为 $V_{0}$，压强为 $p_{0}$，现缓慢充气后压强变为 $4p_{0}$，不计容器的容积变化。求： （1）设充气过程中气体温度不变，求充入的气体在该室温环境下压强为 $p_{0}$ 时的体积。 （2）打开喷水口阀门，喷出一部分水后关闭阀门，容器内气体从状态 M 变化到状态 N，其压强 $p$ 与体积 $V$ 的变化关系如图（b）中实线所示，已知气体在状态 N 时的体积为 $V_{1}$，压强为 $p_{1}$。求气体在状态 N 与状态 M 时的热力学温度之比。 （3）图（b）中虚线 $MN'$ 是容器内气体在绝热（既不吸热也不放热）条件下压强 $p$ 与体积 $V$ 的变化关系图线，试判断气体在图（b）中沿实线从 M 到 N 的过程是吸热还是放热。（不需要说明理由） ⟨图⟩","opt":""},{"i":805,"c":"GZ-2024-14","src":"2024 贵州 · 第 14 题","m":"电磁学","k":"c-电磁学-磁场","l":"k35","t":"t5","t2":"t5b","ty":"计算","d":3,"p":"贵州","s":"如图，边长为 $L$ 的正方形 abcd 区域及矩形 cdef 区域内均存在电场强度大小为 $E$、方向竖直向下且与 ab 边平行的匀强电场，ef 右边有一半径为 $\\frac{\\sqrt{3}}{3}L$ 且与 ef 相切的圆形区域，切点为 ef 的中点，该圆形区域与 cdef 区域内均存在磁感应强度大小为 $B$、方向垂直纸面向里的匀强磁场。一带电粒子从 b 点斜向上射入电场后沿图中曲线运动，经 cd 边的中点进入 cdef 区域，并沿直线通过该区域后进入圆形区域。所有区域均在纸面内，粒子始终在该纸面内运动，不计粒子重力。求： （1）粒子沿直线通过 cdef 区域时的速度大小； （2）粒子的电荷量与质量之比； （3）粒子射出圆形区域时速度方向与进入圆形区域时速度方向的夹角。 ⟨图⟩","stem":"如图，边长为 $L$ 的正方形 abcd 区域及矩形 cdef 区域内均存在电场强度大小为 $E$、方向竖直向下且与 ab 边平行的匀强电场，ef 右边有一半径为 $\\frac{\\sqrt{3}}{3}L$ 且与 ef 相切的圆形区域，切点为 ef 的中点，该圆形区域与 cdef 区域内均存在磁感应强度大小为 $B$、方向垂直纸面向里的匀强磁场。一带电粒子从 b 点斜向上射入电场后沿图中曲线运动，经 cd 边的中点进入 cdef 区域，并沿直线通过该区域后进入圆形区域。所有区域均在纸面内，粒子始终在该纸面内运动，不计粒子重力。求： （1）粒子沿直线通过 cdef 区域时的速度大小； （2）粒子的电荷量与质量之比； （3）粒子射出圆形区域时速度方向与进入圆形区域时速度方向的夹角。 ⟨图⟩","opt":""},{"i":806,"c":"GZ-2024-15","src":"2024 贵州 · 第 15 题","m":"力学","k":"c-力学-牛顿运动定律","l":"k5","t":"t2","t2":"t2d","ty":"计算","d":4,"p":"贵州","s":"如图，半径为 $R = 1.8 \\,\\mathrm{m}$ 的四分之一光滑圆轨道固定在竖直平面内，其末端与水平地面 PM 相切于 P 点，PM 的长度 $d = 2.7 \\,\\mathrm{m}$。一长为 $L = 3.3 \\,\\mathrm{m}$ 的水平传送带以恒定速率 $v_{0} = 1 \\,\\mathrm{m}/\\mathrm{s}$ 逆时针转动，其右端与地面在 M 点无缝对接。物块 a 从圆轨道顶端由静止释放，
