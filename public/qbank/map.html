<style>
/* ===== 设计 token：与 public/index.html（origin/main）同源 ===== */
:root{
  --font-sans: "Nunito","Noto Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono: "JetBrains Mono","Cascadia Mono",Consolas,"SFMono-Regular",monospace;

  /* —— 中性色：白为主 —— */
  --paper:#F7F8FA;
  --surface:#FFFFFF;
  --surface-2:#F4F5F7;
  --surface-3:#E9EBEF;
  --line:#E6E8EC;
  --line-strong:#D3D6DC;

  /* —— 文字：正文固定 #1A1A1A，全站禁用纯黑 —— */
  --ink:#1A1A1A;
  --ink-2:#4A4A4A;
  --ink-3:#6E6E6E;
  --ink-4:#9A9A9A;   /* 只用于占位图形/描边，不承担文字 */

  /* —— 主色：全站唯一强调色（HSL 243,54%,53%） —— */
  --brand:#4F46C8;
  --brand-strong:#3D3599;
  --brand-tint:#EEEDFB;
  --brand-line:#D5D2F2;
  --brand-ink:#403AB0;

  /* —— 辅助语义色：只用于状态，不作大面积主色 —— */
  --mint:#1F7A5F;   --mint-tint:#EAF4F0;  --mint-line:#C9E2D9;
  --amber:#8A6A2A;  --amber-tint:#FBF3E4; --amber-line:#EBD9B8;
  --coral:#B23B3B;  --coral-tint:#FBEDED; --coral-line:#EDC9C9;

  --shadow-1:0 1px 2px rgba(26,26,26,.04), 0 8px 24px rgba(26,26,26,.05);
  --shadow-2:0 16px 40px rgba(26,26,26,.10);

  /* —— 圆角三级：外 = 内 + 内边距，同心 —— */
  --r-card:24px;
  --r-sub:16px;
  --r-inner:8px;
  --r-pill:999px;
  --r-circle:50%;
  --r-sm:8px; --r-md:8px; --r-lg:24px; --r-xl:24px;  /* 兼容别名 */

  /* —— 字号四档 + 行高（对齐 LeetCode：正文 14/21、标签 12、小节 16、大标题 20）
        这一组是「中」档，也就是改造前的原样；小/大两档在下面 html[data-ux] 里整组覆盖 —— */
  --fs-meta:11px;
  --fs-body:13px;  --lh-body:1.45;
  --fs-lead:13px;
  --fs-sub:15px;   --lh-sub:1.35;
  --fs-title:18px; --lh-title:1.25;

  /* —— 盒子尺寸：只收「包着文字的固定盒子」。间距与圆角不跟档位走 ——
        撑开版面靠盒子高度；留白跟着放大会让大档又大又稀，反而更难读 */
  --topbar:52px;
  --topbar-sm:46px;
  --ctl:32px;
  --input-h:48px;
  --ico:30px;
  --ico-lg:40px;
  --ico-sm:24px;
  --av:32px;
  --av-img:26px;
  --pane-head:44px;
}
html[data-theme="dark"]{
  --paper:#121216;
  --surface:#1A1A1F;
  --surface-2:#232329;
  --surface-3:#2C2C34;
  --line:#33333B;
  --line-strong:#45454F;

  --ink:#F2F2F5;
  --ink-2:#B4B4BE;
  --ink-3:#8C8C99;
  --ink-4:#66666F;

  --brand:#837DDD;
  --brand-strong:#9A95E8;
  --brand-tint:#252347;
  --brand-line:#3B3868;
  --brand-ink:#A29DE8;

  --mint:#5FC0A2;   --mint-tint:#14261F;  --mint-line:#265042;
  --amber:#D9A85A;  --amber-tint:#2A2314; --amber-line:#4A3B1B;
  --coral:#E07A7A;  --coral-tint:#2E1C1C; --coral-line:#553030;

  --shadow-1:0 1px 2px rgba(0,0,0,.40), 0 8px 24px rgba(0,0,0,.32);
  --shadow-2:0 16px 40px rgba(0,0,0,.50);
}

/* ===== 原型组件 ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:var(--fs-body)/var(--lh-body) var(--font-sans);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

.top{
  height:var(--topbar);display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:24px;height:24px;border-radius:6px;display:block}
.brand strong{font-size:var(--fs-sub);font-weight:600;white-space:nowrap}
.brand em{font-style:normal;font-size:var(--fs-meta);color:var(--ink-3);white-space:nowrap}

.seg{display:flex;gap:2px;padding:2px;background:var(--surface-2);border-radius:var(--r-pill)}
.seg button{
  height:28px;padding:0 15px;border:0;background:transparent;border-radius:var(--r-pill);
  font-size:var(--fs-lead);color:var(--ink-3);cursor:pointer;transition:background .18s,color .18s,box-shadow .18s;
}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-1)}
.seg button:not([aria-selected="true"]):hover{color:var(--ink-2)}

.tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.tool{
  height:28px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-inner);
  background:var(--surface);color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;
  transition:color .18s,border-color .18s,background .18s;
}
.tool:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.tool.icon{width:30px;padding:0;font-size:14px;line-height:1}
button:focus-visible,.qcard:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
.modal:focus{outline:none}

main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - var(--topbar))}
.canvas{
  position:relative;margin:14px 0 14px 14px;border:1px solid var(--line);
  border-radius:var(--r-sub);background:var(--paper);overflow:hidden;
}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#svg.dragging{cursor:grabbing}
.hint{
  position:absolute;left:16px;bottom:13px;margin:0;
  font-size:var(--fs-meta);color:var(--ink-3);pointer-events:none;
}

/* 节点：每个字都住在一个细边气泡里 */
.node{cursor:pointer;outline:none}
.node .chip{
  fill:var(--surface);
  stroke:color-mix(in srgb,var(--brand) 22%,transparent);
  stroke-width:1;
  transition:stroke .16s ease,fill .16s ease;
}
.node:hover .chip{stroke:color-mix(in srgb,var(--brand) 58%,transparent)}
.node text{
  font-family:var(--font-sans);font-size:12.5px;fill:var(--ink-2);
  dominant-baseline:central;pointer-events:none;
}
.node.mod text,.node.chap text,.node.cat text{font-size:13px;fill:var(--ink);font-weight:500}
.node.leaf text,.node.sub text{font-size:12px;fill:var(--ink-3)}

/* —— 颜色分层：越靠近核心，色越实 —— */
.node.d1 .chip{
  fill:var(--brand-tint);
  stroke:var(--brand-line);
}
.node.d1 text{fill:var(--brand-ink);font-weight:600}
.node.d2 .chip{
  fill:var(--surface);
  stroke:color-mix(in srgb,var(--brand) 26%,transparent);
  stroke-width:1.1;
}
.node.d3 .chip{
  fill:transparent;
  stroke:color-mix(in srgb,var(--brand) 15%,transparent);
}
.node.d3 text{fill:var(--ink-2)}
.node.hover .chip{}

/* 核心：实心 + 底盘 + 更大字 */
.hub-disc{
  fill:color-mix(in srgb,var(--brand) 9%,transparent);
}
.node.root .chip{fill:var(--brand);stroke:var(--brand)}
.node.root text{fill:#fff;font-size:14.5px;font-weight:600;letter-spacing:.01em}
.node.root:hover .chip{fill:var(--brand-strong)}
.node.is-sel .chip{fill:var(--brand-tint);stroke:var(--brand)}
.node.is-sel text{fill:var(--brand-ink);font-weight:600}
.node.root.is-sel .chip{fill:var(--brand-strong)}
.node.root.is-sel text{fill:#fff}
.node:focus-visible .chip{stroke:var(--brand);stroke-width:2}
.chev{fill:var(--ink-4);font-size:11px;dominant-baseline:central;pointer-events:none}
.node:hover .chev{fill:var(--brand)}

.node{transition:opacity .22s ease}
.node.dim{opacity:.26}
.node.born{opacity:0}
.link{fill:none;stroke:var(--line-strong);stroke-width:1.05;stroke-linecap:round}
.link[data-d="1"]{stroke-width:1.9;stroke:color-mix(in srgb,var(--brand) 34%,var(--line-strong))}
.link[data-d="2"]{stroke-width:1.45;stroke:color-mix(in srgb,var(--brand) 16%,var(--line-strong))}
.link[data-d="3"]{stroke-width:1.05;stroke:color-mix(in srgb,var(--line-strong) 82%,transparent)}
.link.band{
  stroke:none;
  fill:color-mix(in srgb,var(--brand) 20%,transparent);
}
.link.band[data-d="2"]{fill:color-mix(in srgb,var(--brand) 17%,transparent)}
.link.band[data-d="3"]{fill:color-mix(in srgb,var(--brand) 12%,transparent)}
.link.band.dim{stroke:none}
.link{transition:opacity .22s ease,stroke .2s ease}
.link.dim{opacity:.22}
.spine{fill:none;stroke:color-mix(in srgb,var(--brand) 16%,var(--line-strong));stroke-width:1}

/* 右侧题库 */
.panel{
  display:flex;flex-direction:column;min-height:0;margin:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sub);
}
.panel-head{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px 11px;border-bottom:1px solid var(--line);
}
.crumb{display:flex;align-items:baseline;gap:7px;min-width:0;flex:1}
.crumb b{font-size:var(--fs-sub);font-weight:600;flex:none}
.crumb span{
  font-size:var(--fs-meta);color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.crumb span[hidden]{display:none}
#all{flex:none;height:24px;padding:0 9px;border-radius:var(--r-inner);font-size:var(--fs-meta)}
#all[hidden]{display:none}
.qlist{flex:1;min-height:0;overflow:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}

.qcard{
  border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
  border-radius:10px;padding:9px 11px;background:var(--surface);cursor:pointer;
  transition:border-color .16s,background .16s;
}
.qcard:hover{border-color:color-mix(in srgb,var(--brand) 60%,transparent)}
.qcard.on{border-color:var(--brand);background:var(--brand-tint)}
.qcard .meta{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.qcard .meta span{
  font-size:var(--fs-meta);line-height:1;padding:3px 7px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--brand) 10%,transparent);
  color:var(--brand-ink);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.qcard .meta span:first-child{font-weight:600}
.qcard.on .meta span{background:color-mix(in srgb,var(--brand) 18%,transparent)}
.qcard p{
  margin:0;font-size:var(--fs-body);line-height:1.5;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.qcard.in{animation:cardin .26s cubic-bezier(.2,.8,.2,1) both}
.empty{margin:28px 6px;text-align:center;font-size:var(--fs-body);color:var(--ink-3)}


/* 题库分组头 */
.grp-h{
  display:flex;align-items:center;gap:9px;margin:14px 2px 2px;
  font-size:var(--fs-meta);font-weight:600;color:var(--ink-2);
}
.grp-h:first-child{margin-top:2px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grp-s{
  margin:9px 2px 1px;font-size:var(--fs-meta);color:var(--ink-3);
}
.grp-s + .qcard{margin-top:6px}

/* 弹窗 */
.scrim{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(18,18,24,.30);animation:fadein .18s ease;
}
.scrim[hidden]{display:none}
.modal{
  width:min(620px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;
  background:var(--surface);border-radius:var(--r-sub);
  box-shadow:0 20px 60px rgba(0,0,0,.22);animation:popin .22s cubic-bezier(.2,.8,.2,1);
}
.modal-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:var(--fs-sub);font-weight:600}
.modal-head p{margin:3px 0 0;font-size:var(--fs-meta);color:var(--ink-3)}
.grow{flex:1;min-width:0}
.ghost{
  height:28px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-inner);
  background:var(--surface);color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;
  transition:color .16s,border-color .16s,background .16s;flex:none;
}
.ghost:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.modal-body{overflow:auto;padding:12px 16px 14px}
.qlist-modal{display:flex;flex-direction:column;gap:8px}
.modal-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.primary{
  height:34px;padding:0 16px;border:0;border-radius:var(--r-inner);
  background:var(--brand);color:#fff;font-size:var(--fs-body);font-weight:500;cursor:pointer;
  transition:background .16s;
}
.primary:hover{background:var(--brand-strong)}
/* 公式与图形按原图渲染 */
.qstem img.qf{display:inline-block;vertical-align:-0.22em;margin:0 1px;max-width:100%;height:auto}
.qstem img.qfig{display:block;margin:10px auto;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.qopts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.qdetail .tags{margin-top:16px}
.qopts li{display:flex;gap:9px;align-items:center;font-size:var(--fs-body);line-height:1.55;color:var(--ink-2)}
.qopts li b{flex:none;width:18px;height:18px;border-radius:50%;background:var(--brand-tint);color:var(--brand-ink);
  font-size:var(--fs-meta);font-weight:600;display:flex;align-items:center;justify-content:center}
.qopts img.qf{vertical-align:-0.2em;margin:0 1px;max-width:100%}
.qopts img.qfig{max-width:100%;border-radius:6px;margin:4px 0}
.qloading{color:var(--ink-3);font-size:var(--fs-body)}
.qdetail .stem{font-size:13.5px;line-height:1.72;color:var(--ink);margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{
  font-size:var(--fs-meta);line-height:1;color:var(--brand-ink);
  background:color-mix(in srgb,var(--brand) 10%,transparent);
  border-radius:var(--r-pill);padding:4px 9px;
}
html[data-theme="dark"] .qcard .meta span,
html[data-theme="dark"] .tags span{background:color-mix(in srgb,var(--brand) 20%,transparent)}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

html[data-theme="dark"] .node .chip{stroke:color-mix(in srgb,var(--brand) 34%,transparent)}
html[data-theme="dark"] .node.d1 .chip{fill:color-mix(in srgb,var(--brand) 18%,var(--surface));stroke:color-mix(in srgb,var(--brand) 42%,transparent)}
html[data-theme="dark"] .node.d1 text{fill:var(--ink)}
html[data-theme="dark"] .hub-disc{fill:color-mix(in srgb,var(--brand) 14%,transparent)}
html[data-theme="dark"] .link[data-d="1"]{stroke:color-mix(in srgb,var(--brand) 44%,#2A2A2A)}
html[data-theme="dark"] .link[data-d="2"]{stroke:color-mix(in srgb,var(--brand) 24%,#2A2A2A)}
html[data-theme="dark"] .link.band{fill:color-mix(in srgb,var(--brand) 30%,#141418)}
html[data-theme="dark"] .link.band[data-d="2"]{fill:color-mix(in srgb,var(--brand) 22%,#141418)}
html[data-theme="dark"] .link.band[data-d="3"]{fill:color-mix(in srgb,var(--brand) 16%,#141418)}
html[data-theme="dark"] .node:hover .chip{stroke:color-mix(in srgb,var(--brand) 72%,transparent)}
html[data-theme="dark"] .qcard{border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
html[data-theme="dark"] .qcard:hover{border-color:color-mix(in srgb,var(--brand) 68%,transparent)}
html[data-theme="dark"] .modal{box-shadow:0 24px 70px rgba(0,0,0,.55)}
html[data-theme="dark"] .scrim{background:rgba(6,6,10,.55)}

@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 38vh;height:auto;min-height:calc(100vh - var(--topbar))}
  .canvas{margin:12px 12px 0}
  .panel{margin:12px;min-height:0}
  .brand em{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ===== 首页 → 题库：滚动淡入（仿 deepseek 首页节奏） ===== */
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.sheet{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scrollbar-width:none}
.sheet::-webkit-scrollbar{width:0;height:0}

.hero{
  min-height:calc(100dvh - var(--topbar));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px 96px;position:relative;
}
.hero-in{width:min(680px,100%);will-change:opacity,transform}
.hero-in{text-align:center}
.hero h1{
  margin:0;font-size:clamp(27px,3.5vw,35px);line-height:1.26;font-weight:600;
  letter-spacing:-.012em;color:var(--ink);
}
.hero .lede{margin:12px 0 0;font-size:var(--fs-lead);color:var(--ink-3)}
.composer{
  margin-top:28px;padding:14px 14px 10px;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.composer:focus-within{border-color:color-mix(in srgb,var(--brand) 42%,transparent)}
.composer textarea{
  width:100%;min-height:54px;border:0;outline:none;resize:none;background:transparent;
  font-family:inherit;font-size:var(--fs-lead);line-height:1.62;color:var(--ink);
}
.composer textarea::placeholder{color:var(--ink-3)}
.composer-bar{display:flex;align-items:center;gap:10px;margin-top:4px}
.hint-mini{font-size:var(--fs-meta);color:var(--ink-3)}
.send{
  margin-left:auto;height:32px;padding:0 18px;border:0;border-radius:var(--r-pill);
  background:var(--brand);color:#fff;font-size:var(--fs-lead);cursor:pointer;
  transition:background .18s ease;
}
.send:hover{background:var(--brand-strong)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.chips button{
  height:30px;padding:0 13px;border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer;
  transition:color .18s ease,border-color .18s ease;
}
.chips button:hover{color:var(--ink);border-color:var(--line-strong)}

.goodbar{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  width:min(680px,calc(100% - 40px));display:flex;align-items:center;gap:12px;
  padding:13px 16px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
  border-radius:var(--r-pill);
  transition:border-color .2s ease,transform .2s ease;
}
.goodbar:hover{border-color:color-mix(in srgb,var(--brand) 55%,transparent);transform:translateX(-50%) translateY(-1px)}
.gb-ico{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--brand-tint);color:var(--brand-ink);font-size:12px;
}
.gb-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.gb-txt b{font-size:var(--fs-lead);font-weight:600;color:var(--ink)}
.gb-txt em{font-style:normal;font-size:var(--fs-meta);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-go{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--ink-3)}
.gb-go i{font-style:normal;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

.mapzone{min-height:calc(100dvh - var(--topbar))}
.mapzone main{height:calc(100dvh - var(--topbar))}
html.is-embed .mapzone main{height:100dvh}

body[data-page="home"] .top{border-bottom-color:transparent;background:color-mix(in srgb,var(--paper) 92%,transparent)}
body[data-page="home"] .seg,body[data-page="home"] .tools{opacity:0;pointer-events:none}
body[data-page="bank"] .seg,body[data-page="bank"] .tools{opacity:1}
body[data-page="bank"] .home-only{opacity:0;pointer-events:none}
.home-only{margin-left:auto;opacity:1}
.tools{margin-left:0}
.seg,.tools{transition:opacity .22s ease}

/* ===== 第三页：做题（唯一显示题号与总数的页面） ===== */
.practice{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--paper);animation:prIn .3s cubic-bezier(.2,.8,.2,1) both}
.practice[hidden]{display:none}
.practice:focus{outline:none}
@keyframes prIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pr-top{
  height:var(--topbar);flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.pr-count{margin-left:auto;font-size:var(--fs-meta);color:var(--ink-3);letter-spacing:.02em}
.pr-body{flex:1;overflow:auto;display:flex;justify-content:center;padding:34px 20px 70px}
.pr-card{width:min(720px,100%)}
.pr-meta{display:flex;flex-wrap:wrap;gap:6px}
.pr-meta span{
  font-size:var(--fs-meta);line-height:1;padding:4px 9px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--brand) 10%,transparent);color:var(--brand-ink);
}
.pr-stem{margin:18px 0 0;font-size:16px;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.pr-actions{display:flex;gap:10px;margin-top:26px}
@media (prefers-reduced-motion:reduce){
  .gb-go i{animation:none}
  .practice{animation:none}
}


/* 宿主内嵌：浮动的切轴与工具条 */
.is-embed .sheet{padding-top:46px}
.is-embed #navBank{display:none}
.is-embed .top{
  position:fixed;left:16px;right:16px;top:12px;z-index:30;
  height:auto;padding:0;background:transparent;border:0;backdrop-filter:none;
  display:flex;align-items:center;gap:8px;pointer-events:none;
}
.is-embed .top>*{pointer-events:auto}
.is-embed .top .brand{display:none}
.is-embed .seg{
  padding:3px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-pill);box-shadow:var(--shadow-1);
}
.is-embed .tools{margin-left:auto;gap:6px}
/* 宿主内嵌 + 窄屏：工具条压成一行，隐藏底部提示 */
@media (max-width:720px){
  .is-embed .top{left:10px;right:10px;top:8px;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .is-embed .top::-webkit-scrollbar{display:none}
  .is-embed .seg{padding:2px}
  .is-embed .seg button{height:28px;padding:0 10px;font-size:var(--fs-meta)}
  .is-embed .tools{gap:4px}
  .is-embed .tools .tool{height:28px;padding:0 9px;font-size:var(--fs-meta)}
  .is-embed .hint{display:none}
  .is-embed .sheet{padding-top:42px}
}
.is-embed .tools .tool{
  height:30px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-pill);box-shadow:var(--shadow-1);
}

<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('qdata').textContent);
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function mk(t, a) { var n = document.createElementNS(NS, t); if (a) for (var k in a) n.setAttribute(k, a[k]); return n; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dec(v) {
    return String(v == null ? '' : v)
      .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function tw(str, size) {
    var w = 0, s = String(str);
    for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 0x2e80 ? size : size * 0.56;
    return w;
  }

  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var QP = new URLSearchParams(location.search);
  var STILL = QP.has('still');

  /* ---------- 索引：节点 → 题目集合 ---------- */
  var KG_LEAF = new Map(), KG_CHAP = new Map(), KG_MOD = new Map(), TH_CAT = new Map(), TH_SUB = new Map();
  DATA.kg.forEach(function (m) {
    KG_MOD.set(m.id, m.name);
    (m.children || []).forEach(function (c) {
      KG_CHAP.set(c.id, { name: c.name, mod: m.name });
      (c.children || []).forEach(function (l) { KG_LEAF.set(l.id, { name: l.name, chap: c.name, mod: m.name }); });
    });
  });
  DATA.think.forEach(function (t) {
    TH_CAT.set(t.id, t.name);
    (t.children || []).forEach(function (s) { TH_SUB.set(s.id, { name: s.name, cat: t.name }); });
  });

  /* 思路的固定席位：按完整数据算好，展开与裁剪都不改变 */
  var TH_FLAT = [];
  DATA.think.forEach(function (t) { (t.children || []).forEach(function (s) { TH_FLAT.push(t.id + '/' + s.id); }); });
  var TH_STEP = (Math.PI * 2) / Math.max(1, TH_FLAT.length);
  var TH_ANG = new Map();
  TH_FLAT.forEach(function (key, i) { TH_ANG.set('th:' + key.split('/')[1], -Math.PI / 2 + i * TH_STEP); });
  var TH_SUB_CAT = new Map();
  DATA.think.forEach(function (t) { (t.children || []).forEach(function (s) { TH_SUB_CAT.set(s.id, t.id); }); });
  var TH_CAT_ANG = new Map();
  DATA.think.forEach(function (t) {
    var sx = 0, sy = 0, n = 0;
    (t.children || []).forEach(function (s) {
      var a = TH_ANG.get('th:' + s.id);
      if (a == null) return;
      sx += Math.cos(a); sy += Math.sin(a); n += 1;
    });
    TH_CAT_ANG.set('th:' + t.id, n ? Math.atan2(sy, sx) : -Math.PI / 2);
  });

  /* 源数据的两个标签不保证「先类后方法」，运行时归一化：方法优先，类取方法所属的类 */
  function thinkCatOf(q) {
    if (q.t2 && TH_SUB_CAT.has(q.t2)) return TH_SUB_CAT.get(q.t2);
    return TH_CAT.has(q.t) ? q.t : null;
  }
  function thinkSubOf(q) {
    if (q.t2 && TH_SUB_CAT.has(q.t2)) return q.t2;
    return TH_SUB_CAT.has(q.t) ? q.t : null;
  }
  function inThink(q, catId) { return thinkCatOf(q) === catId; }
  function inSub(q, subId) { return thinkSubOf(q) === subId; }
  function inMod(q, name) { return q.m === name || ((KG_CHAP.get(q.k) || {}).mod === name); }

  function qsOf(view, kind, id) {
    if (!id) return DATA.qs;
    if (view === 'kg') {
      if (kind === 'mod') return DATA.qs.filter(function (q) { return inMod(q, KG_MOD.get(id) || id); });
      if (kind === 'chap') return DATA.qs.filter(function (q) { return q.k === id; });
      if (kind === 'leaf') return DATA.qs.filter(function (q) { return q.l === id; });
    } else {
      if (kind === 'cat') return DATA.qs.filter(function (q) { return inThink(q, id); });
      if (kind === 'sub') return DATA.qs.filter(function (q) { return inSub(q, id); });
    }
    return DATA.qs;
  }
  function pathOf(view, kind, id) {
    if (view === 'kg') {
      if (kind === 'mod') return [KG_MOD.get(id) || id];
      if (kind === 'chap') { var c = KG_CHAP.get(id); return c ? [c.mod, c.name] : []; }
      if (kind === 'leaf') { var l = KG_LEAF.get(id); return l ? [l.mod, l.chap, l.name] : []; }
    } else {
      if (kind === 'cat') return [TH_CAT.get(id) || ''];
      if (kind === 'sub') { var s = TH_SUB.get(id); return s ? [s.cat, s.name] : []; }
    }
    return [];
  }

  /* ---------- 状态 ---------- */
  var S = {

  (QP.get('open') || '').split(',').filter(Boolean).forEach(function (id) {

  /* ---------- 树 ---------- */
  function buildTree(view) {
    if (view === 'kg') {

        id: 'kg:root', label: '物理', kind: 'root', hasKids: true,
        kids: DATA.kg.map(function (m) {
          return {
            id: 'kg:' + m.id, label: m.name, kind: 'mod', hasKids: true,
            kids: (m.children || []).map(function (c) {
              return {
                id: 'kg:' + c.id, label: c.name, kind: 'chap', hasKids: true,
                kids: (c.children || []).map(function (l) {
                  return { id: 'kg:' + l.id, label: l.name, kind: 'leaf', hasKids: false, kids: [] };
                })
              };
            })
          };
        })
      };
    }
    return {
      id: 'th:root', label: '思路', kind: 'root', hasKids: true,
      kids: DATA.think.map(function (t) {
        return {
          id: 'th:' + t.id, label: t.name, kind: 'cat', hasKids: true,
          kids: (t.children || []).map(function (s) {

  /* ---------- 知识点：横向树 ---------- */

    var X = [0, 264, 508, 736], ROW = 32, nodes = [], links = [], cur = 0;

    (function ypost(n) {
      if (!n.kids.length) { n.y = cur; cur += ROW; return; }
      n.kids.forEach(ypost);
      n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2;
    })(root);
    (function place(n) {
      n.x = X[Math.min(n.depth, X.length - 1)];
      n.align = 'center';
      if (n.kind === 'root') { n.h = 44; n.w = tw(n.label, 14.5) + 46; }
      else if (n.kind === 'leaf') { n.h = 26; n.w = tw(n.label, 12) + 28; }
      else { n.h = 30; n.w = tw(n.label, 13) + 30; }
      nodes.push(n);

  /* ---------- 思路：环 + 分支列 ---------- */
  function layoutTH(root) {
    var R1 = 272, R2 = 432, nodes = [], links = [];
    root.w = tw(root.label, 14.5) + 48; root.h = 46; root.align = 'center';
    root.x = 0; root.y = 0; root.ang = -Math.PI / 2;
    nodes.push(root);

    root.kids.forEach(function (c) {
      var mean = TH_CAT_ANG.get(c.id) || -Math.PI / 2;
      c.ang = mean;
      c.x = Math.cos(mean) * R1;
      c.y = Math.sin(mean) * R1;
      c.w = tw(c.label, 13) + 30; c.h = 30; c.align = 'center';
      nodes.push(c);
      links.push({ a: root, b: c, kind: 'rad' });

      /* 方法沿各自射线发散，不排成竖列 */
      (c.kids || []).forEach(function (s, j) {
        var a = TH_ANG.get(s.id);
        if (a == null) a = mean;
        var rr = R2 + (j % 2 ? 28 : 0);
        s.ang = a;
        s.align = Math.cos(a) >= 0 ? 'left' : 'right';
        s.w = tw(s.label, 12) + 26; s.h = 26;
        s.x = Math.cos(a) * rr;
        s.y = Math.sin(a) * rr;
        nodes.push(s);
        links.push({ a: c, b: s, kind: 'rad' });

  /* ---------- 绘制 ---------- */
  var gLink = $('#glink'), gNode = $('#gnode'), gArc = $('#garc'), cam = $('#cam'), svg = $('#svg');
  var linkEls = [];

  function chipRect(n) {

    else if (n.align === 'right') { r.x = -n.w; r.width = n.w; }

  /* 深度决定颜色层级与连线粗细：0 核心 / 1 一阶 / 2 二阶 / 3 叶 */
  function depthOf(n) {
    if (n.kind === 'root') return 0;
    if (n.kind === 'mod' || n.kind === 'cat') return 1;
    if (n.kind === 'leaf') return 3;
    return 2;
  }

  function drawNode(n) {
    var g = mk('g', {
      'class': 'node ' + n.kind + ' d' + depthOf(n) + (n.align ? ' a-' + n.align : ''),
      'data-id': n.id, tabindex: '0', role: 'button',
      'aria-label': n.label + (n.hasKids ? '，可展开' : '，查看题目')
    });
    if (n.kind === 'root') {
      g.appendChild(mk('circle', { 'class': 'hub-disc', r: Math.max(n.w, n.h) / 2 + 16 }));
    }
    g.appendChild(mk('rect', chipRect(n)));
    var tb = textBox(n);
    var t = mk('text', { style: 'text-anchor:' + tb.anchor });
    t.setAttribute('x', tb.x);
    t.textContent = n.label;
    g.appendChild(t);
    if (n.hasKids) {
      var chev = mk('text', { 'class': 'chev', style: 'text-anchor:' + tb.anchor });
      var openNow = n.hasKids && S.open[S.view] && S.open[S.view].has(n.id);
      var cx = n.align === 'left' ? n.w - 12 : n.align === 'right' ? -n.w + 12 : (tb.anchor === 'middle' ? n.w / 2 - 12 : 0);
      if (openNow) cx = 1e6;

      chev.textContent = '›';

  }

  function linkPath(l) {
    var a = l.a, b = l.b;
    var ax = a.x, ay = a.y, bx = b.x, by = b.y;

    if (l.kind === 'tree') {
      var x1 = a.x + (a.align === 'left' ? a.w : a.align === 'right' ? 0 : a.w / 2);
      if (a.kind === 'root') x1 = a.x + a.w / 2;
      var x2 = b.x - b.w / 2 - 6;
      var mx = x1 + Math.max(18, (x2 - x1) * 0.46);
      return 'M' + x1 + ' ' + a.y + 'C' + mx + ' ' + a.y + ',' + mx + ' ' + b.y + ',' + x2 + ' ' + b.y;
    }

    if (l.kind === 'rad') {
      /* 射线与胶囊边框的交点：横向或纵向取近的那条边 */
      var qx, qy;
      if (b.align === 'left') { qx = b.x - 5; qy = b.y; }
      else if (b.align === 'right') { qx = b.x + 5; qy = b.y; }
      else {
        var ca = Math.abs(Math.cos(b.ang)), sa = Math.abs(Math.sin(b.ang));
        var tx = ca > 1e-3 ? (b.w / 2) / ca : 1e9;
        var ty = sa > 1e-3 ? (b.h / 2) / sa : 1e9;
        var pad = Math.min(tx, ty) + 5;
        qx = b.x - Math.cos(b.ang) * pad;
        qy = b.y - Math.sin(b.ang) * pad;
      }
      /* 从底盘/胶囊边缘出发，粗细收线（trunk → twig） */
      var aPad = a.kind === 'root' ? Math.max(a.w, a.h) / 2 + 16 : (a.w || 0) / 2;
      var sx = a.x + Math.cos(b.ang) * aPad;
      var sy = a.y + Math.sin(b.ang) * aPad;
      var w1 = a.kind === 'root' ? 2.2 : 1.9, w2 = 1.0;
      var dx = qx - sx, dy = qy - sy, len = Math.hypot(dx, dy) || 1;
      var nx = -dy / len, ny = dx / len;
      return 'M' + (sx + nx * w1) + ' ' + (sy + ny * w1) +
             'L' + (qx + nx * w2) + ' ' + (qy + ny * w2) +
             'L' + (qx - nx * w2) + ' ' + (qy - ny * w2) +
             'L' + (sx - nx * w1) + ' ' + (sy - ny * w1) + 'Z';
    }

    /* col：从分类胶囊边缘拉到该分支列 */
    var fromX = a.x + (Math.cos(a.ang) >= 0 ? a.w / 2 : -a.w / 2);
    var fromY = a.y;
    var toX = b.align === 'left' ? b.x - b.w : b.x;
    var toY = b.y;
    var cx = fromX + (toX - fromX) * 0.55;
    return 'M' + fromX + ' ' + fromY + 'C' + cx + ' ' + fromY + ',' + cx + ' ' + toY + ',' + toX + ' ' + toY;
  }

  function render() {
    S.W = svg.clientWidth || S.W || 960;
    S.H = svg.clientHeight || S.H || 680;
    svg.setAttribute('viewBox', '0 0 ' + S.W + ' ' + S.H);

    var root = prune(buildTree(S.view), S.open[S.view]);
    var res = S.view === 'kg' ? layoutKG(root) : layoutTH(root);

    gArc.innerHTML = ''; gLink.innerHTML = ''; gNode.innerHTML = '';
    linkEls = [];

    /* 分支列的脊柱 */
    (res.spines || []).forEach(function (sp) {
      var d = sp.vertical === false
        ? 'M' + sp.x + ' ' + sp.y0 + 'L' + sp.x + ' ' + sp.y1
        : 'M' + sp.x + ' ' + sp.y0 + 'L' + sp.x + ' ' + sp.y1;
      gArc.appendChild(mk('path', { 'class': 'spine', d: d }));
    });

    res.links.forEach(function (l) {
      var p = mk('path', { 'class': 'link' + (l.kind === 'rad' ? ' band' : ''), 'data-d': depthOf(l.b) });
      gLink.appendChild(p);
      linkEls.push({ l: l, p: p });
    });

    var parentOf = new Map();
    res.links.forEach(function (l) { parentOf.set(l.b.id, l.a); });

    res.nodes.forEach(function (n) {
      n.g = drawNode(n);
      gNode.appendChild(n.g);
      var p = S.prev.get(n.id);
      n.tx = n.x; n.ty = n.y;
      if (p) { n.x = p.x; n.y = p.y; }
      else if (!STILL && !REDUCED) {

      }

        n.y = par ? par.y : n.ty;
      }
      n.g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');

    S.links = res.links;

    if (!S.keepCam) fitCam(res.nodes, S.forceScale || 0);

    S.forceScale = 0;
    if (!S.started) {

    }

    markSel();
    kick();

  /* 选中时：祖先链路 + 自己的子树保持清晰，其余压暗 */
  function applyFocus(res, parentOf) {
    var keep = null;
    if (S.sel) {
      keep = new Set([S.sel.id]);
      var cur = parentOf.get(S.sel.id);
      while (cur) { keep.add(cur.id); cur = parentOf.get(cur.id); }
      var kids = new Map();
      res.links.forEach(function (l) {
        if (!kids.has(l.a.id)) kids.set(l.a.id, []);
        kids.get(l.a.id).push(l.b.id);
      });
      var stack = [S.sel.id];
      while (stack.length) {
        var id = stack.pop();
        (kids.get(id) || []).forEach(function (k) { if (!keep.has(k)) { keep.add(k); stack.push(k); } });
      }
    }
    res.nodes.forEach(function (n) {
      if (!n.g) return;
      var on = !keep || keep.has(n.id);
      n.g.classList.toggle('dim', !on);
      n.g.classList.toggle('infocus', !!keep && on);
    });
    linkEls.forEach(function (o) {
      var on = !keep || (keep.has(o.l.a.id) && keep.has(o.l.b.id));
      o.p.classList.toggle('dim', !on);
    });
  }

  function nodeBox(n) {
    var cx = n.tx == null ? n.x : n.tx;
    var cy = n.ty == null ? n.y : n.ty;
    var left = n.align === 'left' ? cx : n.align === 'right' ? cx - n.w : cx - n.w / 2;

  function bounds(nodes) {

  function fitCam(nodes, forceScale) {

    var b = bounds(nodes), pad = narrow ? 26 : 44;
    var s = forceScale || clamp(Math.min((S.W - pad * 2) / b.w, (S.H - pad * 2) / b.h), narrow ? 0.42 : 0.80, 1.42);

    S.camT.y = (S.H - b.h * s) / 2 - b.y0 * s;

      if (sn) {
        var sx = sn.tx == null ? sn.x : sn.tx, sy = sn.ty == null ? sn.y : sn.ty;

  function kick() { if (!S.raf) S.raf = requestAnimationFrame(step); }

  function step() {

      else {

        n.y += (n.ty - n.y) * 0.2;
        if (Math.abs(n.tx - n.x) > 0.35 || Math.abs(n.ty - n.y) > 0.35) moving = true;
        else { n.x = n.tx; n.y = n.ty; }
      }
      n.g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
      S.prev.set(n.id, { x: n.tx, y: n.ty });

    linkEls.forEach(function (o) { o.p.setAttribute('d', linkPath(o.l)); });

  /* ---------- 交互 ---------- */

  var drag = null, moved = false;
  /* 内嵌 + 触屏：单指纵向滑动交给宿主滚动（否则一进题库就被地图吃掉，回不去首页） */
  var touchScroll = null;

    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;

    S.cam.y = drag.cy + dy;

  /* ---------- 弹窗 ---------- */

  function card(q) {
    return '<div class="qcard" role="button" tabindex="0" data-i="' + q.i + '">' +
      '<div class="meta"><span>' + esc(q.ty) + '</span>' +
      '<span>难度 ' + q.d + '</span><span>' + esc(q.p) + '</span></div>' +
      '<p>' + esc(dec(q.s)) + '</p></div>';
  }

  function openLeaf(n) {
    var list = [];
    var id = n.id.slice(3);
    if (n.kind === 'leaf') list = DATA.qs.filter(function (q) { return q.l === id; });
    else list = DATA.qs.filter(function (q) { return q.t2 === id; });
    var kindLabel = S.view === 'kg' ? '知识点' : '解题思路';
    showModal({
      title: n.label,
      sub: kindLabel,
      body: '<div class="qlist-modal">' + (list.length ? list.map(card).join('') : '<p class="empty">这一支下面暂时没有题。</p>') + '</div>',
      back: null,
      primary: null
    });
  }

  /* 题干详情按需取：/qbank/q/{i}.json 里带公式图与原图的 data URL */
  var qCache = {};
  function qBody(q, det, tags) {
    var stem = det
      ? '<div class="stem qstem">' + det.stemHtml + '</div>'
      : '<div class="stem qstem"><span class="qloading">正在取题…</span></div>';
    var opts = '';
    if (det && det.options && det.options.length) {
      opts = '<ol class="qopts">' + det.options.map(function (o) {
        return '<li><b>' + esc(o.l) + '</b><span>' + o.html + '</span></li>';
      }).join('') + '</ol>';
    }
    return '<div class="qdetail" data-i="' + q.i + '">' + stem + opts +
      '<div class="tags">' + tags.join('') + '</div></div>';
  }
  function openQuestion(q) {
    S.cur = q;
    var kp = KG_LEAF.get(q.l);
    var tp = TH_SUB.get(q.t2);
    var tags = [];
    if (kp) tags.push('<span>知识点 · ' + esc(kp.mod + ' › ' + kp.chap + ' › ' + kp.name) + '</span>');
    if (tp) tags.push('<span>思路 · ' + esc(tp.cat + ' › ' + tp.name) + '</span>');
    tags.push('<span>' + esc(q.ty) + '</span>');
    tags.push('<span>' + q.d + ' 难度</span>');
    tags.push('<span>' + esc(q.p) + '</span>');
    var det = qCache[q.i];
    showModal({
      title: q.no ? ('第 ' + q.no + ' 题') : ('第 ' + q.i + ' 题'),
      sub: '先看原题，进入后不给答案',
      body: qBody(q, det, tags),
      back: S.sel ? S.sel.id : null,
      primary: '用这道题开始'
    });
    if (det) return;
    fetch('/qbank/q/' + q.i + '.json').then(function (r) {
      if (!r.ok) throw new Error('no');
      return r.json();
    }).then(function (d) {
      qCache[q.i] = d;
      var box = document.querySelector('.qdetail[data-i="' + q.i + '"]');
      if (box && S.modal && S.cur === q) box.outerHTML = qBody(q, d, tags);
    }).catch(function () {
      var box = document.querySelector('.qdetail[data-i="' + q.i + '"] .qloading');
      if (box) box.textContent = '题目暂时取不到，请稍后再试。';
    });
  }

  function showModal(o) {
    S.modal = o;
    var head = '<div class="modal-head">' +
      (o.back ? '<button class="ghost" id="mback" type="button">返回</button>' : '') +
      '<div class="grow"><h2>' + esc(o.title) + '</h2><p>' + esc(o.sub || '') + '</p></div>' +
      '<button class="ghost" id="mclose" type="button">关闭</button></div>';
    var foot = o.primary
      ? '<div class="modal-foot"><button class="primary" id="mstart" type="button">' + esc(o.primary) + '</button></div>'
      : '';
    modal.innerHTML = head + '<div class="modal-body">' + o.body + '</div>' + foot;
    scrim.hidden = false;
    var b = $('.modal-body', modal);
    if (b) b.scrollTop = 0;
    modal.setAttribute('tabindex', '-1');
    modal.focus({ preventScroll: true });
  }

  function closeModal() { scrim.hidden = true; S.modal = null; }

  function findQ(i) {
    for (var j = 0; j < DATA.qs.length; j++) if (String(DATA.qs[j].i) === String(i)) return DATA.qs[j];
    return null;
  }

  scrim.addEventListener('click', function (e) {
    if (e.target === scrim) { closeModal(); return; }
    if (e.target.closest('#mback')) {
      var id = S.modal && S.modal.back;
      if (id) {
        for (var i = 0; i < S.nodes.length; i++) if (S.nodes[i].id === id) { openLeaf(S.nodes[i]); return; }
      }
      closeModal();
      return;
    }
    if (e.target.closest('#mclose')) { closeModal(); return; }
    if (e.target.closest('#mstart')) {
      var cq = S.cur;
      closeModal();
      if (cq && window.__onStart) window.__onStart(cq);
      return;
    }
    var c = e.target.closest('.qcard');
    if (c) { var q = findQ(c.getAttribute('data-i')); if (q) openQuestion(q); }
  });
  modal.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('qcard')) {
      e.preventDefault();
      var q = findQ(e.target.getAttribute('data-i'));
      if (q) openQuestion(q);
    }
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !scrim.hidden) closeModal(); });

  function markSel() {
    var all = gNode.querySelectorAll('.node.is-sel');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('is-sel');
    if (!S.sel) return;
    var g = gNode.querySelector('[data-id="' + S.sel.id + '"]');
    if (g) g.classList.add('is-sel');
  }

  /* ---------- 右侧题库：跟着选中分支走 ---------- */
  var panelBuilt = false;
  function currentList() {
    if (!S.sel) return DATA.qs;
    return qsOf(S.sel.view || S.view, S.sel.kind, S.sel.id.slice(3));
  }

  /* 题库按分类分组：组头是分类名，组里是这一类的题 */
  function rowsOf(list) {
    var view = S.view;
    var kind = S.sel ? S.sel.kind : null;
    var id = S.sel ? S.sel.id.slice(3) : null;
    var out = [];
    function H(t) { out.push({ h: t }); }
    function S2(t) { out.push({ s: t }); }
    function Q(q) { out.push({ q: q }); }

    if (view === 'th') {
      if (kind === 'sub') { list.forEach(Q); return out; }
      DATA.think.forEach(function (t) {
        if (kind === 'cat' && t.id !== id) return;
        var inCat = list.filter(function (q) { return inThink(q, t.id); });
        if (!inCat.length) return;
        if (kind !== 'cat') H(t.name);
        var used = {};
        (t.children || []).forEach(function (s) {
          var hitSub = inCat.filter(function (q) { return inSub(q, s.id); });
          if (!hitSub.length) return;
          S2(s.name);
          hitSub.forEach(function (q) { used[q.i] = 1; Q(q); });
        });
        inCat.forEach(function (q) { if (!used[q.i]) Q(q); });
      });
      return out;
    }

    DATA.kg.forEach(function (m) {
      if (kind === 'mod' && m.id !== id) return;
      var hitMod = list.filter(function (q) { return inMod(q, m.name); });
      if (!hitMod.length) return;
      if (!kind) H(m.name);
      (m.children || []).forEach(function (c) {
        if (kind === 'chap' && c.id !== id) return;
        var inChap = hitMod.filter(function (q) { return q.k === c.id; });
        if (!inChap.length) return;
        if (kind !== 'chap') S2(c.name);
        if (kind === 'chap') {
          (c.children || []).forEach(function (l) {
            var inLeaf = inChap.filter(function (q) { return q.l === l.id; });
            if (!inLeaf.length) return;
            S2(l.name);
            inLeaf.forEach(Q);
          });
        } else {
          inChap.forEach(Q);
        }
      });
    });
    return out;
  }

  function syncPanel() {
    var list = currentList();
    var crumb = $('#scope');
    var allBtn = $('#all');
    if (!S.sel) {
      crumb.textContent = '';
      crumb.hidden = true;
      allBtn.hidden = true;
    } else {
      var path = pathOf(S.sel.view || S.view, S.sel.kind, S.sel.id.slice(3));
      crumb.textContent = path.filter(Boolean).join(' › ');
      crumb.hidden = false;
      allBtn.hidden = false;
    }

    var box = $('#qlist');
    box.innerHTML = list.length ? rowsOf(list).map(function (r, i) {
      if (r.h) return '<div class="grp-h">' + esc(r.h) + '</div>';
      if (r.s) return '<div class="grp-s">' + esc(r.s) + '</div>';
      return card(r.q).replace('<div class="qcard"', '<div style="animation-delay:' + Math.min(i * 6, 120) + 'ms" class="qcard in"');
    }).join('') : '<p class="empty">这一支下面暂时没有题。</p>';
    box.scrollTop = 0;
    panelBuilt = true;

    /* 选中行高亮 */
    var cards = box.querySelectorAll('.qcard');
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove('on');
  }

  $('#qlist').addEventListener('click', function (e) {
    var c = e.target.closest('.qcard');
    if (!c) return;
    var q = findQ(c.getAttribute('data-i'));
    if (!q) return;
    openQuestion(q);
  });

  window.__DBG = { DATA: DATA, rowsOf: function () { return rowsOf(currentList()); }, S: S, qsOf: qsOf };

  /* ---------- 顶部 ---------- */
  var tabs = document.querySelectorAll('.seg button');
  function setView(v) {
    if (S.view === v) return;
    S.view = v;
    S.sel = null;
    for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-selected', String(tabs[i].getAttribute('data-view') === v));
    render();
    syncPanel();
  }
  for (var t = 0; t < tabs.length; t++) {
    (function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-view') === S.view));
      b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
    })(tabs[t]);
  }

  $('#collapse').addEventListener('click', function () {
    var set = S.open[S.view];
    set.clear();
    set.add(S.view === 'kg' ? 'kg:root' : 'th:root');
    S.sel = null;
    S.keepCam = true;           /* 只收分支，视角留在原地 */
    render();
    syncPanel();
  });
  $('#reset').addEventListener('click', function () {
    S.open.kg.clear();
    S.open.th.clear();
    S.open.kg.add('kg:root');
    S.open.th.add('th:root');
    S.prev.clear();
    S.sel = null;
    S.forceScale = 1;           /* 真·回到初始视角：100% 并居中 */
    render();
    syncPanel();
  });
  $('#all').addEventListener('click', function () {
    S.sel = null;
    render();
    syncPanel();
  });

  /* 宿主切换深浅色时通知地图 */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data || {};
    if (d.type !== 'qbank:theme') return;
    var t = d.theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('bsj-theme', t); } catch (err) { }
  });
  $('#theme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('bsj-theme', cur); } catch (err) { }
    /* 内嵌时把主题同步给宿主，避免上面浅色、地图深色 */
    try { if (window.parent !== window) window.parent.postMessage({ type: 'qbank:theme', theme: cur }, location.origin); } catch (err) { }
  });

  function fit() {
    var w = svg.clientWidth, h = svg.clientHeight;
    if (!w || !h || (w === S.W && h === S.H)) return;
    S.W = w; S.H = h;
    render();
  }
  window.addEventListener('resize', function () { setTimeout(fit, 60); });
  if (window.ResizeObserver) new ResizeObserver(function () { setTimeout(fit, 60); }).observe(svg);

  window.__S = S;
  window.__list = currentList;

  render();
  syncPanel();
  requestAnimationFrame(fit);
  setTimeout(fit, 150);

  var deep = QP.get('leaf');
  if (deep) {
    setTimeout(function () {
      for (var i = 0; i < S.nodes.length; i++) {
        if (S.nodes[i].id === deep) { S.sel = { id: deep, kind: S.nodes[i].kind, label: S.nodes[i].label, view: S.view }; markSel(); syncPanel(); openLeaf(S.nodes[i]); return; }
      }
    }, 40);
  }
})();

</script>

<script>
/* 首页 → 题库的滚动淡入；第三页（做题）由 app.js 的 __onStart 唤起 */
(function () {
  var DATA = JSON.parse(document.getElementById('qdata').textContent);
  var sheet = document.getElementById('sheet');
  var home = document.getElementById('home');
  var heroIn = document.getElementById('heroIn');
  var bank = document.getElementById('bank');
  var bar = document.getElementById('goodbar');
  var prac = document.getElementById('practice');
  var cardEl = document.getElementById('prCard');
  var cnt = document.getElementById('prCount');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dec(v) {
    return String(v == null ? '' : v)
      .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
  }

  var EMBED = /[?&]embedded=1/.test(location.search);
  document.body.dataset.page = 'home';
  function jumpBank() {
    var st = sheet.scrollTop;
    var top = bank.getBoundingClientRect().top - sheet.getBoundingClientRect().top + st;
    sheet.scrollTop = Math.round(top);
    onScroll();
  }
  if (EMBED) {
    document.documentElement.classList.add('is-embed');
    /* 嵌在宿主里：顶栏改成浮在地图上的胶囊工具条，切轴 / 收起 / 复位都还在 */
    var topbar = document.querySelector('.top');
    if (topbar) topbar.classList.add('is-float');
    /* 宿主里给一个「返回首页」——地图自己知道怎么回去 */
    var tools = document.querySelector('.tools');
    if (tools) {
      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'tool';
      back.textContent = '← 返回';
      back.addEventListener('click', function () {
        window.parent.postMessage({ type: 'qbank:close' }, location.origin);
      });
      tools.insertBefore(back, tools.firstChild);
    }
    home.style.display = 'none';
    sheet.style.overflow = 'auto';
    document.body.dataset.page = 'bank';
    requestAnimationFrame(function () { sheet.scrollTop = 0; onScroll(); });
  }
  var wantBank = /[?&]at=bank/.test(location.search);
  if (wantBank) { requestAnimationFrame(jumpBank); setTimeout(jumpBank, 400); setTimeout(jumpBank, 1200); }
  window.addEventListener('resize', function () { if (wantBank) jumpBank(); });

  function toBank() {
    var st = sheet.scrollTop;
    var top = bank.getBoundingClientRect().top - sheet.getBoundingClientRect().top + st;
    sheet.scrollTo({ top: Math.round(top), behavior: reduce ? 'auto' : 'smooth' });
    if (bar.blur) bar.blur();
  }
  bar.addEventListener('click', toBank);
  var navB = document.getElementById('navBank');
  if (navB) navB.addEventListener('click', toBank);

  var ticking = false;
  function onScroll() {
    ticking = false;
    var h = home.offsetHeight || 1;
    var p = Math.min(1, Math.max(0, sheet.scrollTop / h));
    heroIn.style.opacity = String(Math.max(0, 1 - p * 1.7));
    heroIn.style.transform = 'translateY(' + (-p * 26).toFixed(1) + 'px)';
    bar.style.opacity = String(Math.max(0, 1 - p * 2.4));
    bar.style.pointerEvents = p > 0.55 ? 'none' : 'auto';
    if (!EMBED) document.body.dataset.page = p > 0.52 ? 'bank' : 'home';
  }
  sheet.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(onScroll);
  }, { passive: true });

  var cur = null;
  function openPractice(q) {
    if (!q) return;
    cur = q;
    var idx = 0;
    for (var i = 0; i < DATA.qs.length; i++) if (String(DATA.qs[i].i) === String(q.i)) { idx = i; break; }
    cnt.textContent = '第 ' + (idx + 1) + ' 题 · 共 ' + DATA.qs.length + ' 道';
    cardEl.innerHTML =
      '<div class="pr-meta"><span>' + esc(q.ty) + '</span><span>难度 ' + q.d + '</span><span>' + esc(q.p) + '</span></div>' +
      '<div class="pr-stem qstem" id="prStem"><p>' + esc(dec(q.s)) + '</p></div>' +
      '<div class="pr-actions"><button class="primary" id="prGo" type="button">开始一步一步解</button></div>';
    fetch('/qbank/q/' + q.i + '.json').then(function (r) {
      if (!r.ok) throw new Error('no');
      return r.json();
    }).then(function (d) {
      if (cur !== q) return;
      var box = document.querySelector('#prStem');
      if (!box) return;
      var opts = (d.options || []).length
        ? '<ol class="qopts">' + d.options.map(function (o) {
            return '<li><b>' + esc(o.l) + '</b><span>' + o.html + '</span></li>';
          }).join('') + '</ol>'
        : '';
      box.innerHTML = d.stemHtml + opts;
    }).catch(function () { });
    prac.hidden = false;
    sheet.style.overflow = 'hidden';
    prac.setAttribute('tabindex', '-1');
    prac.focus({ preventScroll: true });
  }
  function closePractice() {
    prac.hidden = true;
    sheet.style.overflow = '';
    cur = null;
  }
  function sendPick(q) {
    var payload = { i: q.i, stem: q.stem || q.s, opt: q.opt || '', ty: q.ty, d: q.d, p: q.p };
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'qbank:pick', q: payload }, location.origin);
      return;
    }
    try { sessionStorage.setItem('qbank.pick', JSON.stringify(payload)); } catch (e) { }
    location.href = '/';
  }
  window.__sendPick = sendPick;
  /* 嵌在主应用里时，「用这道题开始」直接把这题交回宿主；独立页才进第三屏 */
  window.__onStart = function (q) {
    if (EMBED && window.parent !== window) sendPick(q);
    else openPractice(q);
  };
  var qm = /[?&]q=(\d+)/.exec(location.search);
  if (qm) {
    var want = parseInt(qm[1], 10);
    setTimeout(function () {
      for (var i = 0; i < DATA.qs.length; i++) {
        if (DATA.qs[i].i === want) { openPractice(DATA.qs[i]); break; }
      }
    }, 60);
  }
  prac.addEventListener('click', function (e) {
    if (e.target.id === 'prBack') { closePractice(); return; }
    if (e.target.id === 'prGo') { if (cur) sendPick(cur); closePractice(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !prac.hidden) closePractice();
  });
})();
</script>
</body>
