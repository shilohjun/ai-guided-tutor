<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F8F5">
<title>物理 AI 解题助手 · 学术版</title>

<!-- ═══════════════════════════════════════════════════════════════════════
     ① 防 FOUC：必须在 <style> 之前同步执行。
        优先级：URL ?theme= 预览参数 > localStorage 用户选择 > 系统偏好
        这段只做「上色」，不做任何 UI 绑定，因此可以在 <head> 里跑。
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var root = document.documentElement;
  var KEY = 'dsh-theme', CKEY = 'dsh-contrast';
  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  var mqMore = window.matchMedia('(prefers-contrast: more)');
  var read = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var write = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };

  var fromUrl = new URLSearchParams(location.search).get('theme');
  var valid = function (p) { return p === 'light' || p === 'dark' || p === 'system'; };
  var pref = valid(fromUrl) ? fromUrl : (valid(read(KEY)) ? read(KEY) : 'system');

  function resolve(p) { return p === 'system' ? (mqDark.matches ? 'dark' : 'light') : p; }
  function paint(p) {
    var t = resolve(p);
    root.setAttribute('data-theme', t);
    root.setAttribute('data-theme-pref', p);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0E141B' : '#F7F8F5');
  }

  // 高对比：手动选择优先，否则跟随系统 prefers-contrast
  var cPref = read(CKEY);
  if (cPref !== 'high' && cPref !== 'normal') cPref = mqMore.matches ? 'high' : 'normal';
  root.setAttribute('data-contrast', cPref);

  paint(pref);
  window.Theme = { KEY: KEY, CKEY: CKEY, pref: function () { return pref; }, set: function (p, persist) {
    if (!valid(p)) return; pref = p; if (persist) write(KEY, p); paint(p);
  }, repaint: function () { paint(pref); }, mqDark: mqDark, mqMore: mqMore };
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   0. 字体 —— 衬线标题 / 无衬线正文 / 等宽公式
   纯本地字体栈，不请求外部 CDN：既能离线打开，也避免中文字体加载闪烁。
   如需 Source Serif 4 / JetBrains Mono，自行 @font-face 后把字体名放最前即可。
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --font-serif:"Source Serif 4","Noto Serif SC","Source Han Serif SC","Songti SC","STSong","STZhongsong","SimSun",Georgia,"Times New Roman",serif;
  --font-sans:"Inter","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono","IBM Plex Mono","Cascadia Mono","SFMono-Regular",Consolas,"Noto Sans Mono",Menlo,monospace;

  --measure:66ch;
  --radius:4px;
  --radius-lg:8px;
  --shell:1200px;
}

/* ══════════════════════════════════════════════════════════════════════════
   1. PRIMITIVE —— 只有「颜色名 + 色值」。
   组件层禁止引用这一层，只允许语义层引用它。
   命名规则：--prim-{色族}-{明度}，数值越小越浅。
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* 藏青 / 靛蓝 —— 主色，理性与权威 */
  --prim-navy-050:#EDF2F8;
  --prim-navy-100:#C9D8EA;
  --prim-navy-200:#9FBCE6;
  --prim-navy-300:#7FA3D4;
  --prim-navy-400:#5A82B6;
  --prim-navy-500:#4A6C9C;
  --prim-navy-600:#3A5C8C;
  --prim-navy-700:#2E4E7A;   /* 浅色主题 brand */
  --prim-navy-800:#243F63;   /* 浅色主题 brand-hover */
  --prim-navy-900:#1B3050;
  --prim-navy-950:#16273A;   /* 深色主题选中底 */

  /* 学院青绿 —— 辅助色：推导 / 正确 / 已解决 */
  --prim-teal-050:#E8F2EF;
  --prim-teal-100:#C3DCD4;
  --prim-teal-300:#5CC4AE;   /* 深色主题 accent */
  --prim-teal-500:#2E9581;
  --prim-teal-700:#1F7A68;   /* 浅色主题 accent */
  --prim-teal-800:#17604F;

  /* 琥珀金 —— 点缀色：待讨论 / 进行中 / 需关注 */
  --prim-amber-050:#FAF1DE;
  --prim-amber-100:#EBD7AC;
  --prim-amber-300:#E0B45C;  /* 深色主题 accent */
  --prim-amber-500:#C99A34;
  --prim-amber-700:#B07D17;  /* 浅色主题 accent（仅图标/描边） */
  --prim-amber-800:#8E6410;  /* 需要当文字用时（4.7:1） */

  /* 学术版语义色：低饱和，不出现 sRGB 纯红纯绿 */
  --prim-green-050:#E7F3EC;
  --prim-green-150:#C4DECE;
  --prim-green-300:#63B884;
  --prim-green-700:#2E8B57;
  --prim-green-800:#2A6B46;
  --prim-red-050:#FBEDEC;
  --prim-red-150:#E9C9C6;
  --prim-red-300:#D96A6A;
  --prim-red-700:#B33A3A;
  --prim-red-800:#A3352F;

  /* 暖纸白（浅色主题中性色） */
  --prim-paper-000:#FFFFFF;
  --prim-paper-050:#F7F8F5;
  --prim-paper-100:#EEF0EC;
  --prim-paper-150:#EDEFEA;
  --prim-paper-200:#E2E4DF;
  --prim-paper-300:#C9CCC5;
  --prim-paper-500:#8A8C85;   /* 交互控件描边：3.4:1 */

  /* 深棕黑（浅色主题文字） */
  --prim-ink-950:#1C1C17;
  --prim-ink-900:#23231F;
  --prim-ink-600:#5C5F58;
  --prim-ink-500:#696C64;     /* 弱化文字：4.7:1（最差底色） */

  /* 深海蓝（深色主题中性色） */
  --prim-abyss-950:#0A0F15;
  --prim-abyss-900:#0E141B;
  --prim-abyss-800:#141C25;
  --prim-abyss-700:#1B2530;

  /* 深色主题下语义色的「低饱和底」 */
  --prim-abyss-teal:#0C1715;
  --prim-abyss-amber:#241B0D;
  --prim-abyss-green:#0F2119;
  --prim-abyss-red:#241315;
}

/* ══════════════════════════════════════════════════════════════════════════
   2. SEMANTIC —— 浅色主题（默认）。
   组件只认这一层：text-primary / surface / border-subtle ……
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* 背景层级 */
  --bg-page:var(--prim-paper-050);
  --bg-surface:var(--prim-paper-000);
  --bg-elevated:var(--prim-paper-000);
  --bg-sunken:var(--prim-paper-100);
  --bg-hover:var(--prim-paper-100);
  --bg-selected:var(--prim-navy-050);
  --bg-inverse:var(--prim-navy-900);

  /* 分割线：装饰用（不承担识别职责，故允许低于 3:1） */
  --border-subtle:var(--prim-paper-150);
  --border:var(--prim-paper-200);
  --border-strong:var(--prim-paper-300);
  /* 交互控件描边：必须 ≥3:1，故独立成 token（3.4:1） */
  --border-control:var(--prim-paper-500);

  /* 文字 */
  --text-heading:var(--prim-ink-950);
  --text-primary:var(--prim-ink-900);
  --text-secondary:var(--prim-ink-600);
  --text-muted:var(--prim-ink-500);
  --text-inverse:var(--prim-paper-050);
  --text-on-brand:var(--prim-paper-050);

  /* 主色 */
  --brand:var(--prim-navy-700);
  --brand-hover:var(--prim-navy-800);
  --brand-active:var(--prim-navy-900);
  --brand-tint:var(--prim-navy-050);
  --brand-tint-border:var(--prim-navy-100);

  /* 辅助色：青绿 */
  --accent-teal:var(--prim-teal-700);
  --accent-teal-tint:var(--prim-teal-050);
  --accent-teal-border:var(--prim-teal-100);

  /* 点缀色：琥珀金 */
  --accent-amber:var(--prim-amber-700);
  --accent-amber-ink:var(--prim-amber-800);
  --accent-amber-tint:var(--prim-amber-050);
  --accent-amber-border:var(--prim-amber-100);

  /* 状态 */
  --success:var(--prim-green-700);
  --success-ink:var(--prim-green-800);
  --success-tint:var(--prim-green-050);
  --success-border:var(--prim-green-150);
  --warning:var(--prim-amber-700);
  --warning-ink:var(--prim-amber-800);
  --warning-tint:var(--prim-amber-050);
  --warning-border:var(--prim-amber-100);
  --danger:var(--prim-red-700);
  --danger-ink:var(--prim-red-800);
  --danger-tint:var(--prim-red-050);
  --danger-border:var(--prim-red-150);

  /* 焦点 / 选中 / 阴影 */
  --focus-ring:var(--prim-navy-700);
  --selection-bg:#D8E4F1;
  --shadow-card:0 1px 1px rgba(28,28,23,.03),0 2px 6px rgba(28,28,23,.035);
  --shadow-pop:0 10px 28px rgba(28,28,23,.12);

  /* 提示条：深色主题下改用层级抬升 + 强描边，不再压暗 */
  --toast-bg:var(--bg-inverse);
  --toast-border:var(--prim-navy-900);

  /* Logo 渐变透明度（规范：≤0.6，深色主题减半） */
  --logo-tint-alpha:.55;
}

/* ══════════════════════════════════════════════════════════════════════════
   3. 深色主题
   彩色一律「提亮 + 降饱和」，否则在深底上会发荧发脏。
   ══════════════════════════════════════════════════════════════════════════ */
html[data-theme="dark"]{
  color-scheme:dark;

  --bg-page:var(--prim-abyss-900);
  --bg-surface:var(--prim-abyss-800);
  --bg-elevated:var(--prim-abyss-700);
  --bg-sunken:var(--prim-abyss-950);
  --bg-hover:var(--prim-abyss-700);
  --bg-selected:var(--prim-navy-950);
  --bg-inverse:var(--prim-abyss-700);

  --border-subtle:rgba(150,180,220,.09);
  --border:rgba(150,180,220,.14);
  --border-strong:rgba(150,180,220,.26);
  /* 合成后 ≈ #5F748F，对 surface 3.58:1 */
  --border-control:rgba(150,180,220,.58);

  --text-heading:#F2F6FA;
  --text-primary:#E8EDF2;
  --text-secondary:#A6B2BF;
  --text-muted:#84909E;
  --text-inverse:var(--prim-abyss-900);
  --text-on-brand:var(--prim-abyss-900);

  --brand:var(--prim-navy-300);
  --brand-hover:var(--prim-navy-200);
  --brand-active:var(--prim-navy-100);
  --brand-tint:var(--prim-navy-950);
  --brand-tint-border:#2C4460;

  --accent-teal:var(--prim-teal-300);
  --accent-teal-tint:var(--prim-abyss-teal);
  --accent-teal-border:#1A342E;

  --accent-amber:var(--prim-amber-300);
  --accent-amber-ink:var(--prim-amber-300);
  --accent-amber-tint:var(--prim-abyss-amber);
  --accent-amber-border:#3E3115;

  --success:var(--prim-green-300);
  --success-ink:var(--prim-green-300);
  --success-tint:var(--prim-abyss-green);
  --success-border:#1F3B2C;
  --warning:var(--prim-amber-300);
  --warning-ink:var(--prim-amber-300);
  --warning-tint:var(--prim-abyss-amber);
  --warning-border:#3E3115;
  --danger:var(--prim-red-300);
  --danger-ink:var(--prim-red-300);
  --danger-tint:var(--prim-abyss-red);
  --danger-border:#45262A;

  --focus-ring:var(--prim-navy-300);
  --selection-bg:#2B4260;
  --shadow-card:0 1px 1px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.22);
  --shadow-pop:0 14px 34px rgba(0,0,0,.46);

  --toast-bg:var(--bg-inverse);
  --toast-border:rgba(150,180,220,.26);

  --logo-tint-alpha:.26;
}

/* ── 4. 无 JS 兜底镜像 ────────────────────────────────────────────────────
   脚本正常时 html 一定带 data-theme，本段不会生效。
   仅在禁用 JS 时接管「跟随系统」。改深色 token 时两处需同步。 */
@media (prefers-color-scheme: dark){
  html:not([data-theme]){
    color-scheme:dark;
    --bg-page:var(--prim-abyss-900);
    --bg-surface:var(--prim-abyss-800);
    --bg-elevated:var(--prim-abyss-700);
    --bg-sunken:var(--prim-abyss-950);
    --bg-hover:var(--prim-abyss-700);
    --bg-selected:var(--prim-navy-950);
    --bg-inverse:var(--prim-abyss-700);
    --border-subtle:rgba(150,180,220,.09);
    --border:rgba(150,180,220,.14);
    --border-strong:rgba(150,180,220,.26);
    --border-control:rgba(150,180,220,.58);
    --text-heading:#F2F6FA;
    --text-primary:#E8EDF2;
    --text-secondary:#A6B2BF;
    --text-muted:#84909E;
    --text-inverse:var(--prim-abyss-900);
    --text-on-brand:var(--prim-abyss-900);
    --brand:var(--prim-navy-300);
    --brand-hover:var(--prim-navy-200);
    --brand-active:var(--prim-navy-100);
    --brand-tint:var(--prim-navy-950);
    --brand-tint-border:#2C4460;
    --accent-teal:var(--prim-teal-300);
    --accent-teal-tint:var(--prim-abyss-teal);
    --accent-teal-border:#1A342E;
    --accent-amber:var(--prim-amber-300);
    --accent-amber-ink:var(--prim-amber-300);
    --accent-amber-tint:var(--prim-abyss-amber);
    --accent-amber-border:#3E3115;
    --success:var(--prim-green-300);
    --success-ink:var(--prim-green-300);
    --success-tint:var(--prim-abyss-green);
    --success-border:#1F3B2C;
    --warning:var(--prim-amber-300);
    --warning-ink:var(--prim-amber-300);
    --warning-tint:var(--prim-abyss-amber);
    --warning-border:#3E3115;
    --danger:var(--prim-red-300);
    --danger-ink:var(--prim-red-300);
    --danger-tint:var(--prim-abyss-red);
    --danger-border:#45262A;
    --focus-ring:var(--prim-navy-300);
    --selection-bg:#2B4260;
    --shadow-card:0 1px 1px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.22);
    --shadow-pop:0 14px 34px rgba(0,0,0,.46);
    --toast-bg:var(--bg-inverse);
    --toast-border:rgba(150,180,220,.26);
    --logo-tint-alpha:.26;
  }
}

/* ── 5. 高对比模式 ────────────────────────────────────────────────────────
   手动开关（data-contrast="high"）与系统偏好（prefers-contrast: more）等效。
   只加深文字与描边，不动背景，保持层级关系。 */
html[data-contrast="high"]{
  --text-heading:#12120D;
  --text-primary:#17170F;
  --text-secondary:#3A3D36;
  --text-muted:#4A4D46;
  --border-subtle:var(--prim-paper-200);
  --border:#B4B8AE;
  --border-strong:var(--prim-paper-500);
  --border-control:#55584F;
  --focus-ring:var(--prim-navy-900);
}
html[data-contrast="high"][data-theme="dark"]{
  --text-heading:#FAFCFE;
  --text-primary:#F7FAFD;
  --text-secondary:#C9D3DD;
  --text-muted:#A8B4C0;
  --border-subtle:rgba(150,180,220,.18);
  --border:rgba(150,180,220,.28);
  --border-strong:rgba(150,180,220,.46);
  --border-control:rgba(150,180,220,.78);
  --focus-ring:#A8C4EA;
}
@media (prefers-contrast: more){
  html:not([data-contrast]){
    --text-heading:#12120D;
    --text-primary:#17170F;
    --text-secondary:#3A3D36;
    --text-muted:#4A4D46;
    --border-subtle:var(--prim-paper-200);
    --border:#B4B8AE;
    --border-strong:var(--prim-paper-500);
    --border-control:#55584F;
    --focus-ring:var(--prim-navy-900);
  }
  html:not([data-contrast])[data-theme="dark"]{
    --text-heading:#FAFCFE;
    --text-primary:#F7FAFD;
    --text-secondary:#C9D3DD;
    --text-muted:#A8B4C0;
    --border-subtle:rgba(150,180,220,.18);
    --border:rgba(150,180,220,.28);
    --border-strong:rgba(150,180,220,.46);
    --border-control:rgba(150,180,220,.78);
    --focus-ring:#A8C4EA;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   6. 基础
   ══════════════════════════════════════════════════════════════════════════ */
html{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg-page);
  color:var(--text-primary);
  font:400 16px/1.75 var(--font-sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--selection-bg);color:var(--text-heading)}
button,input,textarea,select{font:inherit;color:inherit}
button,.button,select{cursor:pointer}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:2px}

h1,h2,h3,p,ol,ul{margin:0}
/* 中文衬线（Noto Serif SC / 思源宋体 / 宋体）普遍只有 Regular，
   600 会被浏览器「合成粗体」，笔画发糊。这里一律用真实字重 400，
   层级交给字号与灰度；同时禁止合成粗体。 */
h1,h2,h3{
  font-family:var(--font-serif);
  color:var(--text-heading);
  font-weight:400;
  font-synthesis-weight:none;
  letter-spacing:.01em;
}
h1{font-size:clamp(1.625rem,1.3rem + 1.35vw,2.125rem);line-height:1.38}
h2{font-size:1.3125rem;line-height:1.45;margin-bottom:1rem}
h3{
  font-family:var(--font-sans);
  font-size:1rem;line-height:1.6;font-weight:600;
  margin-bottom:.6rem;color:var(--text-primary);
}
p{margin:.625rem 0}
strong,b{font-weight:600}
small{font-size:.875rem}

.muted,small.muted{color:var(--text-muted)}
.frame{width:100%;max-width:var(--shell);margin-inline:auto;padding-inline:clamp(1rem,3vw,2rem)}

/* ══════════════════════════════════════════════════════════════════════════
   7. 报头 Masthead + 流程刻度 + 主题控制
   ══════════════════════════════════════════════════════════════════════════ */
.masthead{border-bottom:1px solid var(--border)}
.masthead-inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:1.5rem;padding-block:1.05rem;flex-wrap:wrap;
}
.brand{
  display:inline-flex;align-items:center;gap:.75rem;
  background:none;border:0;padding:.25rem .35rem .25rem 0;border-radius:var(--radius);
  color:inherit;text-align:left;
}
.brand:hover{background:none;border-color:transparent}
.brand-mark{
  position:relative;flex:0 0 34px;width:34px;height:34px;
  display:grid;place-items:center;overflow:hidden;
  border-radius:3px;background:var(--brand);
  color:var(--text-on-brand);
  font-family:var(--font-serif);font-size:1.2rem;line-height:1;
}
/* 渐变仅出现在 Logo，且用 opacity 实现「透明度 ≤0.6 / 深色减半」 */
.brand-mark::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(145deg,transparent 38%,var(--accent-teal) 100%);
  opacity:var(--logo-tint-alpha);
}
.brand-mark>span{position:relative;z-index:1}
.brand-text strong{
  display:block;font-family:var(--font-serif);font-weight:400;
  font-synthesis-weight:none;
  font-size:1.0625rem;line-height:1.4;color:var(--text-heading);letter-spacing:.03em;
}
.brand-text small{
  display:block;font-family:var(--font-mono);font-size:.625rem;
  letter-spacing:.14em;line-height:1.6;color:var(--text-muted);
}
.masthead-tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}

.tool{
  display:inline-flex;align-items:center;gap:.375rem;
  padding:.3rem .55rem;border:1px solid var(--border);border-radius:var(--radius);
  background:transparent;color:var(--text-secondary);font-size:.75rem;line-height:1.5;
}
.tool:hover{background:var(--bg-hover);border-color:var(--border-control);color:var(--text-primary)}
.tool[aria-pressed="true"]{
  background:var(--brand-tint);border-color:var(--brand-tint-border);color:var(--brand);
  border-color:var(--brand);
}
.tool-glyph{font-family:var(--font-mono);font-size:.8125rem;line-height:1}

.theme-switch{
  display:inline-flex;align-items:center;gap:2px;padding:2px;
  background:var(--bg-sunken);border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);
}
.theme-switch button{
  display:inline-flex;align-items:center;gap:.375rem;
  padding:.28rem .5rem;border:1px solid transparent;border-radius:2px;
  background:transparent;color:var(--text-secondary);
  font-size:.75rem;line-height:1.5;
}
.theme-switch button:hover{background:var(--bg-hover);border-color:transparent;color:var(--text-primary)}
.theme-switch button[aria-checked="true"]{
  background:var(--bg-surface);border-color:var(--border-control);
  color:var(--brand);font-weight:600;box-shadow:var(--shadow-card);
}
.theme-switch .seg-glyph{font-family:var(--font-mono);font-size:.8125rem;line-height:1}

/* 五步流程刻度：真实序列，故用刻度而非装饰编号 */
.flow{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.55rem 0 .7rem;border-top:1px solid var(--border-subtle);
}
.flow-ticks{display:flex;align-items:center;gap:5px}
.flow-tick{width:26px;height:2px;background:var(--border-strong)}
.flow-tick.is-done{background:var(--brand)}
.flow-tick.is-now{background:var(--brand);height:4px}
.flow-label{
  margin:0;
  font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.1em;
  color:var(--text-muted);white-space:nowrap;
}

/* ══════════════════════════════════════════════════════════════════════════
   8. 页面骨架
   ══════════════════════════════════════════════════════════════════════════ */
#app{width:100%;max-width:var(--shell);margin-inline:auto;padding:2.5rem clamp(1rem,3vw,2rem) 2rem}
#app header{margin-bottom:2.25rem;max-width:var(--measure)}
#app header h1{margin-bottom:.55rem}
#app header .muted{
  font-size:.9375rem;line-height:1.7;color:var(--text-secondary);
  max-width:60ch;margin:0;
}
.input-grid,.practice-grid,.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.report-stack{display:flex;flex-direction:column;gap:1.5rem}

/* ══════════════════════════════════════════════════════════════════════════
   9. 卡片与按钮
   旧：纯白底 + 冷灰蓝描边 + 10px 圆角，卡片之间没有层级差别
   新：纸白底、1px 发丝线、8px 圆角、极轻阴影；浮起只靠 --bg-elevated
   ══════════════════════════════════════════════════════════════════════════ */
.card{
  padding:1.5rem;
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  min-width:0;
}

button,.button{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.5rem .95rem;
  border:1px solid var(--border-control);
  border-radius:var(--radius);
  background:var(--bg-surface);
  color:var(--text-primary);
  font-size:.9375rem;line-height:1.55;
  text-decoration:none;
  transition:background-color .16s ease,border-color .16s ease,color .16s ease;
}
button:hover,.button:hover{
  background:var(--bg-hover);
  border-color:var(--brand);
}
button:active,.button:active{background:var(--bg-sunken)}
button:disabled{
  background:var(--bg-sunken);
  border-color:var(--border);
  color:var(--text-muted);
  cursor:not-allowed;
}
button:disabled:hover{background:var(--bg-sunken);border-color:var(--border)}

/* 主按钮：全站唯一大面积主色，占比受控（每屏 1 个） */
.primary{
  background:var(--brand);border-color:var(--brand);
  color:var(--text-on-brand);font-weight:600;
}
.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);color:var(--text-on-brand)}
.primary:active{background:var(--brand-active);border-color:var(--brand-active)}
.primary:disabled,.primary:disabled:hover{
  background:var(--bg-sunken);border-color:var(--border);color:var(--text-muted);
}
.outline{background:transparent}
.outline:hover{background:var(--bg-hover)}
.quiet{background:transparent;border-color:transparent;color:var(--text-secondary)}
.quiet:hover{background:var(--bg-hover);border-color:var(--border);color:var(--text-primary)}

footer{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.75rem;flex-wrap:wrap}
footer button{min-width:8rem;padding:.6rem 1.3rem}

/* ══════════════════════════════════════════════════════════════════════════
   10. 标签页 / 输入 / 上传
   ══════════════════════════════════════════════════════════════════════════ */
.tabs{display:flex;gap:2px;margin-bottom:1.25rem;border-bottom:1px solid var(--border)}
.tabs button{
  border:0;border-radius:0;background:transparent;
  padding:.55rem .9rem;color:var(--text-secondary);
  font-size:.9375rem;line-height:1.5;
}
.tabs button:hover{background:var(--bg-hover);border-color:transparent;color:var(--text-primary)}
.tabs button.active{
  background:transparent;color:var(--text-heading);font-weight:600;
  box-shadow:inset 0 -2px var(--brand);
}
.tabs button.active:hover{background:transparent;color:var(--text-heading)}

label{font-size:.9375rem}
textarea,select{
  display:block;width:100%;
  padding:.85rem 1rem;
  background:var(--bg-surface);
  border:1px solid var(--border-control);
  border-radius:var(--radius);
  color:var(--text-primary);
  font-family:var(--font-sans);font-size:.9375rem;line-height:1.7;
  resize:vertical;
}
textarea{min-height:6.875rem}
textarea::placeholder{color:var(--text-muted);opacity:1}
textarea:focus-visible,select:focus-visible{border-color:var(--brand)}
.problem-input{min-height:18.75rem}
select{
  width:auto;padding:.35rem .7rem;font-size:.875rem;
  background:var(--bg-surface);
}

.upload-status{margin-bottom:1.1rem;font-size:.875rem;color:var(--text-muted)}
.upload-status label{display:flex;justify-content:space-between;gap:1rem}
progress{
  display:block;width:100%;height:5px;margin-top:.5rem;
  border:0;border-radius:2px;
  accent-color:var(--brand);
  background:var(--bg-sunken);
}
progress::-webkit-progress-bar{background:var(--bg-sunken);border-radius:2px}
progress::-webkit-progress-value{background:var(--brand);border-radius:2px}
progress::-moz-progress-bar{background:var(--brand);border-radius:2px}

.upload-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.75rem;min-height:17.5rem;padding:1.5rem;
  border:1px dashed var(--border-control);border-radius:var(--radius);
  text-align:center;cursor:pointer;
}
.upload-box:hover{border-color:var(--brand);background:var(--bg-hover)}
.upload-box:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.upload-box img{max-width:100%;max-height:12rem;object-fit:contain;border-radius:2px}
.upload-box span{font-size:.875rem;color:var(--text-muted)}
.upload-box strong{font-size:.9375rem;font-weight:600;color:var(--text-primary)}
.upload-box .upload-icon{
  font-family:var(--font-mono);font-size:1.75rem;line-height:1;
  color:var(--brand);font-weight:400;
}
.upload-box input,.button input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ══════════════════════════════════════════════════════════════════════════
   11. 题库列表 / 选中态
   ══════════════════════════════════════════════════════════════════════════ */
.question-list{display:flex;flex-direction:column;gap:.875rem}
.question{
  display:block;width:100%;text-align:left;position:relative;
  padding:1rem;background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--radius);
}
.question:hover{background:var(--bg-hover);border-color:var(--border-control)}
.question p{margin:0;line-height:1.72}
.question.selected,.selected{
  background:var(--bg-selected);
  border-color:var(--brand);
  box-shadow:inset 0 0 0 1px var(--brand);
}
.question.selected:hover{background:var(--bg-selected)}

.tag{
  display:inline-block;margin-bottom:.5rem;
  padding:.1rem .4rem;
  background:var(--bg-sunken);
  border:1px solid var(--border-subtle);
  border-radius:2px;
  color:var(--text-secondary);
  font-family:var(--font-mono);font-size:.6875rem;
  letter-spacing:.03em;line-height:1.7;
}
.check{
  float:right;
  font-family:var(--font-mono);font-size:.6875rem;
  letter-spacing:.04em;color:var(--brand);font-weight:600;
}
.question .check{margin:-.1rem 0 0 .5rem}

/* ══════════════════════════════════════════════════════════════════════════
   12. 模式选择
   ══════════════════════════════════════════════════════════════════════════ */
.mode-grid{max-width:62.5rem;margin:2.5rem 0 1rem}
.mode{
  display:block;text-align:left;position:relative;
  padding:2rem;min-height:17.5rem;
  background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-card);
}
.mode:hover{background:var(--bg-surface);border-color:var(--border-control);box-shadow:var(--shadow-card)}
.mode.selected{background:var(--bg-selected);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.mode.selected:hover{background:var(--bg-selected)}
.mode h2{margin-top:1rem}
.mode h3{font-size:.9375rem;line-height:1.7;font-weight:600;color:var(--text-primary)}
.mode p{color:var(--text-secondary);font-size:.9375rem;line-height:1.75}
.mode-icon{
  display:block;color:var(--brand);
  font-family:var(--font-mono);font-size:1.75rem;line-height:1.3;font-weight:400;
}
/* 选中标记做成方形勾选框：形状 + 字符 + 底色三重编码，
   未选中时整块不显示（:empty），避免两张卡上都挂一个空盒子 */
.mode .check{
  position:absolute;right:1.25rem;top:1.25rem;
  display:grid;place-items:center;
  width:20px;height:20px;float:none;
  border:1px solid var(--border-control);border-radius:2px;
  background:var(--bg-surface);
  font-size:.6875rem;line-height:1;font-weight:700;
  color:var(--brand);
}
.mode .check:empty{display:none}
.mode.selected .check{
  background:var(--brand);border-color:var(--brand);
  color:var(--text-on-brand);
}
.mode-note{text-align:center;margin-top:1.25rem}

/* ══════════════════════════════════════════════════════════════════════════
   13. 对话 —— 改造点：气泡 → 记录条目（academic transcript）
   去掉 SaaS 聊天气泡，改为左侧 2px 竖线 + 说话人小标签的推导记录。
   ══════════════════════════════════════════════════════════════════════════ */
.chat-layout{display:grid;grid-template-columns:minmax(0,30fr) minmax(0,70fr);gap:1.5rem}
.chat-layout aside{display:flex;flex-direction:column;gap:1.5rem;min-width:0}
.problem-card{max-height:22.5rem;overflow:auto}
.problem-card p{line-height:1.8}
.question-image{display:block;max-width:100%;max-height:15rem;object-fit:contain;margin-bottom:.5rem;border-radius:2px}

.chat-card{
  display:flex;flex-direction:column;
  padding:0;min-height:32rem;height:calc(100vh - 15rem);max-height:54rem;
  overflow:hidden;
}
.chat-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:.875rem;
  padding:1.15rem 1.5rem;
  background:var(--bg-elevated);
  border-bottom:1px solid var(--border);
}
.chat-head h2{margin-bottom:.1rem;font-size:1.125rem}
.chat-head small{display:block;font-size:.8125rem;line-height:1.6}
.chat-actions{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;flex-shrink:0}
.chat-actions>div{display:flex;gap:.4rem;margin-top:0;justify-content:flex-end}
.chat-actions button{font-size:.8125rem;padding:.3rem .55rem}
.chat-actions select{margin-left:0}

.messages{
  flex:1;min-height:10rem;padding:.35rem 1.5rem 1.25rem;
  overflow:auto;scrollbar-color:var(--border-strong) transparent;
}
.message{
  position:relative;
  padding:.85rem 1rem .95rem 1rem;
  margin-bottom:.5rem;
  border-left:2px solid var(--border);
  border-radius:0 var(--radius) var(--radius) 0;
  background:transparent;
}
.message.ai{border-left-color:var(--accent-teal)}
.message.user{
  border-left-color:var(--brand);
  background:var(--bg-selected);
}
.message>span{
  display:flex;align-items:center;gap:.4rem;
  margin-bottom:.3rem;
  font-family:var(--font-mono);font-size:.625rem;
  letter-spacing:.12em;line-height:1.6;
  color:var(--text-muted);
}
.message.user>span{color:var(--text-secondary)}
.bubble{
  max-width:65ch;
  background:none;padding:0;border:0;
  color:var(--text-primary);
  white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.78;
}
.bubble img{
  display:block;max-width:100%;max-height:11.25rem;
  margin-bottom:.5rem;border:1px solid var(--border);border-radius:2px;
}
.waiting{
  display:flex;align-items:center;gap:.5rem;
  margin:.5rem 0 0;padding:.6rem .9rem;
  border-left:2px solid var(--border);
  color:var(--text-muted);font-size:.8125rem;
}
.waiting::before{
  content:"";width:6px;height:6px;flex:0 0 6px;border-radius:50%;
  background:var(--accent-amber);
}

.composer{padding:1rem 1.5rem 1.15rem;border-top:1px solid var(--border);background:var(--bg-surface)}
.suggestions{
  display:flex;gap:.4rem;overflow-x:auto;
  padding-bottom:.8rem;scrollbar-width:thin;
  scrollbar-color:var(--border-strong) transparent;
}
.suggestions button{
  flex-shrink:0;white-space:nowrap;
  padding:.3rem .65rem;font-size:.8125rem;
  background:var(--bg-sunken);border:1px solid var(--border);
  color:var(--text-secondary);border-radius:2px;
}
.suggestions button:hover{background:var(--bg-hover);border-color:var(--border-control);color:var(--text-primary)}
.composer textarea{min-height:5.25rem;max-height:11.25rem}
.composer-tools{
  display:flex;align-items:center;justify-content:space-between;
  gap:.75rem;margin-top:.6rem;
}
.composer-tools>span{font-size:.75rem;max-width:42%;line-height:1.6}
.composer-tools>div{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.composer-tools button,.composer-tools .button{font-size:.875rem;padding:.35rem .6rem}
.photo-preview{
  display:flex;align-items:center;gap:.75rem;
  margin-bottom:.6rem;font-size:.8125rem;color:var(--text-secondary);
}
.photo-preview img{height:3.75rem;max-width:6.25rem;object-fit:contain;border:1px solid var(--border);border-radius:2px}

/* 解题进度 */
.steps{list-style:none;padding:0;margin:0}
.steps li{position:relative;padding-bottom:.9rem}
.steps li:not(:last-child)::before{
  content:"";position:absolute;left:11px;top:1.55rem;bottom:0;width:1px;
  background:var(--border);
}
.steps button{
  display:flex;align-items:center;justify-content:flex-start;gap:.7rem;width:100%;
  padding:0;border:0;background:transparent;
  text-align:left;font-size:.875rem;color:var(--text-secondary);
  border-radius:var(--radius);
}
.steps button:hover{background:transparent;color:var(--text-primary)}
.steps span{
  display:grid;place-items:center;flex:0 0 23px;
  width:23px;height:23px;border-radius:2px;
  background:var(--bg-sunken);border:1px solid var(--border);
  color:var(--brand);font-family:var(--font-mono);font-size:.6875rem;font-weight:600;
}

/* ══════════════════════════════════════════════════════════════════════════
   14. 报告：指标 / 徽标 / 空态
   ══════════════════════════════════════════════════════════════════════════ */
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;
  padding:.5rem 0 1.5rem;border-bottom:1px solid var(--border);
}
/* 数值列底部对齐：等宽/衬线字号不同时基线才不会错位 */
.metrics>div{display:flex;flex-direction:column}
.metrics span{display:block;margin-bottom:.4rem;font-size:.8125rem;color:var(--text-muted)}
.metrics strong{
  margin-top:auto;
  font-family:var(--font-serif);font-size:1.75rem;font-weight:400;
  font-synthesis-weight:none;
  color:var(--text-heading);font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.metrics .unknown{font-size:1.25rem;color:var(--text-secondary);font-family:var(--font-sans);font-weight:500}
.knowledge{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;padding-top:1.1rem}
.knowledge p{display:flex;align-items:center;gap:.5rem;margin:0;font-size:.9375rem;color:var(--text-secondary)}

.badge{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.15rem .5rem;
  background:var(--bg-sunken);border:1px solid var(--border);
  border-radius:2px;color:var(--text-primary);
  font-size:.8125rem;line-height:1.7;white-space:nowrap;
}
/* 状态一律「图标 + 文字 + 底色 + 描边」四重编码，不靠颜色单独表意 */
.badge .glyph{
  font-family:var(--font-mono);font-size:.75rem;font-weight:700;line-height:1;
  color:var(--text-secondary);
}
.badge.good{background:var(--success-tint);border-color:var(--success-border)}
.badge.good .glyph{color:var(--success-ink)}
.badge.warn{background:var(--warning-tint);border-color:var(--warning-border)}
.badge.warn .glyph{color:var(--warning-ink)}
.badge.bad{background:var(--danger-tint);border-color:var(--danger-border)}
.badge.bad .glyph{color:var(--danger-ink)}
.badge.bad{color:var(--text-primary)}

.empty{
  padding:1.75rem 1rem;border-radius:var(--radius);
  background:var(--bg-sunken);border:1px solid var(--border-subtle);
  text-align:center;color:var(--text-muted);font-size:.9375rem;
}
.duration{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.duration span{font-size:.875rem;color:var(--text-muted)}
.duration strong{
  font-family:var(--font-serif);font-size:1.5rem;font-weight:400;
  font-synthesis-weight:none;
  color:var(--text-heading);font-variant-numeric:tabular-nums;
}
.skeleton h2{color:var(--text-secondary);font-size:1.0625rem}
.skeleton div{height:2.2rem;margin:1.1rem 0;border-radius:2px;background:var(--bg-sunken)}

/* 重做卡 */
.redo .mode-icon{font-size:2.25rem;margin-bottom:1rem}
.redo button{margin-top:1.5rem;width:100%}

/* ══════════════════════════════════════════════════════════════════════════
   15. 语义块：提示 / 错误 / 公式 / 代码
   ══════════════════════════════════════════════════════════════════════════ */
/* 提示块：journal 旁注——琥珀细框 + 左侧 2px 强调线，正文仍是主文字色 */
.notice{
  margin:.75rem 0;
  padding:.7rem .9rem;
  background:var(--accent-amber-tint);
  border:1px solid var(--accent-amber-border);
  border-left:2px solid var(--accent-amber);
  border-radius:var(--radius);
  color:var(--text-primary);
  font-size:.875rem;line-height:1.7;
}
.error{
  display:flex;align-items:flex-start;gap:.5rem;
  margin:.75rem 0;
  padding:.7rem .9rem;
  background:var(--danger-tint);
  border:1px solid var(--danger-border);
  border-left:2px solid var(--danger);
  border-radius:var(--radius);
  color:var(--text-primary);
  font-size:.875rem;line-height:1.7;
}
.error::before{
  content:"!";flex:0 0 16px;
  display:grid;place-items:center;width:16px;height:16px;margin-top:.15rem;
  border:1px solid var(--danger);border-radius:50%;
  color:var(--danger);font-family:var(--font-mono);
  font-size:.6875rem;font-weight:700;line-height:1;
}
.notice::before{
  content:"备注";display:block;margin-bottom:.2rem;
  font-family:var(--font-mono);font-size:.625rem;letter-spacing:.14em;
  color:var(--accent-amber-ink);
}

/* 公式块：等宽 + 青绿染底，用于数学/物理关系式（推导语义）
   注意：不要再用左侧竖线——上层 .message.ai 已经有青绿竖线，避免双层轨道 */
.formula{
  display:flex;align-items:baseline;flex-wrap:wrap;gap:.5rem;
  margin-top:.7rem;padding:.55rem .8rem;
  background:var(--accent-teal-tint);
  border:1px solid var(--accent-teal-border);
  border-radius:var(--radius);
  font-family:var(--font-mono);
  font-size:.875rem;line-height:1.9;
  color:var(--text-primary);
  tab-size:2;
}
.formula-label{
  flex:0 0 auto;
  font-size:.625rem;letter-spacing:.14em;
  color:var(--text-secondary);
}
/* 代码块：同一套 token，仅换掉左侧竖线语义色（用于计算机类题目） */
.code-block{
  margin:.7rem 0;padding:.7rem .9rem;
  background:var(--bg-sunken);
  border:1px solid var(--border-subtle);
  border-left:2px solid var(--brand);
  border-radius:0 var(--radius) var(--radius) 0;
  font-family:var(--font-mono);
  font-size:.8125rem;line-height:1.85;
  color:var(--text-primary);
  overflow-x:auto;
  white-space:pre;
}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ══════════════════════════════════════════════════════════════════════════
   16. Toast / 页脚
   ══════════════════════════════════════════════════════════════════════════ */
#toast{
  position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);
  z-index:100;max-width:90vw;
  padding:.6rem 1.1rem;
  background:var(--toast-bg);
  border:1px solid var(--toast-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-pop);
  color:var(--text-inverse);
  font-size:.875rem;line-height:1.6;
  opacity:0;pointer-events:none;
  transition:opacity .16s ease;
}
#toast.show{opacity:1}

.colophon{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  width:100%;max-width:var(--shell);margin:2rem auto 0;
  padding:1.1rem clamp(1rem,3vw,2rem) 2.5rem;
  border-top:1px solid var(--border);
  font-family:var(--font-mono);font-size:.6875rem;
  letter-spacing:.06em;color:var(--text-muted);line-height:1.7;
}
.colophon span{white-space:nowrap}

/* ══════════════════════════════════════════════════════════════════════════
   17. 工具类
   ══════════════════════════════════════════════════════════════════════════ */
.sr{
  position:absolute;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

/* ══════════════════════════════════════════════════════════════════════════
   18. 响应式
   ══════════════════════════════════════════════════════════════════════════ */
@media (max-width:900px){
  .chat-layout{grid-template-columns:1fr}
  .chat-layout aside{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .problem-card{max-height:none}
  .chat-card{height:48rem;min-height:40rem}
  .mode{padding:1.5rem}
  .composer-tools{flex-wrap:wrap}
  .composer-tools>span{max-width:100%}
  .composer-tools>div{margin-left:auto}
}
@media (max-width:620px){
  #app{padding:1.75rem 1rem 1.5rem}
  h1{font-size:1.5rem}
  #app header{margin-bottom:1.5rem}
  .input-grid,.practice-grid,.mode-grid{grid-template-columns:1fr;gap:1.125rem}
  .card{padding:1.25rem}
  .mode-grid{margin:1.75rem 0}
  .mode{min-height:14rem}
  .chat-layout aside{grid-template-columns:1fr;gap:1rem}
  .chat-head{flex-direction:column;padding:1rem}
  .chat-actions{flex-direction:row;width:100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem;text-align:left}
  .chat-actions>div{margin:0;gap:.25rem}
  .chat-actions button{padding:.3rem .45rem;font-size:.75rem}
  .chat-actions select{font-size:.8125rem;padding:.25rem .45rem}
  .chat-card{height:48rem;min-height:38rem}
  .messages,.composer{padding-inline:1rem}
  .bubble{max-width:100%}
  .composer-tools>div{flex-wrap:wrap;justify-content:flex-end}
  .composer-tools>span{width:100%;margin-bottom:.25rem}
  .metrics{grid-template-columns:1fr;gap:1rem}
  .metrics>div{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
  .metrics span{margin:0}
  .knowledge{display:block}
  .knowledge p{margin-bottom:.5rem}
  .problem-input{min-height:13.75rem}
  .question .check{float:none;display:block;margin:.4rem 0 0}
  .masthead-inner{padding-block:.85rem;gap:.75rem}
  .brand-text small{display:none}
  .flow-tick{width:20px}
  .theme-switch .seg-label{display:none}
  .theme-switch button{padding:.3rem .45rem}
  footer button{flex:1;min-width:0}
  .colophon{flex-direction:column;gap:.35rem;padding-bottom:2rem}
}

<script>
const V=Number(document.body.dataset.version),rich=V>1;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bank=[
 {tag:'计算题 · 牛顿第二定律',text:'质量为 2 kg 的物块放在光滑水平面上，受到水平向右的 6 N 拉力。求物块的加速度。',topic:'牛顿第二定律'},
 {tag:'计算题 · 匀变速直线运动',text:'一辆汽车以 10 m/s 的速度沿直线行驶，随后以 2 m/s² 的加速度匀加速运动 5 s。求这段时间内的位移。',topic:'匀变速直线运动'},

];

let state={page:1,tab:'text',text:'',image:'',upload:0,reading:false,selected:-1,problem:null,mode:'',messages:[],steps:[],draft:'',photo:'',busy:false,started:0,reports:[],report:null,recording:false,error:''};

function render(){
 document.title=`物理 AI 解题助手 · 第${V}版`;
 $('#app').innerHTML=({1:inputPage,2:modePage,3:chatPage,4:reportPage,5:practicePage}[state.page])();syncFlow();
 bind();
 if(state.page===3){const log=$('#messages');log.scrollTop=log.scrollHeight;}
}
function inputPage(){return `${heading('物理难题，AI 陪你一步步想通')}<div class="input-grid"><section class="card"><h2>输入你的题目</h2><div class="tabs" role="tablist">${['text','image'].map((t,i)=>`<button role="tab" aria-selected="${state.tab===t}" data-tab="${t}" class="${state.tab===t?'active':''}">${i?'图片上传':'文字输入'}</button>`).join('')}</div>${(!rich||state.tab==='image')?`<div class="upload-status"><label>上传题目进度 <span>${state.upload}%</span></label><progress value="${state.upload}" max="100"></progress></div>`:''}${state.tab==='text'?`<label class="sr" for="problem-text">题目内容</label><textarea id="problem-text" class="problem-input" placeholder="${rich?'输入题干、已知条件和要求解的问题。':'请输入物理题目'}">${esc(state.text)}</textarea>`:`<label class="upload-box">${state.image?`<img src="${state.image}" alt="已上传的题目图片">`:'<span class="upload-icon">＋</span>'}<strong>${state.image?'重新上传题目':'选择题目图片'}</strong><span>${rich?'上传清晰的题目图片，尽量包含完整题干和示意图。':'支持图片上传'}</span><input type="file" id="problem-file" accept="image/*"></label>${rich&&state.image?`<p class="notice">图片已读取。演示版未连接文字识别，请在下方补充题干，并核对数字、单位和符号。</p><label for="recognized">题目文字（可编辑）</label><textarea id="recognized" placeholder="请输入图片中的完整题干">${esc(state.text)}</textarea>`:''}`}${state.error?`<p role="alert" class="error">${esc(state.error)}</p>`:''}${rich&&state.selected>=0?'<p class="notice">当前已选择右侧题库题目；编辑或上传内容将改用左侧题目。</p>':''}</section><section class="card"><h2>示例物理题</h2><div class="question-list">${bank.map((q,i)=>`<button class="question ${state.selected===i?'selected':''}" data-question="${i}" aria-pressed="${state.selected===i}"><span class="tag">${q.tag}</span>${state.selected===i?'<span class="check">✓ 已选择</span>':''}<p>${q.text}</p></button>`).join('')}</div></section></div>${foot(rich?'确认题目':'确认','confirm-problem',!validProblem())}`}
function validProblem(){return !state.reading&&(state.selected>=0||!!state.text.trim()||(!rich&&!!state.image));}
function modePage(){return `${heading('选择你的解题方式')}<div class="mode-grid">${['companion','solo'].map((m,i)=>`<button class="card mode ${state.mode===m?'selected':''}" data-mode="${m}" aria-pressed="${state.mode===m}"><span class="mode-icon" aria-hidden="true">${i?'✎':'▤'}</span><span class="check">${state.mode===m?'✓':''}</span><h2>${i?'自主训练':'AI 伴学'}</h2>${rich?`<h3>${i?'先自己试一试，需要时再叫 AI。':'你边做边说，AI 在关键步骤给你一点提示。'}</h3><p>${i?'记录过程时不主动打断，只有你明确求助时才给提示。':'会关注你输入或提交的解题步骤，帮助你发现遗漏的条件，不直接给答案。'}</p>`:`<p>${i?'你先独立思考，只有在你主动提问时，AI 才会给出提示。':'AI 会实时关注你的解题步骤，在对话框中给出建议或提示，但不会直接给出答案。'}</p>`}</button>`).join('')}</div>${rich?'<p class="mode-note muted">做题过程中也可以切换模式。</p>':''}${foot(rich?'确认，开始做题':'确认','start',!state.mode)}`}
function chatPage(){return `<div class="chat-layout"><aside><section class="card problem-card"><h2>当前题目</h2>${state.problem.image?`<img class="question-image" src="${state.problem.image}" alt="当前题目图片">`:''}<p>${esc(state.problem.text)}</p></section><section class="card progress-card"><h2>解题进度</h2>${state.steps.length?`<ol class="steps">${state.steps.map((s,i)=>`<li><button data-step="${s.message}"><span>${i+1}</span><div>${esc(s.label)}</div></button></li>`).join('')}</ol>`:'<p class="muted">从你的第一步想法开始记录。</p>'}</section></aside><section class="card chat-card"><div class="chat-head"><div><h2>AI 解题对话</h2><small class="muted">演示回复 · 提示思路，不直接给答案</small></div><div class="chat-actions"><label class="sr" for="mode-switch">切换解题模式</label><select id="mode-switch"><option value="companion" ${state.mode==='companion'?'selected':''}>AI 伴学</option><option value="solo" ${state.mode==='solo'?'selected':''}>自主训练</option></select><div>${btn('查看报告','view-report','outline')}${btn('跳过报告','skip-report','quiet')}</div></div></div><div id="messages" class="messages" role="log" aria-live="polite">${state.messages.map((m,i)=>`<div id="message-${i}" class="message ${m.role}"><span>${m.role==='user'?'你':'AI 助手'}</span><div class="bubble">${m.image?`<img src="${m.image}" alt="提交的解题照片">`:''}${esc(m.text)}${m.formula?`<div class="formula"><span class="formula-label">关系式</span>${esc(m.formula)}</div>`:''}</div></div>`).join('')}${state.busy?'<div class="waiting">正在整理提示…</div>':''}</div><div class="composer"><div class="suggestions" aria-label="推荐问题，可左右滑动">${chips.map((c,i)=>`<button data-chip="${i}">${c}</button>`).join('')}</div>${state.photo?`<div class="photo-preview"><img src="${state.photo}" alt="待发送照片"><span>照片预览，确认后发送</span>${btn('取消照片','cancel-photo','quiet')}</div>`:''}<label class="sr" for="draft">输入你的想法或问题</label><textarea id="draft" rows="2" placeholder="说说你的思路，或问一个卡住你的问题…">${esc(state.draft)}</textarea><div class="composer-tools"><span class="muted" role="status">${state.recording?'正在录音，点击停止后核对文字':state.error?esc(state.error):rich?'先想一步，再说一步':''}</span><div>${btn(state.recording?'停止录音':'语音输入','voice','quiet')}<label class="button quiet">拍照上传<input id="chat-file" type="file" accept="image/*" capture="environment"></label>${btn('发送','send','primary',state.busy)}</div></div></div></section></div>`}
function reportPage(){const r=state.report;return `${heading('学习报告')}<div class="report-stack">${!r?'<section class="card skeleton"><h2>正在整理学习报告…</h2><div></div><div></div><div></div></section>':`<section class="card"><h2>本次学习小结</h2><div class="metrics"><div><span>本次练习</span><strong>共 ${r.count} 题</strong></div><div><span>正确率</span><strong class="unknown">暂无法统计</strong></div><div><span>薄弱知识点</span><strong class="unknown">待确认</strong></div></div><div class="knowledge"><p><span class="badge good"><span class="glyph" aria-hidden="true">✓</span>掌握</span> 待确认</p><p><span class="badge warn"><span class="glyph" aria-hidden="true">!</span>待巩固</span> 待确认</p><p><span class="badge bad"><span class="glyph" aria-hidden="true">✕</span>薄弱</span> 待确认</p></div>${rich?'<p class="muted">尚无经过判定的作答结果，不能据此判断知识点掌握情况。</p>':''}</section><section class="card"><h2>错题摘要</h2><div class="empty">本次暂无已确认的错题</div></section><section class="card duration"><span>学习时长</span><strong>${r.minutes} 分钟</strong></section>`}</div>${foot('确认','finish-report',!r)}`}
function related(){let topic=state.problem.topic;if(!topic)return [];if(topic==='牛顿第二定律')return[{tag:'计算题 · 牛顿第二定律',topic,text:'质量为 3 kg 的木箱在粗糙水平面上受到水平拉力，拉力为 12 N，滑动摩擦力为 3 N。求木箱的加速度。'},{tag:'分析题 · 牛顿第二定律',topic,text:'电梯加速上升时，站在其中的同学受到的支持力与重力有什么关系？请从受力与加速度的方向分析。'},{tag:'分析题 · 牛顿第二定律',topic,text:'一个物块沿光滑斜面下滑。请分析哪些力影响它沿斜面方向的加速度。'}];if(topic==='匀变速直线运动')return[{tag:'计算题 · 匀变速直线运动',topic,text:'汽车以 20 m/s 的速度行驶，发现障碍后以 4 m/s² 的加速度匀减速刹车。求停车前的位移。'},{tag:'分析题 · 匀变速直线运动',topic,text:'小球竖直上抛，忽略空气阻力。请分析上升过程中速度与加速度的方向，以及最高点处的加速度。'}];return[{tag:'分析题 · 机械能守恒',topic,text:'小球从光滑轨道高处滑下后进入粗糙水平面。请分段判断机械能是否守恒，并说明原因。'},{tag:'分析题 · 机械能守恒',topic,text:'摆球从一侧静止释放，忽略阻力。请分析摆球从最高处运动至最低处时能量如何转化。'}];}
function practicePage(){const qs=related();return `${heading('把这一步，变成你的能力')}<div class="practice-grid"><section class="card redo"><span class="mode-icon" aria-hidden="true">↻</span><h2>${rich?'重做这道题':'重做'}</h2>${rich?'<p class="muted">再独立走一遍，看看哪一步已经想通。</p>':''}${btn(rich?'重做这道题':'重做','redo','outline')}</section><section class="card"><h2>举一反三</h2>${rich?'<p class="muted">用相近的知识点，试试新的情境。</p>':''}<div class="question-list">${qs.length?qs.map((q,i)=>`<button class="question" data-related="${i}"><span class="tag">${q.tag}</span><p>${q.text}</p></button>`).join(''):'<p class="empty">暂时没有合适的推荐题</p>'}</div></section></div><footer>${btn('返回','home','outline')}</footer>`}
function begin(){epoch++;state.started=Date.now();state.messages=[{role:'ai',text:'先说说你的想法：你准备从哪里入手，或者已经做到哪一步了？'}];state.steps=[];state.draft='';state.photo='';state.report=null;state.busy=false;state.error='';state.page=3;render();}

function go(p){stopVoice();state.error='';state.page=p;render();window.scrollTo(0,0);}

function action(a){if(a==='confirm-problem'&&validProblem()){state.problem=state.selected>=0?{...bank[state.selected]}:{text:state.text.trim(),image:state.tab==='image'?state.image:'',topic:''};state.mode='';go(2);}else if(a==='start'&&state.mode)begin();else if(a==='send')send();else if(a==='view-report'){stopVoice();state.report=null;go(4);const stamp=epoch;setTimeout(()=>{if(stamp!==epoch)return;state.report={count:1,minutes:Math.max(0.1,Math.round((Date.now()-state.started)/6000)/10)};state.reports.push({...state.report,problem:state.problem.text});if(state.page===4)render();},rich?650:0);}else if(a==='finish-report'||a==='skip-report')go(5);else if(a==='redo'){epoch++;state.mode='';go(2);}else if(a==='home'){epoch++;state={...state,page:1,mode:'',text:'',image:'',upload:0,selected:-1,tab:'text',error:''};render();}else if(a==='cancel-photo'){state.photo='';render();}else if(a==='voice')voice();}
function stepFor(t){if(/受力|力图|摩擦|支持|重力|拉力/.test(t))return '讨论受力关系';if(/公式|方程|定律|守恒/.test(t))return '选择物理规律';if(/计算|代入|单位|结果/.test(t))return '检查计算与单位';return '澄清条件与思路';}
function formulaFor(t){if(!/公式|方程|定律|守恒/.test(t))return '';const topic=(state.problem&&state.problem.topic)||'';if(topic==='牛顿第二定律')return 'F合 = m · a';if(topic==='匀变速直线运动')return 'x = v₀t + ½at²';if(topic==='机械能守恒')return 'Eₖ + Eₚ = 常量';return '∑F = m · a';}
function hint(t,hasImage){if(hasImage)return '演示版暂不能识别照片。请用文字描述图中的关键受力或你写下的步骤，我们先看其中一步。';if(/答案|直接.*解|完整.*解/.test(t))return '我们先推进一步：题目要求求出哪个物理量？';if(/不会|不知道|哪里入手|卡在/.test(t))return '先从题干找一个明确的信息：题目给出了哪些已知量？';if(/漏掉|条件/.test(t))return '再看一下题目对接触面或阻力的描述，它会影响你的分析吗？';if(/受力|力图|摩擦|支持|拉力|重力/.test(t))return '先选定研究对象：你列出的每一个力，分别是谁施加给它的？';if(/公式|方程|定律|守恒/.test(t))return '先检查使用条件：这个物理规律成立需要哪些前提，题目是否满足？';if(/换一种/.test(t))return '试着用自己的话描述一下：这个物体正在怎样运动？';if(/计算|单位|代入/.test(t))return '先检查你代入的各个量，是否都已经换成一致的单位？';return '你刚才的这一步依据题目中的哪个条件？我们先把它说清楚。';}
function send(){if(state.busy||(!state.draft.trim()&&!state.photo))return;stopVoice();let t=state.draft.trim(),pic=state.photo;state.messages.push({role:'user',text:t,image:pic});let label=stepFor(t);if(!rich||!state.steps.some(s=>s.label===label))state.steps.push({label,message:state.messages.length-1});state.draft='';state.photo='';state.error='';let asked=/[?？]|为什么|怎么|如何|能否|能给|请|提示|帮|不懂|不会|不知道|哪里|对吗|卡在|漏掉/.test(t);if(state.mode==='solo'&&!asked){render();toast('已记录你的解题步骤');return;}state.busy=true;const stamp=epoch;render();setTimeout(()=>{if(stamp!==epoch)return;state.messages.push({role:'ai',text:hint(t,!!pic),formula:formulaFor(t)});state.busy=false;if(state.page===3)render();},650);}
function fileRead(file,chat){if(!file)return;if(!file.type.startsWith('image/')){state.error='请选择图片文件，已输入的文字仍然保留。';render();return;}if(file.size>12*1024*1024){state.error='图片超过 12 MB，请选择较小的图片。';render();return;}const reader=new FileReader();if(!chat){state.reading=true;state.upload=0;state.selected=-1;state.error='';render();}reader.onprogress=e=>{if(!chat&&e.lengthComputable){state.upload=Math.round(e.loaded/e.total*100);const p=$('progress');if(p)p.value=state.upload;}};reader.onload=()=>{if(chat)state.photo=reader.result;else{state.image=reader.result;state.upload=100;state.reading=false;}state.error='';render();};reader.onerror=()=>{state.reading=false;state.error='图片读取失败，请重新上传；已填写内容已保留。';render();};reader.readAsDataURL(file);}
function voice(){if(state.recording){stopVoice();render();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.error='当前浏览器不支持语音输入，请使用文字输入。';render();return;}const pageEpoch=epoch,original=state.draft;recognition=new SR();recognition.lang='zh-CN';recognition.interimResults=false;recognition.onresult=e=>{if(epoch!==pageEpoch||state.page!==3)return;state.draft=original+(original?' ':'')+Array.from(e.results).map(r=>r[0].transcript).join('');state.recording=false;render();toast('请核对识别文字，再点击发送');};recognition.onerror=e=>{state.recording=false;state.error=e.error==='not-allowed'?'麦克风权限未开启，文字草稿已保留。':'语音识别未完成，文字草稿已保留。';if(state.page===3)render();};recognition.onend=()=>{state.recording=false;if(state.page===3)render();};try{recognition.start();state.recording=true;state.error='';render();}catch{state.error='无法启动语音输入，请使用文字输入。';render();}}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;state.error='';render();});document.querySelectorAll('[data-question]').forEach(el=>el.onclick=()=>{state.selected=+el.dataset.question;render();});document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{state.mode=el.dataset.mode;render();});document.querySelectorAll('[data-chip]').forEach(el=>el.onclick=()=>{state.draft=chips[+el.dataset.chip];render();$('#draft').focus();});document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>$('#message-'+el.dataset.step)?.scrollIntoView({behavior:'smooth',block:'center'}));document.querySelectorAll('[data-related]').forEach(el=>el.onclick=()=>{state.problem={...related()[+el.dataset.related]};state.mode='';epoch++;go(2);});for(const id of ['problem-text','recognized'])if($('#'+id))$('#'+id).oninput=e=>{state.text=e.target.value;state.selected=-1;document.querySelectorAll('[data-question]').forEach(q=>{q.classList.remove('selected');q.setAttribute('aria-pressed','false');q.querySelector('.check')?.remove();});const confirm=$('[data-action="confirm-problem"]');confirm.disabled=!validProblem();};if($('#problem-file'))$('#problem-file').onchange=e=>fileRead(e.target.files[0],false);if($('#chat-file'))$('#chat-file').onchange=e=>fileRead(e.target.files[0],true);if($('#draft'))$('#draft').oninput=e=>state.draft=e.target.value;if($('#mode-switch'))$('#mode-switch').onchange=e=>{state.mode=e.target.value;toast(`已切换为${state.mode==='solo'?'自主训练':'AI 伴学'}，对话已保留`);};}
render();

</script>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   主题控制器（三态 + 高对比），只负责 UI 绑定；上色在 <head> 已完成
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  var root = document.documentElement;
  var radios = Array.prototype.slice.call(document.querySelectorAll('[data-theme-set]'));
  var contrastBtn = document.getElementById('contrast-toggle');
  var LABEL = { light: '浅色', dark: '深色', system: '跟随系统' };

  function syncRadios(pref) {
    radios.forEach(function (b) {
      var on = b.dataset.themeSet === pref;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
  }

  function syncContrast() {
    var high = root.getAttribute('data-contrast') === 'high';
    contrastBtn.setAttribute('aria-pressed', high ? 'true' : 'false');
  }

  function announce(msg) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(announce.t);
    announce.t = setTimeout(function () { toast.classList.remove('show'); }, 2000);
  }

  function choose(pref) {
    window.Theme.set(pref, true);
    root.setAttribute('data-contrast', root.getAttribute('data-contrast'));
    syncRadios(pref);
    announce('主题：' + LABEL[pref]);
  }

  radios.forEach(function (b) {
    b.addEventListener('click', function () { choose(b.dataset.themeSet); });
    b.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault();
      var i = radios.indexOf(b), n = radios.length;
      var next = radios[(i + (e.key === 'ArrowRight' ? 1 : n - 1)) % n];
      next.focus();
      choose(next.dataset.themeSet);
    });
  });

  contrastBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-contrast') === 'high' ? 'normal' : 'high';
    root.setAttribute('data-contrast', next);
    try { localStorage.setItem(window.Theme.CKEY, next); } catch (err) {}
    syncContrast();
    announce(next === 'high' ? '已开启高对比' : '已恢复标准对比');
  });

  // 跟随系统时，系统主题变化要实时生效
  var onSystemChange = function () {
    if (window.Theme.pref() === 'system') window.Theme.repaint();
  };
  if (window.Theme.mqDark.addEventListener) window.Theme.mqDark.addEventListener('change', onSystemChange);
  else if (window.Theme.mqDark.addListener) window.Theme.mqDark.addListener(onSystemChange);

  syncRadios(window.Theme.pref());
  syncContrast();
})();
</script>
