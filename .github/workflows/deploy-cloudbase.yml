name: 部署 · 腾讯云静态托管

# 为什么用 Actions 而不是平台自带的 Git 集成：
#   腾讯云 CloudBase 的静态网站托管没有"连上仓库就自动部署"的按钮，
#   官方的自动化路径就是 CLI。所以这里把本地那条命令搬进 CI：
#     1. tcb login --apiKeyId <SecretId> --apiKey <SecretKey>
#     2. tcb hosting deploy ./public -e <envId>
#   和本地部署完全同一条，不引入第二套构建。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TCB_SECRET_ID / TCB_SECRET_KEY —— 腾讯云 API 密钥。
#   建议用只授予 CloudBase 权限的子账号密钥，别用主账号密钥。
#   没配也安全：guard 那步会跳过并打一条 notice，不会留一个红灯。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudbase-main
  cancel-in-progress: true

env:
  TCB_ENV_ID: bubujie-d9gr331f098d64df2
  SITE: https://bubujie-d9gr331f098d64df2-1506789471.tcloudbaseapp.com/

jobs:
  test:
    name: 先跑测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 仓库零依赖，不需要 npm ci；少一步就少一个挂掉的借口。
      - run: node test/run.js
      - run: node scripts/audit-ui-style.js

  deploy:
    name: 部署静态托管
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 有没有配密钥
        id: guard
        env:
          SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
        run: |
          if [ -z "$SECRET_ID" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过部署::仓库没配 TCB_SECRET_ID / TCB_SECRET_KEY，这次只跑测试不上传。"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 CloudBase CLI
        if: steps.guard.outputs.skip != '1'
        run: npm install -g @cloudbase/cli

      - name: 登录
        if: steps.guard.outputs.skip != '1'
        env:
          SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: tcb login --apiKeyId "$SECRET_ID" --apiKey "$SECRET_KEY"

      # 只传 public/ —— 这一批是纯前端改动时的部署面；
      # 云函数（/api）由 cloudbaserc.json 管，src/ 变了要单独 tcb fn deploy。
      - name: 上传 public/
        if: steps.guard.outputs.skip != '1'
        run: tcb hosting deploy ./public -e "$TCB_ENV_ID"

      # 上传成功 ≠ 用户看得到。CDN 有自己的缓存，
      # 所以带 no-cache 把线上 HTML 拉回来，跟本地比一次 hash。
      - name: 线上核对
        if: steps.guard.outputs.skip != '1'
        env:
          SITE_URL: ${{ env.SITE }}
        run: |
          want=$(sha256sum public/index.html | cut -d' ' -f1)
          for i in 1 2 3 4 5; do
            curl -sS -H 'Cache-Control: no-cache' "$SITE_URL" -o /tmp/live.html || true
            got=$(sha256sum /tmp/live.html | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              echo "线上与本地一致：$got"
              exit 0
            fi
            echo "第 $i 次不一致（线上 $(wc -c < /tmp/live.html) 字节），等 10 秒再试"
            sleep 10
          done
          echo "::error::线上 index.html 与本地不一致，CDN 可能还在刷，或部署没生效"
          exit 1
